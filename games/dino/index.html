<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>森林急件快遞 · CxQ 跑酷</title><link rel="stylesheet" href="../storybook/common.css?v=20260921-polish1"><link rel="stylesheet" href="game.css?v=20260921-polish1"><link rel="stylesheet" href="theme-v2.css?v=20260921-polish1"><script src="../storybook/common.js?v=20260924-mobile1"></script><link rel="stylesheet" href="../storybook/mobile-menu.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/game-ui.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/mobile-refresh.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/play-surface.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/batch-theme.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/director.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/studio.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/polish.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/gameplay-repair.css?v=20260924-mobile1"><link rel="stylesheet" href="../storybook/mobile24.css?v=20260924-mobile1"></head><body><main><header class="topbar"><small>FOREST EXPRESS · DELIVERY BOARD</small></header><section id="home"><div class="station strip"><p class="eyebrow">今天的急件，交給你了</p><h1>森林急件快遞</h1><p>跨過樹根，穿過枝葉，把問候平安送到。</p></div><div class="dispatch"><article class="paper crew"><h2>選擇出勤夥伴</h2><div id="roles" class="roles"></div><p id="skill-description"></p><div class="form-row"><label>觸控配置<select id="hand"><option value="right">右手跳躍</option><option value="left">左手跳躍</option></select></label><label>玩法<select id="mode"><option value="endless">正常模式</option></select></label></div><label>難度<select id="difficulty"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select></label><p class="instructions">短按跳躍、長按跳高，遇到低枝葉按下滑。鍵盤：空白／↑ 跳躍，↓ 下滑，X 月夜技能。角色的裝飾不算碰撞。</p></article><article class="paper routes"><h2>選擇配送路線</h2><div id="routes"></div><p id="notice" role="status"></p><button id="start">背上郵袋出發</button><div class="buttons"><button id="journal">配送手帳</button><button id="records">角色紀錄</button></div></article></div></section><section id="play" hidden><div class="hud strip"><span><small>已跑距離</small><strong id="distance">0 m</strong></span><span><small>收集信件</small><strong id="mail">0</strong></span><span id="route-label"></span><button id="pause">暫停</button></div><canvas id="canvas" width="960" height="360" tabindex="0" aria-label="森林跑酷，空白鍵跳躍，下方向鍵下滑，X 使用技能"></canvas><div class="controls"><button id="slide">下滑 ↓</button><div id="status" class="strip status-line">準備好了嗎？</div><button id="skill">角色能力</button><button id="jump">跳躍 ↑</button></div></section></main><script src="game.js?v=20260924-mobile1"></script><script src="../storybook/mobile-menu.js?v=20260924-mobile1"></script><script src="../storybook/play-session.js?v=20260921-polish1"></script><script src="../storybook/game-settings.js?v=20260921-polish1"></script><script src="../storybook/studio.js?v=20260921-polish1"></script><script src="../storybook/polish.js?v=20260921-polish1"></script><script src="../storybook/gameplay-repair.js?v=20260924-mobile1"></script></body></html>
