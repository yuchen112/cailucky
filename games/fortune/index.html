<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>每日占卜</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../shared/runtime.css"><script src="../shared/runtime.js"></script><style>.oracle-cards button{background:linear-gradient(135deg,#536578,#293b54)!important;border:2px solid #ccb985!important;box-shadow:0 8px 20px #26354930!important}.oracle-cards button::before{content:'✧';position:absolute;inset:15%;display:grid;place-items:center;font-size:42px;color:#e6d09a;border:1px solid #d3bb7755;border-radius:50%}.journal-entries article{position:relative;border-radius:18px;background:#fff9ed;padding:24px!important;margin-bottom:12px}.journal-entries [data-delete]{border:1px solid #d7c6ac;border-radius:8px;color:#776653;background:#fffaf0;padding:8px 12px;font-size:12px}.holding{animation:ritual-hold .8s linear both}@keyframes ritual-hold{to{box-shadow:0 0 0 8px #dbbf7988,0 0 45px #dbbf7966}}</style><style>.journal-thumb{width:70px;height:85px;object-fit:contain}.journal-entries article{display:grid!important;grid-template-columns:70px 1fr auto;gap:16px}.journal-entries [data-delete]{grid-column:3}.journal-entries details{font-size:14px;line-height:1.8}.journal-entries summary{color:#857149;cursor:pointer;padding:8px 0}.reading-paper{animation:paper-arrive .45s ease-out}.oracle-cards button span{position:relative;background:url('assets/characters/dream.png') center/contain no-repeat!important;opacity:.5}.oracle-cards button.selected{transform:translateY(-18px)!important;box-shadow:0 10px 28px #bb9d6699!important}@keyframes paper-arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){.journal-entries article{grid-template-columns:52px 1fr;gap:12px}.journal-thumb{width:50px;height:65px}.journal-entries article>span{display:none}.journal-entries [data-delete]{grid-column:2;justify-self:end}}</style></head><body><div id="app"></div><script src="app.js"></script></body></html>
