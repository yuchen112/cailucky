<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>森林敲敲樂 · CxQ 打地鼠</title><link rel="stylesheet" href="../shared/runtime.css"><script src="../shared/runtime.js"></script><link rel="stylesheet" href="game.css"></head><body><main class="forest"><header><a href="../../index.html#games">CxQ 遊戲館</a><span>FOREST LITTLE FESTIVAL</span></header><section id="home"><div class="eyebrow">和森林的小夥伴打聲招呼</div><h1>森林敲敲樂</h1><p class="subtitle">眼明、手快，也別忘了溫柔。</p><div class="mascot"><img src="assets/normal.webp" alt="戴著葉子的森林地鼠"></div><div class="paper"><h2>今天，想怎麼玩？</h2><div id="modes" class="modes"></div><label class="difficulty">節奏 <select id="difficulty"><option value="easy">散步 · 輕鬆</option><option value="normal" selected>小跑 · 標準</option><option value="hard">衝刺 · 困難</option><option value="expert">疾風 · 達人</option></select></label><p id="rule"></p><button id="start" class="primary">進入森林</button><button id="records" class="quiet">查看我的紀錄</button></div></section><section id="play" hidden><aside class="hud"><div><small>本次心光</small><strong id="score">0</strong></div><div><small id="clockLabel">剩餘時間</small><strong id="time">60</strong></div><div><small>生命</small><strong id="lives">♥♥♥</strong></div><button id="pause">暫停</button></aside><div class="field"><div class="play-heading"><h2 id="modeTitle"></h2><span id="combo">準備好了嗎？</span></div><div id="board" class="board" aria-label="九個地鼠洞"></div><div id="feedback" role="status">點地鼠得分，避開炸彈</div><div class="legend"><span><img src="assets/normal.webp" alt="">+10</span><span><img src="assets/gold.webp" alt="">+30</span><span><img src="assets/heart.webp" alt="">補生命</span><span><img src="assets/bomb.webp" alt="">別敲我</span></div></div></section></main><dialog id="modal"></dialog><script src="game.js"></script></body></html>
