<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>CxQ 森林敲敲樂</title>
    <link rel="stylesheet" href="../shared/runtime.css?v=20260929-mobile1" />
    <link rel="stylesheet" href="../shared/lantern.css" />
    <link rel="stylesheet" href="../shared/action-cabinet.css" />
    <link rel="stylesheet" href="lantern-whack.css" />
    <script src="../shared/audio-engine-original.js?v=2"></script>
    <script src="../shared/runtime.js?v=20261010-loadingart3"></script>
  <link rel="stylesheet" href="../shared/mobile-title.css?v=1"><link rel="stylesheet" href="../shared/mobile-game.css?v=rebuild1"></head>
  <body data-mobile-game="whack">
    <header class="masthead">
      <a href="../classic-hall/index.html?v=20261012-mobile1"
        >‹ 返回經典遊戲館</a
      ><span>CxQ · 森林敲敲樂</span><span>06 / 12</span>
    </header>
    <main>
      <section id="home" class="action-home">
        <div class="action-cover">
          <img src="../shared/cabinet/whack.webp" alt="" />
          <div>
            <p class="label">機台 06 · 反應挑戰</p>
            <h1>森林敲敲樂</h1>
            <p>等夥伴探頭再敲，記得避開炸彈。</p>
          </div>
          <div class="mascot" hidden></div>
        </div>
        <div class="action-setup">
          <h2>選擇挑戰</h2>
          <div id="modes"></div>
          <label
            >出現節奏<select id="difficulty">
              <option value="easy">散步 · 輕鬆</option>
              <option value="normal" selected>小跑 · 標準</option>
              <option value="hard">衝刺 · 困難</option>
              <option value="expert">疾風 · 達人</option>
            </select></label
          >
          <p id="rule"></p>
          <button id="start" class="primary">開始挑戰</button
          ><button id="records">森林紀錄</button>
          <details>
            <summary>十位夥伴</summary>
            <div id="cast-list"></div>
          </details>
        </div>
      </section>
      <section id="play" hidden>
        <div class="action-round">
          <div class="stats">
            <div><span>心光</span><strong id="score">0</strong></div>
            <div>
              <span id="clockLabel">剩餘時間</span><strong id="time">60</strong>
            </div>
            <div><span>生命</span><strong id="lives"></strong></div>
          </div>
          <button id="pause">暫停</button>
        </div>
        <div class="hole-field">
          <div id="board" aria-label="九個地鼠洞"></div>
        </div>
        <div class="whack-round-status">
          <b id="modeTitle"></b><span id="combo"></span>
          <p id="feedback" role="status"></p>
        </div>
        <div class="legend"></div>
      </section>
    </main>
    <dialog id="modal"></dialog>
    <script src="game.js"></script>
  <script src="../shared/mobile-title.js?v=1"></script><script src="../shared/mobile-game.js?v=rebuild1"></script></body>
</html>
