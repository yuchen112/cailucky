<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星願飛行郵差 · CxQ</title><link rel="stylesheet" href="../storybook/common.css?v=20260913-four-games-1"><link rel="stylesheet" href="game.css?v=20260913-four-games-1"><script src="../storybook/common.js?v=20260913-four-games-1"></script></head><body><main><header class="topbar"><a href="../../index.html">回到 CxQ 首頁</a><small>SKY POST · DEPARTURES</small></header><section id="home"><div class="terminal-title"><p class="eyebrow">天空郵站 · 今日出發</p><h1>星願飛行郵差</h1><p>每一次輕點，都讓思念更靠近。</p><div id="pilot"></div></div><div class="boarding paper"><h2>你的登機信封</h2><details><summary id="pilot-label">選擇飛行角色</summary><div id="roles" class="roles"></div></details><div class="form-row"><label>旅程<select id="mode"><option value="mission">分段送信</option><option value="endless">無盡飛行</option><option value="practice">寬通道練習</option></select></label><label>郵站關卡<select id="stage"></select></label></div><label>航線<select id="route"><option value="sky">晨光雲海</option><option value="forest">森林郵路 · 送達 10 封解鎖</option><option value="moon">月夜郵路 · 送達 25 封解鎖</option></select></label><div class="form-row"><label>載具<select id="vehicle"><option value="0">紙信封</option><option value="1">葉片滑翔翼 · 5 封</option><option value="2">星雲坐墊 · 15 封</option></select></label><label>尾跡<select id="trail"><option value="0">輕盈無痕</option><option value="1">星願尾跡 · 10 封</option></select></label></div><p class="instructions">點畫面或按空白鍵上升，鬆手緩降。穿過郵站空隙，順路收好信件。角色裝飾不算碰撞，所有角色操控相同。</p><p id="notice" role="status"></p><button id="start">蓋章，準備起飛</button><div class="buttons"><button id="letters">郵件收藏</button><button id="records">航程紀錄</button></div></div></section><section id="play" hidden><div class="flight-hud strip"><span><small>通過郵站</small><b id="score">0</b></span><span><small>本次信件</small><b id="mail">0</b></span><button id="pause">暫停</button></div><canvas id="canvas" width="400" height="620" tabindex="0" aria-label="飛行航道，點擊或空白鍵上升"></canvas><div id="status" class="strip status-line">點一下，向天空出發。</div></section></main><script src="game.js?v=20260913-four-games-1"></script></body></html>
