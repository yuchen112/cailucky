<!doctype html>
<html lang="zh-Hant">
  <head><script src="../shared/mobile-viewport.js?v=20261112-touch1"></script><script src="../shared/mobile-theme.js?v=20261112-homeart1"></script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>CxQ 星願飛行郵差</title>
    <link rel="stylesheet" href="../shared/lantern.css?v=20261111-viewport1" />
    <link rel="stylesheet" href="../shared/action-cabinet.css?v=20261111-viewport1" />
    <script src="../shared/classic-audio.js?v=20261111-viewport1"></script>
  <link rel="stylesheet" href="../shared/mobile-title.css?v=20261112-homeart1"><link rel="stylesheet" href="../shared/mobile-game.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-polish.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-pause.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-theme.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-panels.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-viewport.css?v=20261112-touch1"></head>
  <body data-mobile-game="flappy" data-action="flappy">
    <header class="masthead">
      <a href="../classic-hall/index.html?v=20261012-mobile1"
        >‹ 返回經典遊戲館</a
      ><span>CxQ · 星願飛行郵差</span><span>09 / 12</span>
    </header>
    <main>
      <section id="home" class="action-home">
        <div class="action-cover">
          <img src="../shared/cabinet/flappy.webp" alt="" />
          <div>
            <p class="label">機台 09 · 拍翅飛行</p>
            <h1>星願飛行郵差</h1>
            <p>點按拍翅，穿過郵站開口，順路收集信件。</p>
          </div>
        </div>
        <div class="action-setup">
          <h2>出發前設定</h2>
          <label
            >航程<select id="mode">
              <option value="endless">無盡航程</option>
              <option value="mission">六站送信旅程</option>
              <option value="practice">輕鬆練習</option>
            </select></label
          ><label>郵站<select id="stage"></select></label
          ><label
            >航線<select id="route">
              <option value="sky">晨光雲海</option>
              <option value="forest">森林郵路</option>
              <option value="moon">月夜郵路</option>
            </select></label
          ><label
            >載具<select id="vehicle">
              <option value="0">星願飛機</option>
              <option value="1">紙信封</option>
              <option value="2">葉片滑翔翼</option>
              <option value="3">星雲坐墊</option>
            </select></label
          ><label
            >尾跡<select id="trail">
              <option value="0">輕盈無痕</option>
              <option value="1">星願尾跡 · 10 封</option>
            </select></label
          >
          <div id="pilot"></div>
          <details>
            <summary id="pilot-label">選擇角色</summary>
            <div id="roles" class="roster"></div>
          </details>
          <p id="notice" role="status"></p>
          <button id="start" class="primary">開始遊戲</button>
          <nav>
            <button id="letters">郵件收藏</button
            ><button id="records">航程紀錄</button>
          </nav>
        </div>
      </section>
      <section id="play" hidden>
        <header class="action-round">
          <div class="stats">
            <div><span>郵站</span><strong id="score">0</strong></div>
            <div><span>信件</span><strong id="mail">0</strong></div>
          </div>
          <button id="pause">暫停</button>
        </header>
        <div class="action-field">
          <canvas
            id="canvas"
            width="400"
            height="620"
            tabindex="0"
            aria-label="星願飛行郵差遊玩畫面"
          ></canvas>
        </div>
        <div class="action-notes"><p id="status" role="status"></p></div>
      </section>
    </main>
    <script src="lantern-game.js?v=20261111-viewport1"></script>
  <script src="../shared/mobile-title.js?v=20261112-homeart1"></script><script src="../shared/mobile-game.js?v=20261111-viewport1"></script><script src="../shared/mobile-modes.js?v=20261111-viewport1"></script><script src="../shared/mobile-polish.js?v=20261112-touch1"></script><script src="../shared/mobile-pause.js?v=20261111-viewport1"></script><script src="../shared/mobile-panels.js?v=20261111-viewport1"></script></body>
</html>
