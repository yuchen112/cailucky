<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>四葉草探險地圖 · CxQ 踩地雷</title><link rel="stylesheet" href="../storybook/common.css?v=20260921-polish1"><link rel="stylesheet" href="game.css?v=20260921-polish1"><link rel="stylesheet" href="theme-v2.css?v=20260921-polish1"><script src="../storybook/common.js?v=20260921-polish1"></script><link rel="stylesheet" href="../storybook/mobile-menu.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/game-ui.css?v=20260921-polish1"><link rel="stylesheet" href="refresh.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/mobile-refresh.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/play-surface.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/batch-theme.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/director.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/studio.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/polish.css?v=20260921-polish1"><link rel="stylesheet" href="../storybook/gameplay-repair.css?v=20260923-repair1"></head><body><main><header class="topbar"><small>CLOVER FIELD NOTES</small></header><section id="home"><div class="map-title"><p class="eyebrow">慢慢找，安全的路就在眼前</p><h1>四葉草探險地圖</h1><p>讀懂每一個數字，替夥伴找到回家的路。</p></div><div class="planning"><article class="paper partner"><h2>探險夥伴</h2><div id="roles" class="roles"></div><p id="partner-line"></p><button id="tutorial">第一次探險？看圖解</button></article><article class="paper settings"><h2>本次勘查任務</h2><div class="form-row"><label>地圖<select id="preset"><option value="easy">初級 · 9 × 9 · 10 陷阱</option><option value="medium">中級 · 12 × 12 · 24 陷阱</option><option value="hard">高級 · 16 × 16 · 40 陷阱</option><option value="custom">自訂地圖</option></select></label><label>模式<select id="mode"><option value="standard">標準挑戰</option><option value="practice">引導練習</option><option value="logic">可推理解謎 · 9 × 9</option></select></label></div><div id="custom" class="form-row" hidden><label>列數<input id="rows" type="number" min="5" max="24" value="9"></label><label>欄數<input id="cols" type="number" min="5" max="30" value="9"></label><label>陷阱<input id="mines" type="number" min="1" value="10"></label></div><div class="form-row"><label><input id="contrast" type="checkbox"> 高對比數字</label><label><input id="timer" type="checkbox" checked> 顯示計時</label></div><label>長按插旗<input id="longpress" type="range" min="300" max="800" step="50" value="500"><small id="longpress-label">0.5 秒；也可用明確的翻格／插旗按鈕。</small></label><p class="instructions">第一格及周圍保證安全。數字表示周圍八格的陷阱數，找出所有安全格就過關。大地圖可以放大及捲動。</p><p id="notice" role="status"></p><button id="start">展開探險地圖</button><button id="records">我的探險紀錄</button></article></div></section><section id="play" hidden><aside class="field-notes paper"><div id="play-role"></div><h2>探險筆記</h2><p id="mode-label"></p><p id="hint-text">先選一格，從安全的地方出發。</p><button id="hint">給我推理提示</button><button id="pause">暫停探索</button><button id="map-home">行前準備</button></aside><div class="map-area"><div class="hud strip"><span><small>待標記陷阱</small><strong id="remaining">10</strong></span><span id="clock-wrap"><small>探索時間</small><strong id="clock">0:00</strong></span><span><small>已找到安全格</small><strong id="progress">0</strong></span></div><div class="tools strip"><button id="reveal-mode" aria-pressed="true">翻開地圖</button><button id="flag-mode" aria-pressed="false">插上探險旗</button><label>格子大小<select id="zoom"><option value="38" selected>標準</option><option value="46">大</option><option value="56">特大</option></select></label></div><div id="map-scroll"><div id="board" role="grid" aria-label="探險棋盤"></div></div><p id="status" class="strip status-line">點數字可快速展開已標記完成的周圍格。</p></div></section></main><script src="game.js?v=20260923-repair1"></script><script src="../storybook/mobile-menu.js?v=20260921-polish1"></script><script src="../storybook/play-session.js?v=20260921-polish1"></script><script src="../storybook/game-settings.js?v=20260921-polish1"></script><script src="../storybook/studio.js?v=20260921-polish1"></script><script src="../storybook/polish.js?v=20260921-polish1"></script><script src="../storybook/gameplay-repair.js?v=20260923-repair1"></script></body></html>
