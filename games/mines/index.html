<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CxQ 四葉草探險地圖</title>
<link rel="stylesheet" href="../shared/lantern.css">
<link rel="stylesheet" href="lantern-mines.css">
<script src="../shared/classic-audio.js?v=mobile-fix2"></script>
<link rel="stylesheet" href="../shared/mobile-title.css?v=1"><link rel="stylesheet" href="../shared/mobile-game.css?v=rebuild1"><link rel="stylesheet" href="../shared/mobile-polish.css?v=2"><link rel="stylesheet" href="../shared/mobile-pause.css?v=3"></head>
<body data-mobile-game="mines" class="lantern-mines">
<header class="masthead"><a href="../classic-hall/index.html?v=20261012-mobile1">‹ 經典遊戲館</a><span>CxQ · 經典遊戲館</span><span aria-hidden="true">03 / 12</span></header>
<main>
<section id="home">
  <header class="mission-title"><p class="label">機台 03 · 地圖推理</p><h1>四葉草探險地圖</h1><p>解讀數字，標記陷阱，找出每一處安全格。</p></header>
  <div class="mission">
    <article>
      <h2>勘查簡報</h2>
      <label>勘查規則<select id="mode"><option value="standard">標準挑戰</option><option value="logic">純推理解謎</option><option value="practice">提示練習</option></select></label>
      <label>地圖大小<select id="preset"><option value="easy">初級 · 9 × 9</option><option value="medium">中級 · 12 × 12</option><option value="hard">高級 · 16 × 16</option><option value="custom">自訂</option></select></label>
      <div id="custom" hidden><label>列數<input id="rows" type="number" min="5" max="24" value="9"></label><label>欄數<input id="cols" type="number" min="5" max="30" value="9"></label><label>陷阱<input id="mines" type="number" min="1" value="10"></label></div>
      <details><summary>操作設定</summary><label class="switch"><input id="contrast" type="checkbox">高對比數字</label><label class="switch"><input id="timer" type="checkbox" checked>顯示計時</label><label>長按插旗<input id="longpress" type="range" min="300" max="800" step="50" value="500"><span id="longpress-label">0.5 秒</span></label></details>
      <button id="start" class="primary">展開地圖</button>
      <div class="mission-buttons"><button id="tutorial">玩法圖解</button><button id="records">探險紀錄</button></div>
    </article>
    <article class="expedition-cast"><img src="lantern-cover.webp" alt=""><h2>選擇探險夥伴</h2><div id="roles" class="roster"></div><p id="partner-line"></p></article>
  </div>
</section>
<section id="play" hidden>
  <div class="map-tools">
    <p id="mode-label" class="label"></p>
    <div class="stats"><div><span>陷阱</span><strong id="remaining">10</strong></div><div id="clock-wrap"><span>時間</span><strong id="clock">0:00</strong></div><div><span>安全格</span><strong id="progress">0</strong></div></div>
    <div class="mission-buttons"><button id="reveal-mode" class="primary" aria-pressed="true">翻格</button><button id="flag-mode" aria-pressed="false">插旗</button></div>
    <label class="zoom-control">格子大小<select id="zoom"><option value="38">標準</option><option value="48">大</option><option value="62">特大</option></select></label>
    <button id="hint">推理提示</button><button id="pause">暫停</button><button id="map-home">回行前準備</button>
    <div id="play-role"></div>
  </div>
  <div class="map-workspace"><p id="status" aria-live="polite"></p><div id="map-scroll" tabindex="0"><div id="board" role="grid" aria-label="勘查棋盤"></div></div><p id="hint-text"></p></div>
</section>
<p id="notice" role="status"></p>
</main>
<script src="lantern-game.js"></script>
<script src="../shared/mobile-title.js?v=1"></script><script src="../shared/mobile-game.js?v=rebuild1"></script><script src="../shared/mobile-modes.js?v=2"></script><script src="../shared/mobile-polish.js?v=2"></script><script src="../shared/mobile-pause.js?v=3"></script></body>
</html>
