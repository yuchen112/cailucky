<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#11172a"><meta name="description" content="與原創旅伴踏上星界遠征。搭配專屬裝備，探索各地秘境，收集素材，培育自己的戰鬥流派。"><title>CxQ 星界遠征</title><link rel="stylesheet" href="expedition.css?v=6.8"></head>
<body><canvas id="game" aria-label="冒險戰場"></canvas><canvas id="home-hero" hidden aria-hidden="true"></canvas>
<main id="lobby"><div id="lobby-scene" aria-hidden="true"></div><div class="scene-shade"></div><div class="ambient" aria-hidden="true"></div>
<header class="topbar"><a href="../../?view=game-hub" class="back">‹ 遊戲館</a><div class="brand"><img src="art/v5/cover.webp" alt="CxQ 星界遠征"><span>星界遠征 <small>啟程・探索・成長</small></span></div><div class="wallet"><i class="item-icon icon-gem"></i><span id="wallet">0 星光</span><button id="sound" class="small-button" aria-label="開啟聲音設定">聲音設定</button><button id="help" class="small-button">冒險筆記</button></div></header>
<nav class="lobby-tabs" aria-label="冒險選單"><button data-tab="journey" aria-pressed="true">選擇遠征</button><button data-tab="workshop" aria-pressed="false">裝備工坊</button><button data-tab="traits" aria-pressed="false">角色特性</button><button data-tab="codex" aria-pressed="false">冒險圖鑑</button></nav>
<div class="lobby-layout"><section class="character-stage"><div class="stage-heading"><span class="eyebrow">CXQ ORIGINAL · 與你同行</span><h1 id="role-name">露緹</h1><p id="role-title">星願魔法師</p></div><div class="hero-presentation"><div class="summon-ring" aria-hidden="true"></div><img id="role-preview" src="../../assets/characters/cxq-role-dream.webp" width="1254" height="1254" alt="露緹角色立繪"></div><div class="role-signature art-frame"><span id="role-weapon"></span><p id="role-description"></p><div id="role-abilities"></div></div><div id="roster" class="roster" role="group" aria-label="選擇角色"></div></section>
<section id="content-panel" class="content-panel"><div id="journey-panel"><div class="panel-heading"><div><span class="eyebrow">CHOOSE YOUR DESTINATION</span><h2>這次，要前往哪裡？</h2></div></div><p class="section-copy">不同地圖、不同敵群與素材。選擇你想挑戰的冒險。</p><div id="map-grid" class="map-grid" role="group" aria-label="選擇地圖"></div><div id="map-detail" class="map-detail art-frame"></div><div id="difficulty-options" class="difficulty-row" role="group" aria-label="遠征難度"></div><p id="difficulty-copy" class="fine"></p><p id="difficulty-unlock" class="fine"></p></div><div id="workshop-panel" hidden></div><div id="traits-panel" hidden></div><div id="codex-panel" hidden></div></section></div>
<footer class="expedition-bar"><div class="mission-summary"><span id="mission-summary"></span><small id="storage-note">進度儲存在此瀏覽器。</small><a id="legacy-link" href="play.html?v=legacy3" hidden>繼續舊版冒險 ›</a></div><div class="launch-actions"><button id="resume" hidden>繼續遠征</button><button id="start" class="primary" disabled>正在準備冒險…</button></div></footer></main>
<div id="hud" hidden><div class="player-frame art-frame"><div class="portrait"><img id="hud-portrait" src="../../assets/characters/cxq-role-dream.webp" alt="露緹"></div><div class="player-info"><div class="player-name"><b id="hud-name">露緹</b><span id="level">Lv.1</span></div><div class="health"><i id="hpbar"></i><span id="hptext">100 / 100</span></div><div class="experience"><i id="xpbar"></i></div></div></div><div class="clock art-frame"><small id="hud-map">星晶洞窟</small><b id="timer">00:00</b><span id="objective">探索地圖，收集星晶</span><div id="wave-track" class="wave-track"></div></div><div class="battle-actions"><span id="kills">擊敗 0</span><button id="pause" class="round-key" aria-label="暫停遊戲">Ⅱ</button></div><div id="loadout" aria-label="裝備與祝福"></div><div id="bossbar" class="art-frame" hidden><span id="boss-name"></span><div><i></i></div></div><div id="material-counter"></div></div>
<div id="touch" hidden><button id="auto-aim" type="button" aria-pressed="false">滑鼠瞄準</button><small id="move-hint">按住戰場展開搖桿 · 拖曳移動 · 放開停止</small><div id="stick" aria-label="浮動移動搖桿" hidden><div class="stick-ring"></div><span></span></div><div id="aim-zone" aria-label="攻擊方向搖桿"><span id="aim-stick"><i></i></span><small>瞄準</small></div><aside id="skill-inspect" hidden></aside><button id="skill" class="battle-key" aria-label="角色主動技能"><i class="item-icon icon-star"></i><b id="skill-label">角色技能</b><small id="skill-note">E</small><span class="key-shade"></span></button><button id="dash" class="battle-key" aria-label="星閃衝刺"><i class="item-icon icon-pulse"></i><b id="dash-label">星閃</b><small id="dash-note">閃避</small><span class="key-shade"></span></button></div>
<div id="orientation-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="orientation-title"><div class="orientation-card art-frame"><div class="portrait-device" aria-hidden="true"></div><h2 id="orientation-title">請將裝置轉為直向</h2><p>直向畫面能保留完整戰場與操作空間。</p><small>遠征已暫停，轉回直向後可繼續。</small><button id="portrait-fullscreen" hidden>全螢幕顯示</button></div></div><div id="toast" role="status" aria-live="polite"></div><div id="modal" class="overlay" hidden><section class="dialog art-frame" role="dialog" aria-modal="true" aria-labelledby="modal-title"><span id="modal-eyebrow" class="eyebrow"></span><h2 id="modal-title"></h2><p id="modal-copy"></p><div id="modal-body"></div><div id="modal-actions"></div></section></div>
<div id="cinematic" hidden aria-live="polite"><div class="cinema-lines"></div><div class="cinema-content"><span id="cinema-tag"></span><i id="cinema-icon" class="item-icon"></i><h2 id="cinema-title"></h2><p id="cinema-copy"></p></div></div><canvas id="feedback" aria-hidden="true"></canvas><script type="module" src="expedition.mjs?v=6.8-original1"></script></body></html>
