<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#11172a"><meta name="description" content="十位原創角色、五座冒險地圖與三十種怪物。搭配專屬裝備，收集素材，培育自己的戰鬥流派。"><title>星願割草冒險｜旅團遠征・基礎試玩版</title><link rel="stylesheet" href="expedition.css?v=4"></head>

<div class="lobby-layout"><section class="character-stage"><div class="stage-heading"><span class="eyebrow">CXQ ORIGINAL · 十位旅伴</span><h1 id="role-name">露緹</h1><p id="role-title">星願魔法師</p></div><div class="hero-presentation"><div class="summon-ring" aria-hidden="true"></div><canvas id="role-preview" width="640" height="640" aria-label="角色戰鬥動作預覽"></canvas><span id="role-index" class="role-index">02 / 10</span></div><div class="role-signature art-frame"><span id="role-weapon"></span><p id="role-description"></p><div id="role-abilities"></div></div><div id="roster" class="roster" role="group" aria-label="選擇角色"></div></section>
