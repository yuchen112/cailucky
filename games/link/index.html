#28202c88;overflow:hidden}.game:before{content:"";position:absolute;inset:7px;border:2px dashed #b6925b88;border-radius:20px;pointer-events:none}.board-wrap{position:relative;transform-origin:center}.board{display:grid;gap:var(--gap);padding:10px}.tile{width:var(--tile);height:var(--tile);border:0;padding:0;border-radius:18px;cursor:pointer;position:relative;background:linear-gradient(145deg,#fff8e8,#e8dcc6);box-shadow:0 5px 9px #46362f66,inset 0 0 0 2px #f2d596;transition:transform .15s,filter .15s,opacity .2s;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover;padding:1px;background:transparent;display:block;border-radius:16px}.tile:hover{transform:translateY(-2px)}.tile.selected{transform:scale(1.08);box-shadow:0 0 0 4px #fff8bb,0 0 18px #f3c85e}.tile.hint{animation:pulse .65s infinite alternate}.tile.empty{opacity:0;pointer-events:none;transform:scale(.4)}@keyframes pulse{to{transform:scale(1.13);filter:brightness(1.25)}}#path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:8}.magic-core{stroke-dasharray:7 10;animation:dash .55s linear infinite}.magic-halo{animation:breathe .5s ease-in-out infinite alternate}@keyframes dash{to{stroke-dashoffset:-34}}@keyframes breathe{to{opacity:.95;stroke-width:10}}.toolbar{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px}.art-btn{height:58px;border-radius:22px;font-size:14px;text-shadow:0 2px 2px #563828;background:center/100% 100% no-repeat url('assets/ui/button-clover.png');box-shadow:none;padding:0 12px}.art-btn:nth-child(2){background-image:url('assets/ui/button-moon.png')}.art-btn:nth-child(3){background-image:url('assets/ui/button-peach.png')}.art-btn:nth-child(4){background-image:url('assets/ui/button-star.png')}.art-btn:active{transform:translateY(4px);box-shadow:inset 0 0 0 2px #594a3d,0 1px 0 #6d5032}.modal-mask{position:fixed;inset:0;background:#272132b8;display:none;place-items:center;padding:16px;z-index:20;backdrop-filter:blur(6px)}.modal-ma <body>
<main class="app">
<header class="brand"><div class="logo"><h1>夢境織光</h1><p id="subtitle">角色收藏連連看</p></div><div class="header-actions"><button class="round-btn help" id="help" aria-label="玩法說明">?</button><button class="round-btn pause" id="pause" aria-label="暫停">Ⅱ</button></div></header>
<section class="stats"><div class="stat"><b id="left">0</b><span>待配對</span></div><div class="stat"><b id="time">00:00</b><span>旅程時間</span></div><div class="stat"><b id="hints">3</b><span>靈光提示</span></div><div class="stat"><b id="shuffles">3</b><span>命運洗牌</span></div></section>
<section class="game" id="game"><div class="board-wrap" id="wrap"><div class="board" id="board"></div><svg id="path"></svg></div><div class="overlay" id="pauseLayer"><div><b>旅程暫停</b><p>點右上角繼續冒險</p></div></div></section>
<nav class="toolbar"><button class="art-btn" id="new">✦ 新旅程</button><button class="art-btn" id="hint">燈 靈光</button><button class="art-btn" id="shuffle">↝ 洗牌</button><button class="art-btn" id="settings">⚙ 設定</button></nav>
</main>
<div class="modal-mask show" id="setup"><div class="modal"><h2 id="modalTitle">選擇這次的旅程</h2><p id="modalDesc">選擇喜愛的圖案，展開這次的織光旅程</p><div class="fields"><div class="field"><label>冒險難度</label><select id="difficulty"><option value="easy">悠閒・6 × 6</option><option value="normal" selected>經典・8 × 8</option><option value="hard">挑戰・8 × 10</option></select></div><div class="field"><label>時間模式</label><select id="mode"><option value="0">無限旅程</option><option value="300">5 分鐘倒數</option><option value="180">3 分鐘倒數</option></select></div><div class="field"><label>連連看圖案系列</label><div class="theme-grid">
<button class="theme active" data-set="characters"><img src="assets/sets/characters/00.png"><span>我的角色</span></button>
<button class="theme" data-set="animals"><img src="assets/sets/animals/00.png"><span>森林動物</span></button>
<button class="theme" data-set="desserts"><img src="assets/sets/desserts/00.png"><span>甜點派對</span></button>
<button class="theme" data-set="magic"><img src="assets/sets/magic/00.png"><span>魔法寶物</span></button>
</div></div></div><div class="actions"><button id="close">返回</button><button class="go" id="start">開始冒險</button></div></div></div><div class="modal-mask" id="result"><div class="modal"><img class="result-companion" src="assets/sets/characters/00.png" alt="陪你完成旅程的夥伴"><h2 id="resultTitle">完成旅程！</h2><p id="resultText"></p><div class="actions"><button id="resultSet">調整設定</button><button class="go" id="again">再玩一次</button></div></div></div><div class="modal-mask" id="howto"><div class="modal"><h2>冒險玩法</h2><p>用最短的魔法絲線，讓相同夥伴重逢</p><div class="route-guide"><figure><svg viewBox="0 0 100 60" role="img" aria-label="零次轉彎"><path d="M15 30H85"/></svg><figcaption>直線 · 0 個彎</figcaption></figure><figure><svg viewBox="0 0 100 60" role="img" aria-label="一次轉彎"><path d="M15 45H70V10"/></svg><figcaption>L 形 · 1 個彎</figcaption></figure><figure><svg viewBox="0 0 100 60" role="img" aria-label="兩次轉彎"><path d="M15 45V12H85V45"/></svg><figcaption>繞行 · 2 個彎</figcaption></figure></div><div class="howto"><div class="rule"><i>①</i><div><b>找出相同角色</b><span>依序點選兩張相同的角色卡牌。</span></div></div><div class="rule"><i>⌁</i><div><b>最多轉彎兩次</b><span>路線不能穿過其他卡牌，最多轉兩個彎，也能從棋盤外圍繞行。</span></div></div><div class="rule"><i>✦</i><div><b>善用靈光與洗牌</b><span>找不到時使用靈光；沒有路時用洗牌重整。</span></div></div><div class="rule"><i>✓</i><div><b>完成旅程</b><span>在時間結束前配對所有角色。</span></div></div></div><div class="actions" style="grid-template-columns:1fr"><button class="go" id="howClose">我知道了</button></div></div></div><div class="toast" id="toast"></div>
<script>
const setCounts={characters:10,animals:16,desserts:16,magic:16};let activeSet='characters',draftSet='characters',turn=0,pending=null;
const $=s=>document.querySelector(s), els={board:$('#board'),wrap:$('#wrap'),game:$('#game'),path:$('#path'),left:$('#left'),time:$('#time'),hints:$('#hints'),shuffles:$('#shuffles'),pause:$('#pause'),pauseLayer:$('#pauseLayer'),setup:$('#setup'),result:$('#result'),toast:$('#toast')};let S={rows:8,cols:8,board:[],selected:null,left:0,hints:3,shuffles:3,started:false,paused:false,elapsed:0,limit:0,timer:null};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function build(){turn++;clearTimeout(pending);pending=null;activeSet=draftSet;els.pauseLayer.classList.remove('show');els.pause.classList.remove('play');clearPath();CxQ.resume();const d=$('#difficulty').value,[r,c]=d==='easy'?[6,6]:d==='hard'?[8,10]:[8,8];S.rows=r;S.cols=c;S.limit=+$('#mode').value;let vals=[];for(let i=0;i<r*c/2;i++)vals.push(i%setCounts[activeSet],i%setCounts[activeSet]);vals=shuffle(vals);S.board=Array.from({length:r+2},()=>Array(c+2).fill(null));let k=0;for(let y=1;y<=r;y++)for(let x=1;x<=c;x++)S.board[y][x]=vals[k++];S.left=r*c;S.selected=null;S.hints=3;S.shuffles=3;S.elapsed=0;S.started=true;S.paused=false;clearInterval(S.timer);S.timer=setInterval(tick,1000);render();fit();update()}
function render(){els.board.innerHTML='';els.board.style.gridTemplateColumns=`repeat(${S.cols},var(--tile))`;for(let r=1;r<=S.rows;r++)for(let c=1;c<=S.cols;c++){let v=S.board[r][c],b=document.createElement('button');b.className='tile'+(v===null?' empty':'')+(S.selected&&S.selected.r===r&&S.selected.c===c?' selected':'');b.dataset.r=r;b.dataset.c=c;if(v!==null)b.innerHTML=`<img draggable="false" src="assets/sets/${activeSet}/${String(v).padStart(2,'0')}.png" alt="角色卡牌">`;b.onclick=()=>pick(r,c);els.board.appendChild(b)}}
function pass(r,c,t){return r>=0&&r<=S.rows+1&&c>=0&&c<=S.cols+1&&((r===t.r&&c===t.c)||S.board[r][c]===null)}
function path(a,b){const ds=[[-1,0],[0,1],[1,0],[0,-1]],seen=Array.from({length:S.rows+2},()=>Array.from({length:S.cols+2},()=>[9,9,9,9])),q=[{r:a.r,c:a.c,d:-1,t:0,p:[a]}];while(q.length){let z=q.shift();for(let d=0;d<4;d++){let turns=z.d<0?0:z.t+(z.d!==d);if(turns>2)continue;let r=z.r+ds[d][0],c=z.c+ds[d][1];while(pass(r,c,b)){let p=[...z.p,{r,c}];if(r===b.r&&c===b.c)return simplify(p);if(seen[r][c][d]>turns){seen[r][c][d]=turns;q.push({r,c,d,t:turns,p})}r+=ds[d][0];c+=ds[d][1]}}}return null}
function simplify(p){return p.filter((x,i)=>i===0||i===p.length-1||!((p[i-1].r===x.r&&x.r===p[i+1].r)||(p[i-1].c===x.c&&x.c===p[i+1].c)))}
function pick(r,c){if(pending||!S.started||S.paused||S.board[r][c]===null)return;let v=S.board[r][c];if(!S.selected){S.selected={r,c,v};render();return}if(S.selected.r===r&&S.selected.c===c){S.selected=null;render();return}let a=S.selected,b={r,c,v},p=a.v===v&&path(a,b);if(!p){S.selected=b;render();toast('這兩位夥伴還連不到彼此');return}CxQ.sound('match');draw(p);S.board[a.r][a.c]=S.board[r][c]=null;S.left-=2;S.selected=null;pending=setTimeout(()=>{pending=null;clearPath();render();update();if(!S.left)finish(true);else if(!findPair())reshuffle(false)},250)}
function cells(){let a=[];for(let r=1;r<=S.rows;r++)for(let c=1;c<=S.cols;c++)if(S.board[r][c]!==null)a.push({r,c,v:S.board[r][c]});return a}function findPair(){let a=cells();for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i].v===a[j].v){let p=path(a[i],a[j]);if(p)return{a:a[i],b:a[j],p}}return null}
function draw(p){let st=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile'))+parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));const first=els.board.firstElementChild.getBoundingClientRect(),wrap=els.wrap.getBoundingClientRect();let pts=p.map(o=>`${first.left-wrap.left+first.width/2+(o.c-1)*st},${first.top-wrap.top+first.height/2+(o.r-1)*st}`).join(' ');els.path.innerHTML=`<defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><polyline class="magic-halo" points="${pts}" fill="none" stroke="#b49cff" stroke-width="8" opacity=".5" filter="url(#glow)"/><polyline class="magic-core" points="${pts}" fill="none" stroke="#fff6a9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g fill="#fffbd0"><circle r="3"><animateMotion dur=".65s" repeatCount="indefinite" path="M0,0"/></circle></g>`}function clearPath(){els.path.innerHTML=''}
function hint(){if(!S.hints||S.paused)return;let p=findPair();if(!p)return;S.hints--;update();document.querySelectorAll('.tile').forEach(t=>{let r=+t.dataset.r,c=+t.dataset.c;if((r===p.a.r&&c===p.a.c)||(r===p.b.r&&c===p.b.c))t.classList.add('hint')});draw(p.p);(()=>{const epoch=turn;setTimeout(()=>{if(epoch!==turn)return;clearPath();document.querySelectorAll('.hint').forEach(x=>x.classList.remove('hint'))},1600)})()}
function reshuffle(cost=true){if(cost&&(!S.shuffles||S.paused))return;if(cost)S.shuffles--;let cs=cells(),vs=shuffle(cs.map(x=>x.v));cs.forEach((x,i)=>S.board[x.r][x.c]=vs[i]);S.selected=null;render();update();toast('命運的絲線重新排列了');if(cs.length&&!findPair()){const first=cs[0],mate=cs.find(x=>x.v===S.board[first.r][first.c]&&(x.r!==first.r||x.c!==first.c));let best=null;for(let i=0;i<cs.length&&!best;i++)for(let j=i+1;j<cs.length;j++)if(path(cs[i],cs[j])){best=[cs[i],cs[j]];break}if(best){const[a,b]=best,v=S.board[a.r][a.c],m=cs.find(x=>(x.r!==a.r||x.c!==a.c)&&S.board[x.r][x.c]===v);if(m){[S.board[b.r][b.c],S.board[m.r][m.c]]=[S.board[m.r][m.c],S.board[b.r][b.c]];render()}}}}
function tick(){if(S.paused||!S.started||document.hidden||document.querySelector('.modal-mask.show'))return;S.elapsed++;update();if(S.limit&&S.elapsed>=S.limit)finish(false)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function update(){els.left.textContent=S.left;els.hints.textContent=S.hints;els.shuffles.textContent=S.shuffles;els.time.textContent=fmt(S.limit?Math.max(0,S.limit-S.elapsed):S.elapsed)}
function fit(){CxQ.orientation('landscape',S.started);let w=els.game.clientWidth-24,h=els.game.clientHeight-24;let size=Math.floor(Math.min((w-(S.cols-1)*7)/S.cols,(h-(S.rows-1)*7)/S.rows,76));document.documentElement.style.setProperty('--tile',size+'px')}
function finish(win){CxQ.sound(win?'win':'lose');const k='cxq-link-records',records=CxQ.read(k,[]);if(win&&Array.isArray(records)){records.unshift({seconds:S.elapsed,pairs:S.rows*S.cols/2,theme:activeSet,date:Date.now()});CxQ.write(k,records.slice(0,30))}S.started=false;clearInterval(S.timer);$('#resultTitle').textContent=win?'織光旅程完成！':'暮色已經降臨';$('#resultText').textContent=win?`你在 ${fmt(S.elapsed)} 內找回了全部 ${S.left?0:S.rows*S.cols/2} 組夥伴。`:'別擔心，重新整理線索再挑戰一次。';els.result.classList.add('show')}
function toast(t){els.toast.textContent=t;els.toast.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>els.toast.classList.remove('show'),1600)}
document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>{document.querySelectorAll('.theme').forEach(x=>x.classList.remove('active'));b.classList.add('active');draftSet=b.dataset.set;toast(`已選擇：${b.querySelector('span').textContent}`)});$('#help').onclick=()=>$('#howto').classList.add('show');$('#howClose').onclick=()=>$('#howto').classList.remove('show');$('#start').onclick=()=>{els.setup.classList.remove('show');build()};$('#new').onclick=()=>{if(!S.started||confirm('開始新旅程會重新排列目前棋盤。確定繼續？'))build()};$('#hint').onclick=hint;$('#shuffle').onclick=()=>reshuffle();$('#settings').onclick=()=>els.setup.classList.add('show');$('#close').onclick=()=>{draftSet=activeSet;document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('active',b.dataset.set===draftSet));if(S.started)els.setup.classList.remove('show')};$('#again').onclick=()=>{els.result.classList.remove('show');build()};$('#resultSet').onclick=()=>{els.result.classList.remove('show');els.setup.classList.add('show')};els.pause.onclick=()=>{if(!S.started)return;S.paused=!S.paused;if(!S.paused)CxQ.resume();els.pauseLayer.classList.toggle('show',S.paused);els.pause.classList.toggle('play',S.paused)};window.addEventListener('resize',fit);
CxQ.configure({music:'sherwood',pause(){if(S.started){S.paused=true;els.pauseLayer.classList.add('show');els.pause.classList.add('play')}}});
