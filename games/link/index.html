<!doctype html>
<html lang="zh-Hant">
  <head><script src="../shared/mobile-viewport.js?v=20261111-viewport1"></script><script src="../shared/mobile-theme.js?v=20261111-viewport1"></script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>CxQ 夢境織光</title>
    <link rel="stylesheet" href="../shared/runtime.css?v=20261111-viewport1" />
    <link rel="stylesheet" href="../shared/lantern.css?v=20261111-viewport1" />
    <link rel="stylesheet" href="lantern-link.css?v=20261111-viewport1" />
    <script src="../shared/classic-audio.js?v=20261111-viewport1"></script>
    <script src="../shared/runtime.js?v=20261111-viewport1"></script>
  <link rel="stylesheet" href="../shared/mobile-title.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-game.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-polish.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-pause.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-theme.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-panels.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-viewport.css?v=20261111-viewport1"></head>
  <body data-mobile-game="link">
    <section id="link-home">
      <img src="../shared/cabinet/link.webp" alt="" />
      <div class="entry">
        <a href="../classic-hall/index.html?v=20261012-mobile1"
          >‹ 返回經典遊戲館</a
        >
        <p class="label">機台 05 · 連線配對</p>
        <h1>夢境織光</h1>
        <p>找出相同圖案，以最多兩次轉彎的路線相連。</p>
        <div class="menu-actions">
          <button id="link-begin" class="primary">開始織光</button
          ><button id="link-rules">玩法說明</button
          ><button id="link-audio">聲音設定</button>
        </div>
      </div>
    </section>
    <main class="app">
      <header class="link-top">
        <div>
          <p class="label">夢境織光</p>
          <p id="subtitle"></p>
        </div>
        <div class="stats">
          <div><span>待配對</span><strong id="left">0</strong></div>
          <div><span>時間</span><strong id="time">00:00</strong></div>
          <div><span>提示</span><strong id="hints">3</strong></div>
          <div><span>洗牌</span><strong id="shuffles">3</strong></div>
        </div>
      </header>
      <section id="game">
        <div id="wrap">
          <div class="board" id="board"></div>
          <svg id="path"></svg>
        </div>
        <div id="pauseLayer" class="overlay">
          <p>已暫停 · 按「暫停」繼續</p>
        </div>
      </section>
      <nav class="toolbar">
        <button id="new">新旅程</button><button id="hint">提示</button
        ><button id="shuffle">洗牌</button><button id="pause">暫停</button
        ><button id="settings">設定</button><button id="help">玩法</button>
      </nav>
    </main>
    <div class="modal-mask show" id="setup">
      <div class="modal">
        <h2 id="modalTitle">選擇這次的旅程</h2>
        <p id="modalDesc">選擇喜愛的圖案，展開這次的織光旅程</p>
        <div class="fields">
          <div class="field">
            <label>冒險難度</label
            ><select id="difficulty">
              <option value="easy">悠閒・18 組</option>
              <option value="normal" selected>經典・32 組</option>
              <option value="hard">挑戰・40 組</option>
            </select>
          </div>
          <div class="field">
            <label>時間模式</label
            ><select id="mode">
              <option value="0">無限旅程</option>
              <option value="300">5 分鐘倒數</option>
              <option value="180">3 分鐘倒數</option>
            </select>
          </div>
          <div class="field">
            <label>連連看圖案系列</label>
            <div class="theme-grid">
              <button class="theme active" data-set="characters">
                <img src="../shared/rebuilt/role-luck.webp" /><span
                  >我的角色</span
                >
              </button>
              <button class="theme" data-set="animals">
                <img src="../shared/rebuilt/animal-0.webp" /><span
                  >森林動物</span
                >
              </button>
              <button class="theme" data-set="desserts">
                <img src="../shared/rebuilt/dessert-0.webp" /><span
                  >甜點派對</span
                >
              </button>
              <button class="theme" data-set="magic">
                <img src="../shared/rebuilt/artifact-0.webp" /><span
                  >魔法寶物</span
                >
              </button>
            </div>
          </div>
        </div>
        <div class="actions">
          <button id="close">返回</button
          ><button class="go" id="start">開始冒險</button>
        </div>
      </div>
    </div>
    <div class="modal-mask" id="result">
      <div class="modal">
        <img
          class="result-companion"
          src="../shared/rebuilt/role-luck.webp"
          alt="陪你完成旅程的夥伴"
        />
        <h2 id="resultTitle">完成旅程！</h2>
        <p id="resultText"></p>
        <div class="actions">
          <button id="resultSet">調整設定</button
          ><button class="go" id="again">再玩一次</button>
        </div>
      </div>
    </div>
    <div class="modal-mask" id="howto">
      <div class="modal">
        <h2>冒險玩法</h2>
        <p>用最短的魔法絲線，讓相同夥伴重逢</p>
        <div class="route-guide">
          <figure>
            <svg viewBox="0 0 100 60" role="img" aria-label="零次轉彎">
              <path d="M15 30H85" />
            </svg>
            <figcaption>直線 · 0 個彎</figcaption>
          </figure>
          <figure>
            <svg viewBox="0 0 100 60" role="img" aria-label="一次轉彎">
              <path d="M15 45H70V10" />
            </svg>
            <figcaption>L 形 · 1 個彎</figcaption>
          </figure>
          <figure>
            <svg viewBox="0 0 100 60" role="img" aria-label="兩次轉彎">
              <path d="M15 45V12H85V45" />
            </svg>
            <figcaption>繞行 · 2 個彎</figcaption>
          </figure>
        </div>
        <div class="howto">
          <div class="rule">
            <i>①</i>
            <div>
              <b>找出相同角色</b><span>依序點選兩張相同的角色卡牌。</span>
            </div>
          </div>
          <div class="rule">
            <i>⌁</i>
            <div>
              <b>最多轉彎兩次</b
              ><span
                >路線不能穿過其他卡牌，最多轉兩個彎，也能從棋盤外圍繞行。</span
              >
            </div>
          </div>
          <div class="rule">
            <i>✦</i>
            <div>
              <b>善用靈光與洗牌</b
              ><span>找不到時使用靈光；沒有路時用洗牌重整。</span>
            </div>
          </div>
          <div class="rule">
            <i>✓</i>
            <div><b>完成旅程</b><span>在時間結束前配對所有角色。</span></div>
          </div>
        </div>
        <div class="actions" style="grid-template-columns: 1fr">
          <button class="go" id="howClose">我知道了</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="lantern-game.js?v=20261111-viewport1"></script>
  <script src="../shared/mobile-title.js?v=20261111-viewport1"></script><script src="../shared/mobile-game.js?v=20261111-viewport1"></script><script src="../shared/mobile-modes.js?v=20261111-viewport1"></script><script src="../shared/mobile-polish.js?v=20261111-viewport1"></script><script src="../shared/mobile-pause.js?v=20261111-viewport1"></script><script src="../shared/mobile-panels.js?v=20261111-viewport1"></script></body>
</html>
