<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CxQ 心境織境</title>
<link rel="stylesheet" href="../shared/runtime.css?v=20260929-mobile1">
<link rel="stylesheet" href="../shared/lantern.css">
<script src="../shared/classic-audio.js?v=mobile-fix2"></script>
<script src="../shared/runtime.js?v=20261010-loadingart3"></script>
<link rel="stylesheet" href="../shared/mobile-title.css?v=1"><link rel="stylesheet" href="../shared/mobile-game.css?v=rebuild1"><link rel="stylesheet" href="../shared/mobile-polish.css?v=2"></head>
<body data-mobile-game="tetris">
<header class="masthead">
  <a href="../classic-hall/index.html?v=20261012-mobile1">‹ 經典遊戲館</a>
  <span>CxQ · 經典遊戲館</span>
  <span aria-hidden="true">01 / 12</span>
</header>
<main id="app">
  <p id="roundLoading" role="status"></p>
  <section id="homeScreen" class="screen show landing" aria-labelledby="gameTitle">
    <img class="cover" src="lantern-cover.webp" alt="">
    <div class="entry">
      <p class="label">機台 01 · 落下方塊</p>
      <h1 id="gameTitle">心境織境</h1>
      <p>排列落下的方塊，織成一條又一條完整的線。</p>
      <div class="menu-actions">
        <button class="primary" id="enterSetup">選擇旅程</button>
        <button id="quickClassic">直接玩經典模式</button>
        <button id="showHowto" aria-controls="howto" aria-expanded="false">玩法與操作</button>
      </div>
      <div id="howto" class="instructions">
        <p>移動與旋轉方塊，填滿一整行即可消除。</p>
        <p>鍵盤 ← → 移動，↑ 旋轉，↓ 下降，空白落下，C 保留。</p>
        <p>開啟角色冒險後，每消除四行可使用一次角色祝福。</p>
      </div>
    </div>
  </section>

  <section id="menu" class="screen setup" aria-labelledby="setupTitle">
    <div class="setup-heading"><div><p class="label">準備入場</p><h1 id="setupTitle">選擇旅程</h1></div><button id="backHome">返回首頁</button></div>
    <div class="setup-content">
      <div class="journey">
        <label for="journeyRule">玩法</label>
        <select id="journeyRule">
          <option value="marathon">經典馬拉松</option>
          <option value="sprint">40 行織線挑戰</option>
          <option value="zen">靜心編織 · 手動落下</option>
        </select>
        <label class="switch"><input id="blessingMode" type="checkbox" checked>啟用角色祝福</label>
        <h2>選擇旅伴</h2>
        <div class="roster" id="roster"></div>
      </div>
      <aside class="selection">
        <img id="detailCharImg" src="../shared/rebuilt/role-luck.webp" alt="">
        <div><h2 id="detailCharName">鈴可・幸運型</h2>
        <p id="detailCharPower">祝福充滿後，可移除盤面上一枚最棘手的方塊。</p>
        <p class="label">消除 4 行充能</p></div>
      </aside>
    </div>
    <button id="start" class="primary">開始旅程</button>
  </section>

  <section id="play" class="screen play" aria-label="遊戲台">
    <header class="round-head">
      <div class="stats">
        <div><span>分數</span><strong id="score">0</strong></div>
        <div><span>等級</span><strong id="level">1</strong></div>
        <div><span>消行</span><strong id="lines">0</strong></div>
        <div><span>最佳</span><strong id="best">0</strong></div>
      </div>
      <button id="pauseBtn">暫停</button>
    </header>
    <div class="stage">
      <div class="board-slot"><canvas id="board" aria-label="10 乘 20 方塊盤面"></canvas><div id="toast" role="status"></div></div>
      <aside class="queue">
        <div><span>下一塊</span><canvas id="next" width="84" height="84" aria-label="下一塊方塊"></canvas></div>
        <div><span>保留</span><canvas id="hold" width="84" height="84" aria-label="保留方塊"></canvas></div>
        <button id="skill" disabled>祝福 <span id="skillText">0/4</span></button>
        <div id="companion"><img id="companionImg" src="../shared/rebuilt/role-luck.webp" alt=""><strong id="charName">鈴可</strong><span id="charPower">幸運葉</span></div>
      </aside>
    </div>
    <nav class="controls" aria-label="方塊操作">
      <div>
        <button data-act="left">左移</button><button data-act="soft">下降</button><button data-act="right">右移</button>
      </div>
      <div>
        <button data-act="hold">保留</button><button data-act="rotate">旋轉</button><button data-act="drop" class="primary">落下</button>
      </div>
    </nav>
  </section>

  <section id="result" class="screen result" aria-labelledby="resultTitle">
    <img src="../shared/rebuilt/luck-victory.webp" alt="">
    <div><p class="label">旅程結算</p><h1 id="resultTitle">旅程結束</h1><p id="resultSummary"></p>
      <div class="menu-actions"><button class="primary" id="resultAgain">再挑戰一次</button><button id="resultSetup">更換玩法與旅伴</button></div>
    </div>
  </section>

  <section id="pause" class="pause-overlay" aria-label="遊戲暫停">
    <div class="pause-card">
      <img src="../shared/rebuilt/luck-idle.webp" alt="">
      <h2>遊戲暫停</h2>
      <div class="menu-actions"><button class="primary" id="resume">繼續編織</button><button id="restart">重新開始</button><button id="home">返回首頁</button></div>
    </div>
  </section>
</main>
<script src="game.js"></script>
<script src="../shared/mobile-title.js?v=1"></script><script src="../shared/mobile-game.js?v=rebuild1"></script><script src="../shared/mobile-modes.js?v=2"></script><script src="../shared/mobile-polish.js?v=2"></script></body>
</html>
