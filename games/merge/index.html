<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心光合成屋 · CxQ 球球融合</title><link rel="stylesheet" href="../storybook/common.css?v=20260920-studio1"><link rel="stylesheet" href="game.css?v=20260920-studio1"><link rel="stylesheet" href="theme-v2.css?v=20260920-studio1"><script src="../storybook/common.js?v=20260920-studio1"></script><script src="matter.min.js?v=20260920-studio1"></script><link rel="stylesheet" href="../storybook/mobile-menu.css?v=20260920-studio1"><link rel="stylesheet" href="../storybook/game-ui.css?v=20260920-studio1"><link rel="stylesheet" href="refresh.css?v=20260920-studio1"><link rel="stylesheet" href="../storybook/mobile-refresh.css?v=20260920-studio1"><link rel="stylesheet" href="../storybook/play-surface.css?v=20260920-studio1"><link rel="stylesheet" href="../storybook/batch-theme.css?v=20260920-studio1"><link rel="stylesheet" href="../storybook/director.css?v=20260920-studio1"><link rel="stylesheet" href="../storybook/studio.css?v=20260920-studio1"></head><body><main><header class="topbar"><small>CANDY CAPSULE LAB</small></header><section id="home"><article class="welcome paper"><p class="eyebrow">一顆小心光，也能長成大驚喜</p><h1>心光合成屋</h1><p>讓相同的收藏球相遇，合成你的夢境收藏。</p><div id="companion"></div><p id="greeting" class="small"></p><details open><summary>選擇陪伴角色</summary><div id="roles" class="roles"></div></details></article><article class="setup paper"><h2>調整你的扭蛋機</h2><label>玩法<select id="mode"><option value="classic">經典合成</option></select></label><label id="mission-row" hidden>任務<select id="mission"><option value="5">合成慶典氣球 · 入門</option><option value="7">合成守護鑰匙 · 進階</option><option value="9">合成雨露球 · 挑戰</option></select></label><label>桌面<select id="theme"><option value="warm">糖果玻璃扭蛋台</option><option value="night" disabled>霓虹糖果台 · 發現第 7 階解鎖</option></select></label><div class="form-row"><label><input id="guide" type="checkbox" checked> 落點提示線</label><label><input id="preview" type="checkbox" checked> 下一顆預覽</label></div><p class="instructions">移動手指或滑鼠選擇落點，放開投下。也可用左右鍵移動、空白鍵放下。球球持續超過收納線會結束；剛投下的球有緩衝時間。</p><p id="notice" role="status"></p><button id="start">啟動玻璃扭蛋機</button><div class="buttons"><button id="collection">收藏架</button><button id="records">我的紀錄</button></div></article></section><section id="play" hidden><aside class="workmate paper"><div id="play-role"></div><h2>一起整理心光</h2><p id="role-line"></p><p id="mission-info"></p><button id="ability" hidden>角色幫忙</button><button id="undo" hidden>撤回上一顆</button></aside><div class="workbench"><div class="hud strip"><span><small>本次心光</small><strong id="score">0</strong></span><span><small>最高收藏</small><strong id="tier">1</strong></span><button id="pause">暫停</button></div><canvas id="canvas" width="400" height="590" aria-label="球球融合工作區，左右鍵移動，空白鍵投球" tabindex="0"></canvas><div id="status" class="strip status-line">選個好位置，讓同伴相遇。</div><div class="mobile-drop"><button id="drop">投下收藏球</button><button id="help">玩法</button></div></div></section></main><script src="game.js?v=20260920-studio1"></script><script src="resume.js?v=20260920-studio1"></script><script src="../storybook/mobile-menu.js?v=20260920-studio1"></script><script src="../storybook/play-session.js?v=20260920-studio1"></script><script src="../storybook/game-settings.js?v=20260920-studio1"></script><script src="../storybook/studio.js?v=20260920-studio1"></script></body></html>
