<!doctype html>
<html lang="zh-Hant">
  <head><script src="../shared/mobile-viewport.js?v=20261112-touch1"></script><script src="../shared/mobile-theme.js?v=20261111-viewport1"></script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>CxQ 心光合成屋</title>
    <link rel="stylesheet" href="../shared/lantern.css?v=20261111-viewport1" />
    <link rel="stylesheet" href="../shared/action-cabinet.css?v=20261111-viewport1" />
    <script src="../shared/classic-audio.js?v=20261111-viewport1"></script>
  <link rel="stylesheet" href="../shared/mobile-title.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-game.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-polish.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-pause.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-theme.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-panels.css?v=20261111-viewport1"><link rel="stylesheet" href="../shared/mobile-viewport.css?v=20261112-touch1"></head>
  <body data-mobile-game="merge" data-action="merge">
    <header class="masthead">
      <a href="../classic-hall/index.html?v=20261012-mobile1"
        >‹ 返回經典遊戲館</a
      ><span>CxQ · 心光合成屋</span><span>12 / 12</span>
    </header>
    <main>
      <section id="home" class="action-home">
        <div class="action-cover">
          <img src="../shared/cabinet/merge.webp" alt="" />
          <div>
            <p class="label">機台 12 · 落球合成</p>
            <h1>心光合成屋</h1>
            <p>放下收藏球，讓相同的球相遇並升階。</p>
          </div>
        </div>
        <div class="action-setup">
          <h2>出發前設定</h2>
          <label
            >玩法<select id="mode">
              <option value="classic">經典合成</option>
              <option value="mission">收藏任務</option>
              <option value="practice">自由練習</option>
            </select></label
          >
          <div id="mission-row" hidden>
            <label
              >任務<select id="mission">
                <option value="5">慶典氣球</option>
                <option value="7">守護鑰匙</option>
                <option value="9">雨露球</option>
              </select></label
            >
          </div>
          <label
            >桌面<select id="theme">
              <option value="warm">糖果玻璃扭蛋台</option>
              <option value="night">霓虹糖果台 · 發現第 7 階解鎖</option>
            </select></label
          ><label class="switch"
            ><input id="guide" type="checkbox" checked />落點提示線</label
          ><label class="switch"
            ><input id="preview" type="checkbox" checked />下一顆預覽</label
          >
          <div id="companion"></div>
          <p id="greeting"></p>
          <details>
            <summary id="pilot-label">選擇角色</summary>
            <div id="roles" class="roster"></div>
          </details>
          <p id="notice" role="status"></p>
          <button id="start" class="primary">開始遊戲</button>
          <nav>
            <button id="collection">收藏架</button
            ><button id="records">我的紀錄</button>
          </nav>
        </div>
      </section>
      <section id="play" hidden>
        <header class="action-round">
          <div class="stats">
            <div><span>心光</span><strong id="score">0</strong></div>
            <div><span>最高階</span><strong id="tier">1</strong></div>
          </div>
          <button id="pause">暫停</button>
        </header>
        <div class="action-field">
          <canvas
            id="canvas"
            width="400"
            height="590"
            tabindex="0"
            aria-label="心光合成屋遊玩畫面"
          ></canvas>
        </div>
        <div class="action-notes">
          <p id="status" role="status"></p>
          <div id="play-role"></div>
          <p id="role-line"></p>
          <p id="mission-info"></p>
        </div>
        <nav class="controls action-buttons" aria-label="遊戲操作">
          <button id="ability" hidden>角色幫忙</button
          ><button id="undo" hidden>撤回</button
          ><button id="drop" class="primary">投下收藏球</button
          ><button id="help">玩法</button>
        </nav>
      </section>
    </main>
    <script src="lantern-game.js?v=20261111-viewport1"></script>
  <script src="../shared/mobile-title.js?v=20261111-viewport1"></script><script src="../shared/mobile-game.js?v=20261111-viewport1"></script><script src="../shared/mobile-modes.js?v=20261111-viewport1"></script><script src="../shared/mobile-polish.js?v=20261112-touch1"></script><script src="../shared/mobile-pause.js?v=20261111-viewport1"></script><script src="../shared/mobile-panels.js?v=20261111-viewport1"></script></body>
</html>
