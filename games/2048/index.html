<div class="spark"></div><main class="app"><section class="hero"><img id="mascot" class="mascot" src="assets/stickers/01-happy.png" alt="光線編織者"><div><h1>星願 2048</h1><p id="speech">滑動星光，讓相同的夥伴相遇吧！</p><span class="badge">✦ 光線編織者陪你挑戰</span></div></section><section class="stats"><div class="stat"><small>目前分數</small><b id="score">0</b></div><div class="stat"><small>最佳紀錄</small><b id="best">0</b></div><button class="iconbtn" id="gallery" aria-label="表情圖鑑">♡</button></section><section class="board-shell"><div class="board" id="board" aria-label="2048 棋盤"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="tiles" id="tiles"></div></div></section><section class="actions"><button class="btn primary" id="new">開始新局</button><button class="btn" id="undo">復原</button><button class="btn" id="sound">音效：開</button></section><p class="tip">手機滑動或使用方向鍵 · 合成相同數字直到 2048</p></main><div class="toast" id="toast"></div><div class="overlay" id="galleryModal"><div class="modal"><h2>光線表情圖鑑</h2><p>16 張貼圖皆為獨立生成的透明 PNG。</p><div class="stickers" id="stickers"></div><button class="btn primary wide" data-close>返回遊戲</button></div></div><div class="overlay" id="result"><div class="modal result"><img id="resultImg" src="assets/stickers/08-victory.png"><h2 id="resultTitle">完成！</h2><p id="resultText"></p><button class="btn primary wide" id="again">再玩一次</button><button class="btn wide" data-close>繼續看看</button></div></div>
<script src="home.js"></script><script>
(()=>{const $=s=>document.querySelector(s),imgs=['light-weaver.png','warm-pup.png','joy-girl.png','forest-guide.png','memory-keeper.png','clover-fox.png','night-guardian.png','rain-companion.png','star-mage.png','key-guardian.png'],colors=[['#fff5dc','#ffdfef'],['#fce6da','#f3bcae'],['#ffe0ea','#ffc6dc'],['#e3eccb','#bcd9bd'],['#eee1d2','#cbb39e'],['#dff0d2','#aed4be'],['#dce5ff','#adb9df'],['#e4eef7','#bcd3e5'],['#eee4ff','#c9b8ec'],['#e7dfd3','#ae9e8e']];let b,score,best=+localStorage.star2048Best||0,hist=null,sound=true,won=false;const tiles=$('#tiles'),mascot=$('#mascot'),speech=$('#speech');$('#best').textContent=best;
function empty(){return Array.from({length:4},()=>Array(4).fill(0))}function spots(){let a=[];b.forEach((r,y)=>r.forEach((v,x)=>{if(!v)a.push([y,x])}));return a}function add(){let a=spots();if(!a.length)return;let [y,x]=a[Math.random()*a.length|0];b[y][x]=Math.random()<.9?2:4}function cp(){return b.map(r=>[...r])}function same(a,c){return a.every((r,y)=>r.every((v,x)=>v===c[y][x]))}
function line(a){let q=a.filter(Boolean),o=[],gain=0;for(let i=0;i<q.length;i++){if(q[i]===q[i+1]){o.push(q[i]*2);gain+=q[i]*2;i++}else o.push(q[i])}while(o.length<4)o.push(0);return[o,gain]}function move(d){let old=cp(),ns=empty(),gain=0;for(let i=0;i<4;i++){let a=d==='l'?b[i]:d==='r'?[...b[i]].reverse():d==='u'?b.map(r=>r[i]):b.map(r=>r[i]).reverse(),z=line(a);gain+=z[1];let q=(d==='r'||d==='d')?[...z[0]].reverse():z[0];if(d==='l'||d==='r')ns[i]=q;else q.forEach((v,y)=>ns[y][i]=v)}if(same(old,ns))return;hist={b:old,score};b=ns;score+=gain;add();if(gain){face(gain>=64?4:2,gain>=64?'太棒了，連續合成！':'星光合在一起了！');beep(520)}else face(1,'再找找相同的夥伴吧！');render(gain>0);if(Math.max(...b.flat())>=2048&&!won){won=true;showResult(true)}else if(!can())showResult(false)}
function can(){if(spots().length)return true;for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(b[y+1]?.[x]===b[y][x]||b[y][x+1]===b[y][x])return true;return false}function face(n,t){mascot.src=`assets/stickers/${String(n).padStart(2,'0')}-${['','happy','laugh','surprised','cheer','shy','confused','thinking','victory','love','thanks','angry','pout','sad','nervous','tired','sleep'][n]}.png`;speech.textContent=t}
function render(merged=false){tiles.innerHTML='';b.forEach((r,y)=>r.forEach((v,x)=>{if(!v)return;let n=Math.min(9,Math.log2(v)-1),el=document.createElement('div');el.className='tile'+(v>=1024?' big':'')+(merged?' merged':'');el.style=`--r:${y};--c:${x};--a:${colors[n][0]};--b:${colors[n][1]}`;el.innerHTML=`<div class="tilein"><img src="assets/characters/${imgs[n]}" alt="${v}"><span class="num">${v}</span></div>`;tiles.append(el)}));$('#score').textContent=score;if(score>best){best=score;localStorage.star2048Best=best;$('#best').textContent=best}$('#undo').disabled=!hist;localStorage.star2048=JSON.stringify({b,score,won})}
function fresh(){b=empty();score=0;hist=null;won=false;add();add();face(1,'滑動星光，讓相同的夥伴相遇吧！');render();beep(420)}function beep(f){if(!sound)return;let a=new(window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.09)}function showResult(ok){$('#resultImg').src=`assets/stickers/${ok?'08-victory':'13-sad'}.png`;$('#resultTitle').textContent=ok?'星願完成！':'棋盤滿了';$('#resultText').textContent=ok?`你成功合成 2048，獲得 ${score} 分！`:`這次獲得 ${score} 分，再試一次吧。`;$('#result').classList.add('show')}
let sx,sy;$('#board').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('#board').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'r':'l':dy>0?'d':'u')},{passive:true});addEventListener('keydown',e=>{let d={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(d){e.preventDefault();move(d)}});$('#new').onclick=fresh;$('#again').onclick=()=>{$('#result').classList.remove('show');fresh()};$('#undo').onclick=()=>{if(!hist)return;b=hist.b;score=hist.score;hist=null;face(7,'時間倒轉，重新想想吧！');render()};$('#sound').onclick=e=>{sound=!sound;e.target.textContent='音效：'+(sound?'開':'關');if(sound)beep(500)};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.overlay').classList.remove('show'));$('#gallery').onclick=()=>$('#galleryModal').classList.add('show');$('#stickers').innerHTML=Array.from({length:16},(_,i)=>`<div class="sticker"><img loading="lazy" src="assets/stickers/${String(i+1).padStart(2,'0')}-${['happy','laugh','surprised','cheer','shy','confused','thinking','victory','love','thanks','angry','pout','sad','nervous','tired','sleep'][i]}.png"></div>`).join('');try{let s=JSON.parse(localStorage.star2048);b=s.b;score=s.score||0;won=s.won||false;if(!Array.isArray(b)||b.length!==4)throw 0;render()}catch{fresh()}})();
</script></body></html>
