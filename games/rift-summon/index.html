<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CxQ 裂界召喚</title>
<link rel="stylesheet" href="style.css?v=town-2">
</head>
<body>
<main>
<section id="title-screen" aria-label="遊戲首頁">
  <div class="camp-content"><h1 aria-label="CxQ 裂界召喚"><img src="art/release-logo.webp" alt="CxQ 裂界召喚"></h1><div class="controls">
    <button id="title-start" data-art="campaign">進入營地</button><button id="title-resume" data-art="resume" hidden>繼續戰鬥</button>
  </div></div>
</section>
<section id="starter-select" hidden aria-labelledby="starter-heading">
  <header class="collection-header"><h1 id="starter-heading">選擇第一位英雄</h1></header><div id="starter-options"></div>
</section>
<section id="camp" hidden aria-label="裂界營地">
  <div class="world-camp">
    <header class="camp-hud"><button id="camp-profile"><img id="camp-profile-art" alt=""><span id="camp-progress"></span></button><div id="camp-wallet" class="wallet"></div><button id="camp-options" data-art="settings">設定</button></header>
    <button id="camp-featured-button" aria-label="與首頁英雄互動"><span id="camp-aura-wrap"><img id="camp-aura" alt=""></span><span id="camp-hero-motion"><img id="camp-featured" alt=""><img id="camp-blink" alt=""><img id="camp-gesture" alt=""></span></button><section hidden class="camp-expedition" aria-labelledby="camp-stage">
      <div class="expedition-content">
        <small id="camp-chapter"></small><h2 id="camp-stage"></h2>
        <div class="expedition-party"><img id="camp-hero-art" alt=""><div><strong id="camp-team-name"></strong><p id="camp-team-rune"></p></div></div>
        <div class="expedition-actions"><button id="camp-resume" data-art="resume" hidden>繼續戰鬥</button>
          <button id="camp-sortie" data-art="attack">開始戰鬥</button>
          <button id="camp-map"><img src="art/map-flag.webp" alt="">冒險地圖</button>
        </div>
      </div>
    </section>
    <nav class="town-map" aria-label="裂界城鎮">
      <button id="camp-campaign" class="town-landmark" aria-label="遠征城門・冒險"><span>冒險</span></button>
      <button id="camp-deck" class="town-landmark" aria-label="守備訓練場・編隊"><span>編隊</span><small id="town-team" aria-hidden="true"></small></button>
      <button id="camp-capsule" class="town-landmark" aria-label="召喚工坊・召喚"><span>召喚</span></button>
      <button id="camp-collection" class="town-landmark" aria-label="藏書塔・圖鑑"><span>圖鑑</span></button>
      <button id="camp-bag" class="town-landmark" aria-label="行囊商館・背包"><span>背包</span></button>
    </nav>
    <button id="camp-heroes" hidden></button><button id="camp-runes" hidden></button>
  </div>
</section>
<section id="rune-book" hidden aria-label="符文冊">
  <header class="collection-header"><div><h1>符文冊</h1><p id="rune-count"></p></div><button id="rune-back">返回</button></header>
  <label class="catalog-filter">符文類別 <select id="rune-filter"><option value="all">全部</option><option value="guard">防護</option><option value="heal">治療</option><option value="attack">攻擊</option><option value="control">控制</option></select></label>
  <label class="catalog-filter">稀有度 <select id="rune-rarity"><option value="all">全部</option></select></label>
  <label class="catalog-filter">收錄 <select id="rune-owned"><option value="all">全部</option><option value="owned">已收錄</option><option value="locked">未收錄</option></select></label>
  <label class="catalog-filter">查符文 <input type="search" id="rune-search" placeholder="名稱或效果"></label>
  <div id="rune-book-grid"></div>
</section>
<section id="inventory-page" hidden aria-labelledby="inventory-heading">
  <header class="collection-header"><div><h1 id="inventory-heading">背包</h1><p id="inventory-count"></p></div><button id="inventory-back">返回</button></header>
  <nav class="library-tabs" aria-label="背包類別">
    <button data-bag="card">卡片背包</button><button data-bag="hero">英雄背包</button><button data-bag="rune">符文背包</button><button data-bag="material">強化素材</button>
  </nav>
  <label>排序 <select id="bag-sort"><option value="uid">最新取得</option><option value="tier">品階</option><option value="level">等級</option><option value="xp">經驗進度</option><option value="name">名稱</option></select></label><button id="bag-direction">降冪</button><label>稀有度 <select id="inventory-tier"><option value="all">全部</option></select></label>
  <label>查個體 <input type="search" id="inventory-search" placeholder="輸入名稱"></label>
  <div id="inventory-grid"></div>
</section>
<section id="team-editor" hidden aria-label="編隊">
  <header class="collection-header"><div><h1>出戰編隊</h1><p id="team-status" aria-live="polite"></p></div><button id="team-exit">返回</button></header>
  <div id="team-editor-content"></div>
</section>
<section id="summon-hall" hidden aria-label="召喚大廳">
  <header class="collection-header"><h1>召喚大廳</h1><button id="summon-hall-back">回營地</button></header>
  <div class="summon-hall-gates">
    <button data-gate="gold"><img src="art/money-gold.webp" alt="">金幣召喚</button>
    <button data-gate="gems"><img src="art/money-gems.webp" alt="">鑽石召喚</button>
    <button data-gate="hero"><img src="art/nav-heroes.webp" alt="">英雄召喚</button>
  </div>
</section>
<section id="capsule" hidden aria-labelledby="capsule-title">
  <header class="collection-header"><h1 id="capsule-title">扭蛋召喚</h1><button id="capsule-back">回營地</button></header>
  <nav class="library-tabs" aria-label="召喚種類"><button data-summon-type="card">卡牌</button><button data-summon-type="rune">符文</button><button data-summon-type="hero">英雄</button></nav><div class="summon-scene">
    <div class="summon-machine"><img src="art/summon-machine.webp" alt=""><div id="capsule-reveal" aria-live="polite"></div></div>
    <div class="capsule-console">
      <div id="capsule-wallet" class="wallet" aria-live="polite"></div>
      <fieldset class="summon-pools"><legend>選擇召喚池</legend>
        <label><input type="radio" name="summon-pool" value="gold:card"><img src="art/money-gold.webp" alt=""><span>金幣卡牌</span><small>最高 SS</small></label>
        <label><input type="radio" name="summon-pool" value="gold:rune"><img src="art/rune-ward.webp" alt=""><span>金幣符文</span><small>最高 S</small></label>
        <label><input type="radio" name="summon-pool" value="gems:card" checked><img src="art/money-gems.webp" alt=""><span>鑽石卡牌</span><small>最高 UUR</small></label>
        <label><input type="radio" name="summon-pool" value="gems:rune"><img src="art/rune-spark.webp" alt=""><span>鑽石符文</span><small>最高 SSR</small></label>
        <label><input type="radio" name="summon-pool" value="gold:hero"><img src="art/money-gold.webp" alt=""><span>金幣英雄</span><small>最高 S</small></label><label><input type="radio" name="summon-pool" value="gems:hero"><img src="art/nav-heroes.webp" alt=""><span>鑽石英雄</span><small>最高 SSR</small></label>
      </fieldset>
      <div class="controls"><button id="draw-gems">單抽</button><button id="draw-ten">十連</button></div>
      <div id="capsule-rules"></div>
    </div>
  </div>
</section>
<section id="hero-book" hidden aria-label="英雄圖鑑">
  <header class="collection-header"><h1>英雄圖鑑</h1><button id="hero-book-back">返回</button></header><label>品階 <select id="hero-rarity"><option value="all">全部</option></select></label> <label>收錄 <select id="hero-owned"><option value="all">全部</option><option value="owned">已收錄</option><option value="locked">未收錄</option></select></label><label class="catalog-filter">搜尋 <input type="search" id="hero-search" placeholder="英雄名稱"></label><div id="hero-book-grid"></div>
</section>
<section id="campaign" hidden aria-label="副本">
  <header class="collection-header"><div><h1>副本</h1><p id="campaign-chapter"></p></div><button id="campaign-back">回營地</button></header>
  <nav class="library-tabs adventure-modes"><button aria-pressed="true" type="button">主線副本</button><button id="daily-link" type="button">每日秘境</button></nav><nav id="chapter-picker" class="library-tabs" aria-label="選擇章節"></nav>
  <div class="campaign-scene">
    <div id="stages" aria-label="章節旗點"></div>
    <div class="campaign-dossier">
      <h2 id="stage-name"></h2><p id="stage-detail" aria-live="polite"></p>
      <div id="stage-preview" aria-label="敵方先鋒與首通獎勵"></div>
      <div class="controls"><label>出戰編隊 <select id="campaign-team"></select></label><button id="campaign-prepare" data-art="deck">編輯編隊</button><button id="campaign-fight" data-art="attack">開始戰鬥</button></div>
    </div>
  </div>
</section>
<section id="daily" hidden><header class="collection-header"><h1>每日秘境</h1><button id="daily-back">回冒險地圖</button></header><div id="daily-content"></div></section>
<section id="settings-page" hidden aria-label="遊戲設定">
  <header class="collection-header"><h1>設定</h1><button id="settings-back">返回</button></header>
  <div id="settings-controls"></div>
  <button id="settings-backup" data-art="backup">存檔備份</button>
</section>
<section id="collection" hidden aria-label="角色卡冊">
  <header class="collection-header"><div><h1 id="collection-title">卡牌圖鑑</h1><p id="collection-count"></p></div><div id="album-wallet" class="wallet"></div><button id="collection-back">回營地</button></header>
  <nav class="library-tabs" aria-label="圖鑑類別">
    <button data-codex="card">卡片</button><button data-codex="hero">英雄</button><button data-codex="rune">符文</button>
  </nav>
  <label class="catalog-filter">卡牌類別 <select id="card-filter"><option value="all">全部</option><option value="attack">攻擊</option><option value="guard">防護</option><option value="heal">治療</option><option value="support">支援</option></select></label>
  <label class="catalog-filter">稀有度 <select id="card-rarity"><option value="all">全部</option></select></label>
  <label class="catalog-filter">收錄 <select id="card-owned"><option value="all">全部</option><option value="owned">已收錄</option><option value="locked">未收錄</option></select></label><label class="catalog-filter">搜尋 <input type="search" id="card-search" placeholder="名稱或技能"></label>
  <div id="album-pages" aria-label="卡冊書頁"></div>
  <nav class="album-controls" aria-label="卡冊翻頁">
    <button id="album-prev">上一頁</button>
    <span id="album-position" aria-live="polite"></span>
    <button id="album-next">下一頁</button>
  </nav>
</section>
<section id="lobby" hidden>
  <header class="war-room-header"><div><small id="lobby-chapter"></small><h1 id="lobby-stage"></h1></div><button id="return-camp">回營地</button></header>
  <label>出戰編隊 <select id="lobby-team"></select></label>
  <div id="hero-preview" class="hero-preview">
    <button id="hero-preview-open" aria-label="查看英雄完整立繪"><img id="hero-preview-art" alt=""></button>
    <div class="hero-preview-copy">
      <small>出戰英雄</small><h2 id="hero-preview-name"></h2>
      <strong id="hero-preview-skill"></strong><p id="hero-detail"></p>
    </div>
  </div>
  <div id="heroes" aria-label="選擇英雄"></div>
  <p id="battle-plan"></p>
  <div id="rune-slots" aria-label="戰前符文槽"></div>
  <div class="controls">
    <button id="deck" data-art="deck">編隊與收藏</button><button id="options" data-art="settings">聲音設定</button><button id="backup" data-art="backup">存檔備份</button><button id="start" data-art="attack">開始戰鬥</button><button id="resume" data-art="resume" hidden>繼續戰鬥</button>
  </div>
</section>
<section id="battle" hidden>
  <header>
    <div class="hero-hud"><span class="combat-emblem"><img id="portrait" alt=""></span><div><strong id="hero-name"></strong><div id="health"></div><progress id="hero-hp" aria-label="我方英雄生命"></progress></div></div>
    <div id="round"></div><div class="enemy-hud"><span class="combat-emblem"><img id="enemy-portrait" alt=""></span><strong id="enemy-health"></strong><progress id="enemy-hp" aria-label="敵方英雄生命"></progress></div>
    <button id="back">返回</button>
  </header>
  <div id="rotate">橫拿手機可看到更多欄位。</div>
  <div id="forecast"></div>
  <div class="battle-stage">
    <div id="field" tabindex="0" aria-label="敵我同步捲動戰場"><div id="lanes"></div></div>
    <div id="hero-cut-in" hidden aria-hidden="true">
      <img id="hero-cut-in-art" alt="">
      <div><small id="hero-cut-in-name"></small><strong id="hero-cut-in-skill"></strong></div>
    </div>
  </div>
  <p id="message" aria-live="polite"></p>
  <div class="hand-tray"><strong id="hand-label">手牌</strong><div id="hand" aria-labelledby="hand-label"></div></div>

  <footer>
    <div class="battle-runes"><button id="rune-status" type="button"></button><button id="rune-status-2" type="button"></button></div>
    <details class="battle-tools"><summary aria-label="戰鬥工具">戰鬥工具</summary><label>倍速 <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label>
    <button id="mute">靜音</button><button id="report">戰報</button></details>
    <button id="deploy" data-art="deploy" disabled>部署</button><button id="attack" data-art="attack">開始攻擊</button>
  </footer>
</section>
<section id="results" hidden aria-labelledby="result-title">
  <header class="collection-header"><div><small id="result-stage"></small><h1 id="result-title" tabindex="-1"></h1></div><button id="result-camp">回營地</button></header>
  <div id="result-content"></div>
  <nav class="result-actions" aria-label="結算操作">
    <button id="result-next" data-art="campaign">下一關</button>
    <button id="result-retry" data-art="attack">再挑戰</button>
    <button id="result-deck" data-art="deck">調整編隊</button>
    <button id="result-album" data-art="collection">查看卡冊</button>
  </nav>
</section>
<dialog id="detail"><div id="detail-content"></div><form method="dialog"><button>關閉</button></form></dialog>
<dialog id="capsule-show" aria-labelledby="capsule-show-title">
  <h2 id="capsule-show-title">裂界召喚</h2>
  <div id="capsule-show-body" aria-live="polite"></div>
  <div class="controls"><button id="draw-open-all">一鍵開啟</button><button id="capsule-show-close">跳過</button></div>
</dialog>
</main>
<script type="module" src="main.mjs?v=town-3"></script>
</body>
</html>
