function land(){const b=S.board,p=cp(),t=b.path[p.pos];if(t.type==='land'){b.popup='land';return;}if(t.type==='event'){const d=Math.random()<.5?3000:-2000;p.cash+=d;S.msg=(d>0?'幸運事件 +$':'突發支出 $')+Math.abs(d).toLocaleString();b.popup='event';return;}if(t.type==='card'){p.cash+=1200;S.msg='獲得卡片獎勵 +$1,200';b.popup='event';return;}if(t.type==='mini'){p.cash+=1800;S.msg='小遊戲快速結算 +$1,800';b.popup='event';return;}if(t.type==='shop'){S.msg='商店本層將在下一輪美術重建';b.popup='event';return;}if(t.type==='npc'){const d=Math.random()<.5?2500:-1500;p.cash+=d;S.msg=(d>0?'遇到好運精靈 +$':'遇到搗蛋精靈 -$')+Math.abs(d).toLocaleString();b.popup='event';return;}next();}
function next(){const b=S.board;b.popup=null;b.turn++;if(b.turn>=b.players.length){b.turn=0;b.round++;}if(b.round>S.rounds){S.msg='本局回合結束';return;}focus(false);S.msg='輪到 '+(cp().id+1)+'P';save();if(cp().type==='ai')setTimeout(ai,700);}
function roll(){if(S.rolling||S.board.moving)return;S.rolling=true;let n=0;const timer=setInterval(()=>{S.dice=1+Math.floor(Math.random()*6);if(++n>8){clearInterval(timer);S.rolling=false;move(S.dice);}},70);}
function move(steps){const b=S.board,p=cp();b.moving={left:steps};function one(){if(!b.moving||b.moving.left<=0){b.moving=null;land();return;}p.pos=(p.pos+1)%b.path.length;if(p.pos===0)p.cash+=5000;b.moving.left--;focus(false);setTimeout(one,210);}one();}
function ai(){const b=S.board;if(!b||cp().type!=='ai'||b.popup)return;S.dice=1+Math.floor(Math.random()*6);setTimeout(()=>move(S.dice),380);}
function save(){if(!S.board)return;try{localStorage.setItem('cxq_v4_save',JSON.stringify({settings:{playerCount:S.playerCount,seats:S.seats,money:S.money,rounds:S.rounds},board:S.board}));}catch(e){}}
function guide(){S.overlay='guide'}function settings(){S.overlay='settings'}
function drawOverlay(){if(!S.overlay)return;X.fillStyle='rgba(4,8,18,.72)';X.fillRect(0,0,W,H);panel(430,215,740,470,34,'rgba(26,29,47,.98)','rgba(243,201,101,.92)',5);txt(S.overlay==='guide'?'遊戲說明':'設定',800,270,42,'center','#fff0bb',1000,true);if(S.overlay==='guide'){['擲骰逐格前進','購買土地並升級房屋','對手踩到時收取租金','卡片、事件、NPC與神明改變局勢','回合結束後以總資產排名'].forEach((a,i)=>txt('• '+a,520,350+i*55,24,'left','#fff',750,false));}else{txt('這一層先完成首頁、選角與開局流程。',800,382,24,'center','#fff',750,false);txt('音效、三語系、畫質與完整設定會逐層接回。',800,435,21,'center','#dbe2f2',700,false);}btn('close','關閉',650,585,300,66,{kind:'violet',size:25});}
function click(id){if(id==='homeStart'){ensureCount();S.scene='select';}else if(id==='homeContinue'){S.scene='select';}else if(id==='homeGuide')guide();else if(id==='homeSettings')settings();else if(id==='close')S.overlay=null;else if(id==='selBack')S.scene='home';else if(id.startsWith('char'))pick(+id.slice(4));else if(id.startsWith('seat'))S.activeSeat=+id.slice(4);else if(id.startsWith('human'))S.seats[+id.slice(5)].type='human';else if(id.startsWith('ai'))S.seats[+id.slice(2)].type='ai';else if(id==='playerCount'){S.playerCount=S.playerCount===4?2:S.playerCount+1;ensureCount();}else if(id==='money'){S.money=S.money===300000?500000:S.money===500000?100000:300000;}else if(id==='move'){S.move=S.move==='擲骰前進'?'雙骰模式':'擲骰前進';}else if(id==='land'){S.land=S.land==='無限制'?'區域限制':'無限制';}else if(id==='rounds'){S.rounds=S.rounds===20?30:S.rounds===30?45:S.rounds===45?60:20;}else if(id==='win'){S.win=S.win==='總資產最高'?'最後存活':'總資產最高';}else if(id==='startMatch'){makeBoard();S.scene='game';setTimeout(()=>{if(cp().type==='ai')ai()},500);}else if(id==='exitGame')S.scene='select';else if(id==='roll')roll();else if(id==='skipBuy'||id==='eventOk')next();else if(id==='buy'){const p=cp(),t=S.board.path[p.pos];if(p.cash>=t.price){p.cash-=t.price;t.owner=p.id;t.lv=1;}next();}else if(id==='upgrade'){const p=cp(),t=S.board.path[p.pos],c=Math.round(t.price*.45);if(t.lv<3&&p.cash>=c){p.cash-=c;t.lv++;}next();}else if(id==='payRent'){const p=cp(),t=S.board.path[p.pos],amt=t.rent*(1+Math.max(0,t.lv-1)),own=S.board.players[t.owner];p.cash-=amt;own.cash+=amt;next();}}
C.addEventListener('pointerup',e=>{const r=C.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H,b=[...S.buttons].reverse().find(z=>z.en&&px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h);if(b)click(b.id);});
function loop(){frame();S.t+=1/60;if(S.scene==='home')drawHome();else if(S.scene==='select')drawSelect();else if(S.scene==='game')drawGame();drawOverlay();requestAnimationFrame(loop);}loop();
</script></body></html>
