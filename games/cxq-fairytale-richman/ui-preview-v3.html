<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>CxQ 童話大富翁｜Richman Mobile UI Preview V3</title>
</head>
<body style="margin:0;overflow:hidden;background:#07101d">
<canvas id="game" style="display:block;touch-action:none"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DESIGN_W = 1600, DESIGN_H = 900;

const RAW = 'https://raw.githubusercontent.com/yuchen112/cailucky/main/games/fortune/assets/';
const charFiles = ['joy.png','dream.png','night.png','sadness.png','trust.png','memory.png','growth.png','healing.png','luck.png','hope.png'];
const charNames = ['慶典少女','星夢魔女','夜行貓法師','雨傘少女','鑰匙冒險者','記憶偵探','森林旅人','療癒犬使','幸運魔獸','希望旅人'];
const chars = charFiles.map(x=>RAW+'characters/'+x);
const bgUrl = RAW+'backgrounds/destiny-village.png';
const houseUrl = RAW+'buildings/moon-tarot-cottage.png';

const I = {};
function load(key,url){
  const im = new Image();
  im.crossOrigin='anonymous';
  im.src=url;
  I[key]=im;
}
load('bg',bgUrl);
load('house',houseUrl);
chars.forEach((u,i)=>load('c'+i,u));

const state = {
  scene:'menu',
  seats:[
    {type:'human',char:0,diff:'standard'},
    {type:'ai',char:1,diff:'standard'},
    {type:'off',char:2,diff:'standard'},
    {type:'off',char:3,diff:'standard'}
  ],
  rounds:30,
  quick:true,
  selectedSeat:0,
  overlay:null,
  buttons:[],
  t:0
};

function fit(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(innerWidth*dpr);
  canvas.height=Math.round(innerHeight*dpr);
  canvas.style.width=innerWidth+'px';
  canvas.style.height=innerHeight+'px';
}
addEventListener('resize',fit);
fit();

function beginFrame(){
  const sx=canvas.width/DESIGN_W, sy=canvas.height/DESIGN_H;
  ctx.setTransform(sx,0,0,sy,0,0);
  ctx.clearRect(0,0,DESIGN_W,DESIGN_H);
  state.buttons.length=0;
}

function roundedRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function panel(x,y,w,h,r=28,fill='rgba(23,26,42,.76)',stroke='rgba(255,229,147,.7)',lw=3){
  ctx.save();
  roundedRect(x,y,w,h,r);
  ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.stroke();
  ctx.restore();
}

function txt(t,x,y,size=28,align='center',color='#fff',weight=900,shadow=true){
  ctx.save();
  ctx.font=`${weight} ${size}px system-ui,-apple-system,"Noto Sans TC",sans-serif`;
  ctx.textAlign=align; ctx.textBaseline='middle';
  if(shadow){
    ctx.lineWidth=Math.max(3,size/8);
    ctx.strokeStyle='rgba(30,18,24,.86)';
    ctx.strokeText(String(t),x,y);
  }
  ctx.fillStyle=color;
  ctx.fillText(String(t),x,y);
  ctx.restore();
}

function imgContain(im,x,y,w,h,alpha=1){
  if(!im||!im.complete||!im.naturalWidth)return;
  const r=Math.min(w/im.naturalWidth,h/im.naturalHeight);
  const iw=im.naturalWidth*r, ih=im.naturalHeight*r;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
  ctx.restore();
}

function imgCover(im,x,y,w,h,alpha=1){
  if(!im||!im.complete||!im.naturalWidth)return false;
  const r=Math.max(w/im.naturalWidth,h/im.naturalHeight);
  const iw=im.naturalWidth*r, ih=im.naturalHeight*r;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
  ctx.restore();
  return true;
}

function addButton(id,x,y,w,h,label,opt={}){
  const {tone='gold',enabled=true,small=false,icon=null,sub=null,selected=false}=opt;

  const g=ctx.createLinearGradient(x,y,x,y+h);
  let a='#ffd85b',b='#d78713',border='#fff0a8',text='#fff9df';
  if(tone==='blue'){a='#5f9fe9';b='#235797';border='#bfe6ff'}
  if(tone==='green'){a='#77c16a';b='#387442';border='#d5ffd0'}
  if(tone==='violet'){a='#9c74d8';b='#5d358e';border='#e4cbff'}
  if(tone==='red'){a='#e97968';b='#a33939';border='#ffd1c7'}
  if(tone==='dark'){a='#48536b';b='#242c3b';border='#93a9c8'}
  if(selected){a='#fff2a5';b='#e6a416';border='#fffbe1'}
  if(!enabled){a='#7d7d87';b='#4b4b52';border='#bdbdc2'}

  g.addColorStop(0,a);g.addColorStop(1,b);
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.42)';
  ctx.shadowBlur=12;ctx.shadowOffsetY=7;
  roundedRect(x,y,w,h,Math.min(26,h*.27));
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowColor='transparent';
  ctx.lineWidth=4;ctx.strokeStyle=border;ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(74,39,13,.45)';
  roundedRect(x+7,y+7,w-14,h-14,Math.min(20,h*.22));ctx.stroke();

  if(icon){
    txt(icon,x+45,y+h/2,small?24:34,'center',text,900);
    txt(label,x+w/2+20,y+h/2-(sub?10:0),small?23:33,'center',text,900);
  } else {
    txt(label,x+w/2,y+h/2-(sub?10:0),small?23:33,'center',text,900);
  }
  if(sub) txt(sub,x+w/2,y+h/2+22,16,'center','rgba(255,255,255,.9)',700,false);
  ctx.restore();
  state.buttons.push({id,x,y,w,h,enabled});
}

function background(dim=.12){
  if(!imgCover(I.bg,0,0,DESIGN_W,DESIGN_H,1)){
    const g=ctx.createLinearGradient(0,0,0,DESIGN_H);
    g.addColorStop(0,'#69b8ef');g.addColorStop(1,'#b6dc9d');
    ctx.fillStyle=g;ctx.fillRect(0,0,DESIGN_W,DESIGN_H);
  }
  if(dim){
    ctx.fillStyle=`rgba(8,15,35,${dim})`;
    ctx.fillRect(0,0,DESIGN_W,DESIGN_H);
  }
}

function logo(x,y){
  ctx.save();
  const g=ctx.createLinearGradient(x,y-65,x,y+65);
  g.addColorStop(0,'#fff5a8');g.addColorStop(.42,'#ffd24d');g.addColorStop(1,'#c96c0d');
  ctx.font='1000 88px system-ui,-apple-system,"Noto Sans TC",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=18;ctx.strokeStyle='#54250b';
  ctx.strokeText('CxQ 童話大富翁',x,y);
  ctx.fillStyle=g;ctx.fillText('CxQ 童話大富翁',x,y);
  ctx.lineWidth=4;ctx.strokeStyle='#fff5c0';ctx.strokeText('CxQ 童話大富翁',x,y);
  ctx.restore();
  txt('夢想・策略・歡樂同行',x,y+76,24,'center','#fff6d7',800);
}

function drawMenu(){
  background(.05);

  const vg=ctx.createRadialGradient(760,390,180,760,390,800);
  vg.addColorStop(0,'rgba(255,255,255,0)');
  vg.addColorStop(1,'rgba(22,16,38,.46)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,DESIGN_W,DESIGN_H);

  imgContain(I.c1,70,258,360,580,1);
  imgContain(I.c0,350,360,315,430,1);
  imgContain(I.c8,565,510,250,285,.98);

  panel(56,42,210,70,34,'rgba(19,52,91,.78)','rgba(255,255,255,.4)',2);
  txt('開發預覽 V3',161,77,22,'center','#e8f5ff',800,false);
  panel(1288,44,260,70,34,'rgba(19,52,91,.78)','rgba(255,255,255,.4)',2);
  txt('手機橫向 / PC',1418,78,21,'center','#e8f5ff',800,false);

  logo(880,154);

  panel(1030,250,455,505,40,'rgba(33,24,45,.78)','rgba(255,225,137,.83)',4);
  txt('MAIN MENU',1257,300,20,'center','#ffe6a0',900,false);

  addButton('start',1090,338,335,92,'開始遊戲',{tone:'gold',icon:'◆'});
  addButton('continue',1090,448,335,82,'繼續遊戲',{tone:'green',enabled:!!localStorage.getItem('cxq-ui-v3'),icon:'▣',small:true});
  addButton('guide',1090,545,335,82,'遊戲說明',{tone:'blue',icon:'?',small:true});
  addButton('settings',1090,642,335,82,'設定',{tone:'violet',icon:'⚙',small:true});

  txt('以《大富翁4》的回合節奏與棋盤操作感為基準',800,855,21,'center','#fff',800);
}

function seatTypeLabel(t){return t==='human'?'真人':t==='ai'?'AI':'空席'}
function seatTone(i){return ['blue','red','green','gold'][i]}

function drawTable(){
  ctx.save();
  const g=ctx.createRadialGradient(800,495,50,800,495,520);
  g.addColorStop(0,'#e4b86a');
  g.addColorStop(.64,'#a7642d');
  g.addColorStop(1,'#603419');
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;
  ctx.beginPath();ctx.ellipse(800,520,560,300,0,0,Math.PI*2);
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowColor='transparent';
  ctx.lineWidth=16;ctx.strokeStyle='#4a2816';ctx.stroke();
  ctx.lineWidth=4;ctx.strokeStyle='#efce8b';ctx.stroke();
  ctx.restore();

  panel(592,318,416,408,26,'rgba(255,244,215,.95)','rgba(111,61,25,.8)',4);
  txt('開局規則',800,353,28,'center','#5a331b',900,false);

  txt('回合數',800,402,21,'center','#6a4028',900,false);
  [20,30,45,60].forEach((n,idx)=>{
    const x=624+idx*92;
    addButton('round'+n,x,430,78,58,String(n),{tone:'gold',small:true,selected:state.rounds===n});
  });

  txt('AI 難度',800,525,21,'center','#6a4028',900,false);
  ['easy','standard','smart'].forEach((d,idx)=>{
    const labels={easy:'輕鬆',standard:'標準',smart:'聰明'};
    addButton('diff_'+d,638+idx*110,552,98,54,labels[d],{
      tone:d==='standard'?'green':'dark',small:true,
      selected:state.seats.some(s=>s.type==='ai'&&s.diff===d)
    });
  });

  txt('快速模式',730,648,20,'left','#6a4028',900,false);
  addButton('quick',832,622,126,58,state.quick?'ON':'OFF',{tone:state.quick?'green':'dark',small:true});
}

function drawSeat(i,x,y){
  const s=state.seats[i];
  const active=state.selectedSeat===i;
  const tone=seatTone(i);
  const colors={
    blue:['rgba(44,103,170,.92)','#9bd9ff'],
    red:['rgba(170,62,59,.92)','#ffd1c5'],
    green:['rgba(47,122,73,.92)','#d2ffd8'],
    gold:['rgba(160,111,34,.92)','#ffe29a']
  }[tone];
  panel(x,y,312,216,34,colors[0],active?'#fff5ad':colors[1],active?6:3);

  txt('玩家 '+(i+1),x+156,y+32,25,'center','#fff6d7',900);
  if(s.type!=='off'){
    imgContain(I['c'+s.char],x+20,y+48,112,148,1);
    txt(seatTypeLabel(s.type),x+190,y+86,28,'center','#fff',900);
    txt(charNames[s.char],x+190,y+128,17,'center','#f5f6ff',800,false);
    if(s.type==='ai') txt('AI・'+({easy:'輕鬆',standard:'標準',smart:'聰明'}[s.diff]),x+190,y+166,17,'center','#fff0a9',800,false);
  } else {
    txt('空席',x+156,y+112,35,'center','#e9d8bd',900);
    txt('不參加本局',x+156,y+157,17,'center','#e9d8bd',700,false);
  }
  state.buttons.push({id:'seat'+i,x,y,w:312,h:216,enabled:true});
}

function drawSetup(){
  background(.3);
  panel(35,30,1530,92,34,'rgba(21,31,52,.83)','rgba(255,230,161,.56)',3);
  addButton('back',58,46,126,60,'返回',{tone:'dark',small:true});
  txt('玩家設定',300,77,42,'left','#fff4d0',1000);
  txt('像大富翁一樣先排好這一局的席位與規則',1520,78,19,'right','#dceaff',700,false);

  drawTable();
  drawSeat(0,120,180);
  drawSeat(1,1168,180);
  drawSeat(2,120,632);
  drawSeat(3,1168,632);

  panel(454,742,692,126,32,'rgba(26,30,47,.88)','rgba(255,234,170,.6)',3);
  txt('目前設定：玩家 '+(state.selectedSeat+1),486,770,18,'left','#ffe9ac',800,false);
  addButton('setHuman',486,798,176,54,'真人',{tone:'blue',small:true,selected:state.seats[state.selectedSeat].type==='human'});
  addButton('setAI',682,798,176,54,'AI',{tone:'green',small:true,selected:state.seats[state.selectedSeat].type==='ai'});
  addButton('setOff',878,798,176,54,'空席',{tone:'dark',small:true,selected:state.seats[state.selectedSeat].type==='off'});
  addButton('next',1188,786,304,72,'下一步：選擇角色',{tone:'gold',small:true,enabled:activeSeats()>=2});
}

function activeSeats(){return state.seats.filter(s=>s.type!=='off').length}

function drawOverlay(){
  if(!state.overlay)return;
  ctx.fillStyle='rgba(3,8,18,.72)';ctx.fillRect(0,0,DESIGN_W,DESIGN_H);
  panel(455,232,690,436,34,'rgba(34,31,49,.97)','rgba(255,223,135,.9)',5);
  if(state.overlay==='guide'){
    txt('遊戲說明',800,284,42,'center','#fff1bf',1000);
    const lines=['擲骰前進，逐格移動','購買土地並升級房屋','對手踩到你的土地就收租','使用卡片、道具與技能','事件、NPC與神明會改變局勢','最後以資產與生存狀態決定排名'];
    lines.forEach((l,i)=>txt('• '+l,555,350+i*48,23,'left','#f9f4e7',750,false));
  } else {
    txt('設定',800,284,42,'center','#fff1bf',1000);
    txt('這一輪先重做首頁與玩家設定。',800,372,24,'center','#f9f4e7',750,false);
    txt('音量、語言、畫質會在後續正式接回。',800,420,22,'center','#d8def0',700,false);
  }
  addButton('closeOverlay',650,570,300,64,'關閉',{tone:'violet',small:true});
}

function render(){
  beginFrame();
  state.t+=1/60;
  if(state.scene==='menu') drawMenu();
  else drawSetup();
  drawOverlay();
  requestAnimationFrame(render);
}

function pointerPos(ev){
  const rect=canvas.getBoundingClientRect();
  return {
    x:(ev.clientX-rect.left)/rect.width*DESIGN_W,
    y:(ev.clientY-rect.top)/rect.height*DESIGN_H
  };
}

canvas.addEventListener('pointerup',ev=>{
  const p=pointerPos(ev);
  const hit=[...state.buttons].reverse().find(b=>b.enabled&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h);
  if(!hit)return;
  const id=hit.id;

  if(id==='start'){state.scene='setup';state.overlay=null;return}
  if(id==='continue'){state.scene='setup';return}
  if(id==='guide'){state.overlay='guide';return}
  if(id==='settings'){state.overlay='settings';return}
  if(id==='closeOverlay'){state.overlay=null;return}
  if(id==='back'){state.scene='menu';state.overlay=null;return}
  if(id.startsWith('seat')){state.selectedSeat=+id.slice(4);return}
  if(id==='setHuman'){state.seats[state.selectedSeat].type='human';return}
  if(id==='setAI'){state.seats[state.selectedSeat].type='ai';return}
  if(id==='setOff'){
    if(activeSeats()>2 || state.seats[state.selectedSeat].type==='off') state.seats[state.selectedSeat].type='off';
    return;
  }
  if(id.startsWith('round')){state.rounds=+id.replace('round','');return}
  if(id.startsWith('diff_')){
    const d=id.replace('diff_','');
    state.seats.forEach(s=>{if(s.type==='ai')s.diff=d});
    return;
  }
  if(id==='quick'){state.quick=!state.quick;return}
  if(id==='next'){
    localStorage.setItem('cxq-ui-v3',JSON.stringify({seats:state.seats,rounds:state.rounds,quick:state.quick}));
    location.href='./ui-preview-v2.html#character-select';
    return;
  }
});

render();
</script>
</body>
</html>
