const I={};function load(k,u){const im=new Image;im.crossOrigin='anonymous';im.src=u;I[k]=im;return im}load('bg',BG);load('house',HOUSE);load('btn',BTN);CHARS.forEach((u,i)=>load('c'+i,u));
const TYPES=['start','land','land','event','land','shop','land','card','land','mini','land','event','land','npc','land','shop','land','event','land','card','land','mini','land','npc','land','event','land','shop','land','card','land','mini','land','npc','land','event'];
const LABEL={start:'起點',land:'土地',event:'事件',shop:'商店',card:'卡片',mini:'小遊戲',npc:'奇遇'};
const PATH=[];(()=>{const pts=[];for(let i=0;i<10;i++)pts.push([450+i*280,1700]);for(let i=1;i<=5;i++)pts.push([2970,1700-i*280]);for(let i=1;i<=9;i++)pts.push([2970-i*280,300]);for(let i=1;i<=5;i++)pts.push([450,300+i*280]);for(let i=1;i<=7;i++)pts.push([450+i*315,1700]);PATH.push(...pts.slice(0,36).map((p,i)=>({x:p[0],y:p[1],type:TYPES[i],owner:-1,level:0,price:7000+(i%6)*1200,rent:900+(i%5)*400})));})();
const game={screen:'menu',lang:'zh',rounds:30,round:1,turn:0,cam:{x:0,y:0},moving:null,popup:null,log:'',slots:[{type:'human',char:0},{type:'ai',char:1},{type:'off',char:2},{type:'off',char:3}],players:[],buttons:[],last:0};
function resetBoard(){PATH.forEach(t=>{t.owner=-1;t.level=0})}
function activeSlots(){return game.slots.filter(s=>s.type!=='off')}
function newGame(){const ss=activeSlots();if(ss.length<2){game.log='至少需要 2 名參賽者';return}resetBoard();game.players=ss.map((s,i)=>({id:i,type:s.type,char:s.char,cash:100000,pos:0,skip:0,cards:1,alive:true}));game.round=1;game.turn=0;game.popup=null;game.screen='game';focus(game.players[0],true);save();if(game.players[0].type==='ai')setTimeout(aiTurn,800)}
function save(){try{localStorage.setItem('cxq-richman-online',JSON.stringify({rounds:game.rounds,round:game.round,turn:game.turn,slots:game.slots,players:game.players,tiles:PATH.map(t=>({o:t.owner,l:t.level}))}))}catch(e){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem('cxq-richman-online'));if(!s||!s.players?.length)return false;game.rounds=s.rounds;game.round=s.round;game.turn=s.turn;game.slots=s.slots;game.players=s.players;s.tiles.forEach((v,i)=>{PATH[i].owner=v.o;PATH[i].level=v.l});game.screen='game';focus(game.players[game.turn],true);return true}catch(e){return false}}
function focus(p,instant=false){const t=PATH[p.pos],tx=Math.max(0,Math.min(WORLD_W-W,t.x-W/2)),ty=Math.max(0,Math.min(WORLD_H-H,t.y-H/2));if(instant){game.cam.x=tx;game.cam.y=ty}else game.cam.target={x:tx,y:ty}}
function resize(){const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;C.width=w*d;C.height=h*d;C.dataset.cssw=w;C.dataset.cssh=h}addEventListener('resize',resize);resize();
function scale(){return {sx:(+C.dataset.cssw||innerWidth)/W,sy:(+C.dataset.cssh||innerHeight)/H}}
function begin(){const s=scale(),d=C.width/(+C.dataset.cssw||innerWidth);X.setTransform(d*s.sx,0,0,d*s.sy,0,0);X.clearRect(0,0,W,H)}
function drawImageContain(im,x,y,w,h){if(!im||!im.complete||!im.naturalWidth)return;const r=Math.min(w/im.naturalWidth,h/im.naturalHeight),iw=im.naturalWidth*r,ih=im.naturalHeight*r;X.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function text(t,x,y,size=28,align='center',color='#fff'){X.save();X.font=`900 ${size}px system-ui,-apple-system,"Noto Sans TC",sans-serif`;X.textAlign=align;X.textBaseline='middle';X.lineWidth=Math.max(3,size/9);X.strokeStyle='rgba(35,22,47,.9)';X.strokeText(String(t),x,y);X.fillStyle=color;X.fillText(String(t),x,y);X.restore()}
function button(id,label,x,y,w=330,h=105,enabled=true){const im=I.btn;if(im.complete)X.drawImage(im,x,y,w,h);X.globalAlpha=enabled?1:.45;text(label,x+w/2,y+h/2,34);X.globalAlpha=1;game.buttons.push({id,x,y,w,h,enabled})}
function portrait(ci,x,y,w,h){drawImageContain(I['c'+ci],x,y,w,h)}
function bg(){if(I.bg.complete&&I.bg.naturalWidth){X.drawImage(I.bg,0,0,W,H)}else{X.fillStyle='#173d6d';X.fillRect(0,0,W,H)}}
function title(){text('CxQ 童話大富翁',420,132,72);text('FAIRY TALE RICHMAN',420,202,25)}
function drawMenu(){bg();title();portrait(0,150,245,520,590);button('start','開始遊戲',940,260);button('continue','繼續遊戲',940,390);button('setup','玩家設定',940,520);button('about','版本說明',940,650);text('手機橫向 / PC｜線上開發 Build',800,835,23)}
function drawSetup(){bg();title();text('參賽席位：真人 / AI / 不參加，總人數 2～4',800,225,26);game.slots.forEach((s,i)=>{const x=135+i*365,y=300;portrait(s.char,x+65,y,230,260);const tag=s.type==='human'?'真人':s.type==='ai'?'AI':'不參加';button('type'+i,`P${i+1}・${tag}`,x,y+270,300,85);button('char'+i,'更換角色',x,y+365,300,75,s.type!=='off');text(CHAR_NAMES[s.char],x+150,y+455,24)});button('rounds',`${game.rounds} 回合`,250,790,280,80);button('back','返回',660,790,280,80);button('go','進入棋盤',1070,790,300,80,activeSlots().length>=2)}
function drawWorld(){if(I.bg.complete&&I.bg.naturalWidth){X.drawImage(I.bg,0,0,I.bg.naturalWidth,I.bg.naturalHeight,0,0,W,H)}else bg();X.save();X.translate(-game.cam.x,-game.cam.y);for(let i=0;i<PATH.length;i++){const t=PATH[i],w=165,h=84,x=t.x-w/2,y=t.y-h/2;if(I.btn.complete)X.drawImage(I.btn,x,y,w,h);text(i===0?'START':LABEL[t.type],t.x,t.y-5,19);if(t.owner>=0)text(`P${t.owner+1} Lv.${t.level||1}`,t.x,t.y+27,15,'center','#ffe56d');if(t.type==='land'&&t.level>0&&I.house.complete)drawImageContain(I.house,t.x-70,t.y-190,140,120)}for(const p of game.players){if(!p.alive)continue;const t=PATH[p.pos];const off=(p.id-(game.players.length-1)/2)*34;portrait(p.char,t.x-70+off,t.y-165,140,140)}X.restore()}
function hud(){const p=game.players[game.turn];game.players.forEach((q,i)=>{const y=28+i*100;if(I.btn.complete)X.drawImage(I.btn,25,y,340,88);portrait(q.char,35,y+5,74,74);text(`P${q.id+1} ${q.type==='ai'?'AI':'玩家'}`,118,y+26,20,'left');text(`$${q.cash.toLocaleString()}  格${q.pos+1}`,118,y+59,18,'left',q.alive?'#fff':'#aaa')});if(I.btn.complete)X.drawImage(I.btn,600,20,400,84);text(`第 ${game.round}/${game.rounds} 回合`,800,61,28);if(p){button('roll',p.type==='ai'?'AI 行動中':'擲骰子',1230,730,300,100,p.type==='human'&&!game.moving&&!game.popup);button('save','存檔',1260,28,250,78,true);text(game.log||`輪到 P${p.id+1}`,800,835,24)}}
function drawPopup(){const P=game.popup;if(!P)return;const x=490,y=275,w=620,h=350;if(I.btn.complete){X.drawImage(I.btn,x,y,w,150);X.drawImage(I.btn,x,y+120,w,150);X.drawImage(I.btn,x,y+240,w,110)}text(P.title,800,330,36);text(P.msg,800,400,23);if(P.kind==='buy'){button('yes','購買',540,510,230,80);button('no','略過',830,510,230,80)}else if(P.kind==='upgrade'){button('yes','升級',540,510,230,80);button('no','略過',830,510,230,80)}else button('ok','確定',650,510,300,80)}
function drawGame(){drawWorld();hud();drawPopup()}
function drawAbout(){bg();title();button('back','返回',70,760,260,80);text('線上開發版',800,320,44);text('目前先驗證：2～4 席自由真人/AI、逐格移動、Camera Follow、買地、升級、收租、事件、AI、存檔與結算。',800,415,24);text('所有可見操作都在遊戲 Canvas 內；後續正式 AI UI / NPC / 卡片 / 三世界素材會持續直接替換。',800,475,24);text('此頁不會覆蓋 CxQ 主網站其他遊戲。',800,535,24)}
function drawEnd(){bg();text('最終結算',800,145,66);const a=[...game.players].sort((u,v)=>(v.cash+assets(v))-(u.cash+assets(u)));a.forEach((p,i)=>{portrait(p.char,360,220+i*145,130,130);text(`${i+1} 名　P${p.id+1}　總資產 $${(p.cash+assets(p)).toLocaleString()}`,520,285+i*145,31,'left')});button('home','返回首頁',650,790,300,82)}
function assets(p){return PATH.reduce((s,t)=>s+(t.owner===p.id?t.price+(t.level||0)*t.price*.65:0),0)}
function frame(){game.buttons=[];begin();if(innerHeight>innerWidth){bg();text('請將裝置旋轉為橫向遊玩',800,450,46);requestAnimationFrame(frame);return}if(game.screen==='menu')drawMenu();else if(game.screen==='setup')drawSetup();else if(game.screen==='game')drawGame();else if(game.screen==='about')drawAbout();else if(game.screen==='end')drawEnd();if(game.cam.target){game.cam.x+=(game.cam.target.x-game.cam.x)*.09;game.cam.y+=(game.cam.target.y-game.cam.y)*.09;if(Math.abs(game.cam.target.x-game.cam.x)<1&&Math.abs(game.cam.target.y-game.cam.y)<1)game.cam.target=null}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function hit(px,py,b){return px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h}
function pointer(e){e.preventDefault();const r=C.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;const b=[...game.buttons].reverse().find(b=>b.enabled&&hit(px,py,b));if(b)action(b.id)}C.addEventListener('pointerdown',pointer,{passive:false});
function action(id){if(id==='start'){game.screen='setup';game.log=''}else if(id==='continue'){if(!loadSave())game.log='沒有可讀取的存檔'}else if(id==='setup'){game.screen='setup'}else if(id==='about'){game.screen='about'}else if(id==='back'){game.screen='menu'}else if(id==='home'){game.screen='menu'}else if(id==='rounds'){const a=[20,30,45,60],i=a.indexOf(game.rounds);game.rounds=a[(i+1)%a.length]}else if(id==='go'){newGame()}else if(id.startsWith('type')){const n=+id.slice(4),s=game.slots[n],order=['human','ai','off'];s.type=order[(order.indexOf(s.type)+1)%3]}else if(id.startsWith('char')){const n=+id.slice(4);game.slots[n].char=(game.slots[n].char+1)%10}else if(id==='roll'){roll()}else if(id==='save'){save();game.log='已儲存目前棋局'}else if(['yes','no','ok'].includes(id)){resolvePopup(id)}}
function roll(){const p=game.players[game.turn];if(!p||p.type!=='human'||game.moving||game.popup)return;const d=1+Math.floor(Math.random()*6);game.log=`P${p.id+1} 擲出 ${d}`;moveSteps(p,d)}
function moveSteps(p,n){game.moving={p,n};let step=0;const go=()=>{if(step>=n){game.moving=null;land(p);return}p.pos=(p.pos+1)%PATH.length;if(p.pos===0)p.cash+=3000;step++;focus(p);setTimeout(go,260)};go()}
function land(p){const t=PATH[p.pos];if(t.type==='land'){if(t.owner<0){if(p.type==='ai'){if(p.cash>t.price+18000){p.cash-=t.price;t.owner=p.id;t.level=1;game.log=`AI 購買土地 $${t.price.toLocaleString()}`}endTurn()}else game.popup={kind:'buy',title:'發現無主土地',msg:`價格 $${t.price.toLocaleString()}，要購買嗎？`,tile:p.pos}}else if(t.owner===p.id){const cost=Math.floor(t.price*.7);if(t.level<3){if(p.type==='ai'){if(p.cash>cost+22000){p.cash-=cost;t.level++;game.log=`AI 將房屋升到 Lv.${t.level}`};endTurn()}else game.popup={kind:'upgrade',title:'自己的土地',msg:`升級費 $${cost.toLocaleString()}，目前 Lv.${t.level}`,tile:p.pos,cost}}else endTurn()}else{const rent=t.rent*Math.max(1,t.level)*((t.level===3)?2:1);payRent(p,game.players[t.owner],rent)}}else if(t.type==='event'){const v=Math.random()<.55?(2000+Math.floor(Math.random()*5000)):-(1200+Math.floor(Math.random()*3500));p.cash+=v;game.log=v>=0?`童話事件：獲得 $${v.toLocaleString()}`:`童話事件：支付 $${(-v).toLocaleString()}`;popupInfo('隨機事件',game.log)}else if(t.type==='shop'){if(p.cash>=3500){p.cash-=3500;p.cards++;game.log='商店購入策略卡片'}popupInfo('童話商店',game.log||'這次先看看商品')}else if(t.type==='card'){p.cards++;popupInfo('卡片格','獲得 1 張策略卡片')}else if(t.type==='mini'){const prize=1000+Math.floor(Math.random()*4000);p.cash+=prize;popupInfo('小遊戲結果',`${p.type==='ai'?'AI 模擬':'快速挑戰'}成功，獲得 $${prize.toLocaleString()}`)}else if(t.type==='npc'){const good=Math.random()<.5,v=good?5000:-3000;p.cash+=v;popupInfo('神明 / NPC 奇遇',good?'得到童話祝福 +$5,000':'遭遇搗蛋精靈 -$3,000')}else endTurn()}
function popupInfo(title,msg){const p=game.players[game.turn];if(p.type==='ai'){game.log=msg;setTimeout(endTurn,650)}else game.popup={kind:'info',title,msg}}
function payRent(from,to,amt){if(from.cash>=amt){from.cash-=amt;to.cash+=amt;game.log=`支付 P${to.id+1} 租金 $${amt.toLocaleString()}`;popupInfo('支付租金',game.log)}else{liquidate(from,amt);if(from.cash>=amt){from.cash-=amt;to.cash+=amt;popupInfo('資產整理',`出售資產後支付租金 $${amt.toLocaleString()}`)}else{to.cash+=Math.max(0,from.cash);from.cash=0;from.alive=false;popupInfo('玩家破產',`P${from.id+1} 無法清償，退出本局`)}}}
function liquidate(p,need){const owned=PATH.filter(t=>t.owner===p.id).sort((a,b)=>b.level-a.level);for(const t of owned){if(p.cash>=need)break;p.cash+=Math.floor(t.price*.55+t.level*t.price*.25);t.owner=-1;t.level=0}}
function resolvePopup(id){const P=game.popup,p=game.players[game.turn];if(id==='yes'&&P.kind==='buy'){const t=PATH[P.tile];if(p.cash>=t.price){p.cash-=t.price;t.owner=p.id;t.level=1;game.log=`購買土地 $${t.price.toLocaleString()}`}else game.log='現金不足'}else if(id==='yes'&&P.kind==='upgrade'){const t=PATH[P.tile];if(p.cash>=P.cost){p.cash-=P.cost;t.level++;game.log=`房屋升級至 Lv.${t.level}`}}game.popup=null;endTurn()}
function live(){return game.players.filter(p=>p.alive)}
function endTurn(){save();if(live().length<=1){game.screen='end';return}let next=game.turn,wrap=false;do{next=(next+1)%game.players.length;if(next===0)wrap=true}while(!game.players[next].alive);game.turn=next;if(wrap){game.round++;if(game.round>game.rounds){game.screen='end';save();return}}const p=game.players[game.turn];focus(p);game.log=`輪到 P${p.id+1}`;save();if(p.type==='ai')setTimeout(aiTurn,800)}
function aiTurn(){if(game.screen!=='game'||game.popup||game.moving)return;const p=game.players[game.turn];if(!p||p.type!=='ai')return;const d=1+Math.floor(Math.random()*6);game.log=`AI P${p.id+1} 擲出 ${d}`;moveSteps(p,d)}
</script></body></html>
