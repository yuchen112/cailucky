<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:#193c2d;color:#fff}button{font:inherit}.app{position:relative;width:100%;height:100dvh;overflow:hidden}.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}.artbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}.homeShade{position:absolute;inset:0;background:linear-gradient(#00000022 0 35%,#0000 50%,#0007 100%)}
.homeTitle{position:absolute;top:max(4.5vh,env(safe-area-inset-top));left:4vw;right:4vw;text-align:center;color:#fff8d6;font-weight:1000;font-size:clamp(34px,9.3vw,60px);line-height:1.02;letter-spacing:2px;text-shadow:0 3px 0 #69401f,0 6px 12px #000a}.homeTitle small{display:block;font-size:.34em;letter-spacing:5px;margin-top:5px;color:#fff}
.homeMenu{position:absolute;left:50%;bottom:max(2.2vh,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,520px);display:grid;grid-template-columns:1fr 1fr;gap:5px}.artBtn{border:0;background:transparent;padding:0;cursor:pointer;filter:drop-shadow(0 5px 8px #0007);transition:transform .08s}.artBtn:active{transform:scale(.965)}.artBtn img{display:block;width:100%;height:auto}.artBtn.start{grid-column:1/-1;width:90%;justify-self:center}.artBtn.settings{grid-column:1/-1;width:53%;justify-self:center}
.panelScreen{background:radial-gradient(circle at 50% 15%,#689f64,#234d37 70%)}.panelWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,560px);max-height:94dvh;aspect-ratio:3/4}.panelArt{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.backBtn{position:absolute;z-index:20;left:max(9px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));width:52px;height:52px;border:0;border-radius:50%;background:#814d28;color:white;font-weight:1000;font-size:31px;box-shadow:0 3px 0 #4a2914,0 5px 12px #0006}.backBtn:active{transform:translateY(2px)}
.howRows{position:absolute;left:16.4%;top:32.3%;width:69%;height:48.5%;display:grid;grid-template-rows:repeat(4,1fr);gap:1.5%}.howRow{display:grid;grid-template-columns:25% 1fr;align-items:center;color:#5a351d;font-weight:800;text-shadow:0 1px #fff}.howRow img{width:94%;height:94%;object-fit:contain}.howRow b{display:block;font-size:clamp(15px,4.2vw,22px);color:#7b3f1d}.howRow span{font-size:clamp(11px,3.1vw,16px);line-height:1.2}
.modeSlots{position:absolute;left:18.3%;top:25.9%;width:63.6%;height:63.2%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);column-gap:7.6%;row-gap:4.4%}.modeSlot{border:0;background:transparent;color:#633716;padding:4% 3% 1%;font-weight:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px #fff;cursor:pointer}.modeSlot img{width:50%;height:48%;object-fit:contain;filter:drop-shadow(0 3px 3px #0003)}.modeSlot b{font-size:clamp(14px,3.8vw,20px)}.modeSlot small{font-size:clamp(9px,2.4vw,12px);font-weight:800;line-height:1.05}.modeSlot:active{transform:scale(.96)}
.diffSlots{position:absolute;left:21.4%;top:25.3%;width:59.3%;height:61%;display:grid;grid-template-rows:repeat(4,1fr);gap:6.7%}.diffSlot{border:0;background:transparent;font-weight:1000;font-size:clamp(20px,5.7vw,29px);text-shadow:0 2px #fff;color:#654122;cursor:pointer}.diffSlot:nth-child(1){color:#357024}.diffSlot:nth-child(2){color:#2368a4}.diffSlot:nth-child(3){color:#b24c17}.diffSlot:nth-child(4){color:#713c9f}.diffSlot:active{transform:scale(.97)}
.settingsBox,.rankBox,.pauseBox,.resultBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(89vw,460px);padding:24px 20px;border:10px solid #9a6336;border-radius:30px;background:#fff1ce;color:#5c351f;box-shadow:0 12px 30px #0008;text-align:center}.settingsBox h2,.rankBox h2,.pauseBox h2,.resultBox h2{margin:0 0 16px;font-size:32px}.setRow{display:flex;justify-content:space-between;align-items:center;padding:12px 3px;border-bottom:2px dashed #d3a870;font-weight:900}.toggle{width:72px;height:38px;border-radius:22px;border:0;background:#c89a67;color:#fff;font-weight:900}.toggle.on{background:#58a94b}.simpleBtn{border:0;border-radius:20px;background:#7fbc4e;color:#fff;padding:12px 22px;font-weight:1000;font-size:18px;margin:6px;box-shadow:0 4px 0 #3f6b29}.simpleBtn.blue{background:#3f9bd2;box-shadow-color:#236185}.simpleBtn.orange{background:#e99a36;box-shadow-color:#995b17}
.gameScreen{background:radial-gradient(circle at 50% 34%,#80c16d,#2d6845 74%,#173a29)}.gameScreen:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff8 0 1px,transparent 2px);background-size:70px 70px;opacity:.17}.hud{position:absolute;z-index:8;left:5px;right:5px;top:max(5px,env(safe-area-inset-top));display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-weight:900;text-shadow:0 2px 6px #000}.hud>div{margin:0 2px;padding:5px 2px;background:#86522fc9;border:3px solid #f2c36a;border-radius:16px}.hud small{display:block;font-size:9px}.hud b{font-size:22px}.pause{position:absolute;z-index:11;right:9px;top:70px;width:55px;height:55px;border:0;border-radius:50%;background:#8d552d;color:#fff;font-size:26px;font-weight:1000;box-shadow:0 3px 0 #55301a}.board{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-44%);width:min(98vw,560px);height:min(63vh,585px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.hole{position:relative;border:0;background:transparent;padding:0}.hole .base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.hole .target{position:absolute;width:78%;height:78%;object-fit:contain;left:11%;bottom:14%;opacity:0;transform:translateY(28%) scale(.78);transition:opacity .07s,transform .11s;filter:drop-shadow(0 5px 5px #0005)}.hole.live .target{opacity:1;transform:translateY(0) scale(1)}.spectators{position:absolute;z-index:2;left:0;right:0;bottom:max(0px,env(safe-area-inset-bottom));height:13vh;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.spectators img{height:100%;max-width:31vw;object-fit:contain;filter:drop-shadow(0 5px 6px #0008)}.hammerCursor{position:absolute;z-index:30;width:100px;height:100px;object-fit:contain;pointer-events:none;display:none;transform:translate(-28%,-76%) rotate(-13deg);filter:drop-shadow(0 6px 6px #0008)}.scoreBig{font-size:68px;font-weight:1000;color:#b66316}.rankList{list-style:none;padding:0;margin:0;text-align:left}.rankList li{display:grid;grid-template-columns:38px 1fr auto;gap:6px;padding:8px;border-bottom:2px dashed #d3a870;font-weight:900}.rankList li:first-child{color:#c5790c}.resultStats{font-weight:900;line-height:1.7}.badge{display:inline-block;background:#f4b535;color:#fff;border-radius:14px;padding:5px 12px;margin-bottom:6px;font-weight:1000}
@media(max-height:700px){.homeTitle{font-size:31px;top:2vh}.homeMenu{width:min(80vw,440px);bottom:1vh}.panelWrap{width:min(86vw,480px)}.board{height:56vh}.spectators{height:10vh}.hud b{font-size:18px}.hud>div{padding:3px}.pause{top:58px;width:46px;height:46px}.settingsBox,.rankBox,.pauseBox,.resultBox{transform:translate(-50%,-48%) scale(.88)}}
</style>
</head>
<body>
<main class="app">
<section id="home" class="screen active">
  <img class="artbg" id="homeBg"><div class="homeShade"></div>
  <div class="homeTitle">森林精靈打地鼠<small>CxQ FOREST WHACK</small></div>
  <div class="homeMenu">
    <button class="artBtn start" data-screen="mode"><img id="btnStart"></button>
    <button class="artBtn" data-screen="howto"><img id="btnHowto"></button>
    <button class="artBtn" data-screen="rank"><img id="btnRank"></button>
    <button class="artBtn settings" data-screen="settings"><img id="btnSettings"></button>
  </div>
</section>
<section id="howto" class="screen panelScreen"><button class="backBtn" data-screen="home">‹</button><div class="panelWrap"><img class="panelArt" id="howtoPanel"><div class="howRows">
  <div class="howRow"><img data-asset="normal"><div><b>普通地鼠</b><span>敲中 +10 分，連續命中會累積 Combo。</span></div></div>
  <div class="howRow"><img data-asset="gold"><div><b>皇冠金鼠</b><span>敲中 +50 分，但出現時間更短。</span></div></div>
  <div class="howRow"><img data-asset="bomb"><div><b>炸彈地鼠</b><span>不要敲！會扣分；生存模式還會扣生命。</span></div></div>
  <div class="howRow"><img data-asset="heart"><div><b>愛心精靈</b><span>生存模式中敲中可恢復 1 顆生命。</span></div></div>
</div></div></section>
<section id="mode" class="screen panelScreen"><button class="backBtn" data-screen="home">‹</button><div class="panelWrap"><img class="panelArt" id="modePanel"><div class="modeSlots" id="modeSlots"></div></div></section>
<section id="difficulty" class="screen panelScreen"><button class="backBtn" data-screen="mode">‹</button><div class="panelWrap"><img class="panelArt" id="difficultyPanel"><div class="diffSlots" id="diffSlots"></div></div></section>
<section id="settings" class="screen panelScreen"><button class="backBtn" data-screen="home">‹</button><div class="settingsBox"><h2>遊戲設定</h2><div class="setRow"><span>音效</span><button class="toggle on" id="soundToggle">ON</button></div><div class="setRow"><span>震動回饋</span><button class="toggle on" id="vibrateToggle">ON</button></div><div class="setRow"><span>首次提示</span><button class="toggle on" id="tipToggle">ON</button></div><p style="font-weight:800;font-size:13px">設定只儲存在目前裝置。</p></div></section>
<section id="game" class="screen gameScreen"><div class="hud"><div><small>時間</small><b id="time">60</b></div><div><small>分數</small><b id="score">0</b></div><div><small>COMBO</small><b id="combo">0</b></div><div><small>生命</small><b id="lives">—</b></div></div><button class="pause" id="pauseBtn">Ⅱ</button><div class="board" id="board"></div><div class="spectators"><img src="/cailucky/games/tetris/assets/characters/DCF9AE86-7791-4C18-A4C1-93CEC5090377.png"><img src="/cailucky/games/tetris/assets/characters/7A960F19-E814-4211-A9FE-58E17083C74D.png"><img src="/cailucky/games/tetris/assets/characters/F158E7B0-D03B-4208-91BE-6C1454836CA9.png"></div><img class="hammerCursor" id="hammerCursor" data-asset="hammer"></section>
<section id="pauseScreen" class="screen panelScreen"><div class="pauseBox"><span class="badge">遊戲暫停</span><h2>休息一下吧</h2><button class="simpleBtn" id="resume">繼續遊戲</button><button class="simpleBtn orange" id="restartFromPause">重新開始</button><button class="simpleBtn blue" id="quit">返回首頁</button></div></section>
<section id="result" class="screen panelScreen"><div class="resultBox"><span class="badge">遊戲結束</span><h2>本局得分</h2><div class="scoreBig" id="finalScore">0</div><div class="resultStats" id="resultInfo"></div><button class="simpleBtn" id="again">再玩一次</button><button class="simpleBtn blue" data-screen="rank">排行榜</button><button class="simpleBtn orange" data-screen="home">回首頁</button></div></section>
<section id="rank" class="screen panelScreen"><button class="backBtn" data-screen="home">‹</button><div class="rankBox"><h2>本機排行榜</h2><ol class="rankList" id="rankList"></ol><button class="simpleBtn orange" id="clearRank">清除紀錄</button></div></section>
</main>
<script src="v6_ui_1.js"></script><script src="mode_single.js"></script><script src="difficulty_single.js"></script><script src="btn_start_single.js"></script><script src="btn_howto_single.js"></script><script src="btn_rank_single.js"></script><script src="btn_settings_single.js"></script>
<script src="/cailucky/preview/whack-v5/assets/normal.js"></script>
<script src="/cailucky/preview/whack-v5/assets/gold.js"></script>
<script src="/cailucky/preview/whack-v5/assets/bomb.js"></script>
<script src="/cailucky/preview/whack-v5/assets/heart.js"></script>
<script src="/cailucky/preview/whack-v5/assets/hole.js"></script>
<script src="/cailucky/preview/whack-v5/assets/hammer.js"></script>
<script>
(()=>{'use strict';
const UI=window.CXQ_UI,A=window.CXQ_ASSETS,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$('#homeBg').src=UI.home;$('#howtoPanel').src=UI.howto;$('#modePanel').src=UI.mode;$('#difficultyPanel').src=UI.difficulty;$('#btnStart').src=UI.btn_start;$('#btnHowto').src=UI.btn_howto;$('#btnRank').src=UI.btn_rank;$('#btnSettings').src=UI.btn_settings;$$('[data-asset]').forEach(i=>i.src=A[i.dataset.asset]);
const modeDefs=[['timed','經典模式','60 秒高分',A.normal],['survival','生存模式','3 顆生命',A.heart],['combo','連擊模式','Combo 加成',A.gold],['bomb','炸彈危機','炸彈更多',A.bomb],['golden','黃金獵人','金鼠更多',A.gold],['reaction','反應訓練','高速目標',A.hammer]];
const diffs={easy:['簡單',1100,920,.07,.09],normal:['普通',850,700,.12,.13],hard:['困難',650,520,.18,.16],hell:['大師',500,390,.24,.19]};
let settings=Object.assign({sound:true,vibrate:true,tips:true},JSON.parse(localStorage.getItem('cxq_whack_v6_settings')||'{}'));
let st={mode:'timed',diff:'normal',score:0,combo:0,max:0,hits:0,bombs:0,lives:3,time:60,running:false,paused:false,active:new Map(),spawn:null,clock:null};
function show(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='rank')renderRank();}
$$('[data-screen]').forEach(b=>b.onclick=()=>show(b.dataset.screen));
const ms=$('#modeSlots');modeDefs.forEach(m=>{let b=document.createElement('button');b.className='modeSlot';b.innerHTML=`<img src="${m[3]}"><b>${m[1]}</b><small>${m[2]}</small>`;b.onclick=()=>{st.mode=m[0];show('difficulty')};ms.append(b)});
const ds=$('#diffSlots');Object.entries(diffs).forEach(([id,d])=>{let b=document.createElement('button');b.className='diffSlot';b.textContent=d[0];b.onclick=()=>{st.diff=id;start()};ds.append(b)});
const board=$('#board');for(let i=0;i<9;i++){let b=document.createElement('button');b.className='hole';b.dataset.i=i;b.innerHTML=`<img class="base" src="${A.hole}"><img class="target">`;b.onpointerdown=e=>{hammer(e);hit(i)};board.append(b)}
function cfg(){let d=diffs[st.diff],c={speed:d[1],visible:d[2],bomb:d[3],gold:d[4],multi:(st.diff==='hard'||st.diff==='hell')?2:1};if(st.mode==='reaction'){c.speed*=.72;c.visible*=.65}if(st.mode==='bomb')c.bomb+=.22;if(st.mode==='golden')c.gold+=.22;return c}
function clearTimers(){clearInterval(st.spawn);clearInterval(st.clock);st.active.forEach(v=>clearTimeout(v.t));st.active.clear();$$('.hole').forEach(h=>{h.classList.remove('live');h.querySelector('.target').src=''})}
function start(){clearTimers();Object.assign(st,{score:0,combo:0,max:0,hits:0,bombs:0,lives:3,time:st.mode==='reaction'?45:60,running:true,paused:false});hud();show('game');let c=cfg();st.spawn=setInterval(spawn,c.speed);st.clock=setInterval(()=>{if(!st.running||st.paused)return;if(--st.time<=0)return end();hud()},1000);setTimeout(spawn,250)}
function pick(c){let r=Math.random();if(r<c.bomb)return'bomb';if(r<c.bomb+c.gold)return'gold';if(st.mode==='survival'&&r<c.bomb+c.gold+.1)return'heart';return'normal'}
function spawn(){if(!st.running||st.paused)return;let c=cfg(),free=[0,1,2,3,4,5,6,7,8].filter(i=>!st.active.has(i)),n=Math.min(free.length,c.multi+(Math.random()<.2?1:0));while(n--&&free.length){let p=Math.random()*free.length|0,i=free.splice(p,1)[0],type=pick(c),h=$(`.hole[data-i="${i}"]`),target=h.querySelector('.target');target.src=A[type];h.classList.add('live');let t=setTimeout(()=>miss(i),c.visible*(type==='gold'?.72:1));st.active.set(i,{type,t})}}
function miss(i){let e=st.active.get(i);if(!e)return;st.active.delete(i);let h=$(`.hole[data-i="${i}"]`);h.classList.remove('live');h.querySelector('.target').src='';if(e.type!=='bomb'&&e.type!=='heart'){st.combo=0;if(st.mode==='survival'&&--st.lives<=0)return end()}hud()}
function hit(i){if(!st.running||st.paused)return;let e=st.active.get(i);if(!e)return;clearTimeout(e.t);st.active.delete(i);let h=$(`.hole[data-i="${i}"]`);h.classList.remove('live');h.querySelector('.target').src='';if(settings.vibrate&&navigator.vibrate)navigator.vibrate(18);if(e.type==='bomb'){st.bombs++;st.combo=0;st.score=Math.max(0,st.score-40);if(st.mode==='survival'&&--st.lives<=0)return end()}else{st.hits++;st.combo++;st.max=Math.max(st.max,st.combo);let base=e.type==='gold'?50:e.type==='heart'?20:10;if(e.type==='heart'&&st.mode==='survival')st.lives=Math.min(5,st.lives+1);st.score+=Math.round(base*(1+Math.min(2,st.combo*(st.mode==='combo'?.06:.025))))}hud()}
function hud(){$('#time').textContent=st.time;$('#score').textContent=st.score;$('#combo').textContent=st.combo;$('#lives').textContent=st.mode==='survival'?st.lives:'—'}
function hammer(e){let h=$('#hammerCursor');h.style.display='block';h.style.left=e.clientX+'px';h.style.top=e.clientY+'px';h.animate([{transform:'translate(-28%,-76%) rotate(-35deg)'},{transform:'translate(-28%,-76%) rotate(12deg)'},{transform:'translate(-28%,-76%) rotate(-13deg)'}],{duration:180});setTimeout(()=>h.style.display='none',190)}
function end(){if(!st.running)return;st.running=false;clearTimers();$('#finalScore').textContent=st.score;$('#resultInfo').innerHTML=`最高連擊：${st.max}<br>成功命中：${st.hits}<br>誤敲炸彈：${st.bombs}`;saveRank();show('result')}
function saveRank(){let r=JSON.parse(localStorage.getItem('cxq_whack_v6_rank')||'[]');r.push({score:st.score,mode:st.mode,diff:st.diff,date:new Date().toLocaleDateString('zh-TW')});r.sort((a,b)=>b.score-a.score);localStorage.setItem('cxq_whack_v6_rank',JSON.stringify(r.slice(0,10)))}
function renderRank(){let r=JSON.parse(localStorage.getItem('cxq_whack_v6_rank')||'[]'),ol=$('#rankList');ol.innerHTML='';if(!r.length){ol.innerHTML='<li><span>—</span><span>還沒有紀錄</span><b>0</b></li>';return}r.forEach((x,i)=>{let li=document.createElement('li');li.innerHTML=`<span>${i+1}</span><span>${x.date}</span><b>${x.score}</b>`;ol.append(li)})}
$('#pauseBtn').onclick=()=>{if(!st.running)return;st.paused=true;show('pauseScreen')};$('#resume').onclick=()=>{st.paused=false;show('game')};$('#quit').onclick=()=>{st.running=false;clearTimers();show('home')};$('#restartFromPause').onclick=()=>start();$('#again').onclick=()=>start();$('#clearRank').onclick=()=>{localStorage.removeItem('cxq_whack_v6_rank');renderRank()};
function syncSettings(){[['soundToggle','sound'],['vibrateToggle','vibrate'],['tipToggle','tips']].forEach(([id,k])=>{let b=$('#'+id);b.textContent=settings[k]?'ON':'OFF';b.classList.toggle('on',settings[k]);b.onclick=()=>{settings[k]=!settings[k];localStorage.setItem('cxq_whack_v6_settings',JSON.stringify(settings));syncSettings()}})}syncSettings();
})();
</script>
</body></html>
