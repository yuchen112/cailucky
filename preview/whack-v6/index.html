<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>CxQ 森林精靈打地鼠 v11</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif}button{font:inherit}.app{position:relative;width:100%;height:100dvh;overflow:hidden}.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}.screenBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tap{border:0;padding:0;margin:0;background:transparent;cursor:pointer;touch-action:manipulation}.tap img{display:block;width:100%;height:100%;object-fit:contain}.homeLogo{position:absolute;left:4%;top:max(2%,env(safe-area-inset-top));width:92%;height:20%;object-fit:contain;pointer-events:none}.homeCharacter{position:absolute;pointer-events:none;object-fit:contain}.homeGrowth{left:-4%;bottom:25%;width:47%;height:42%;object-position:left bottom}.homeJoy{right:-6%;bottom:28%;width:42%;height:35%;object-position:right bottom}.homeMenu{position:absolute;z-index:5;left:8%;right:8%;bottom:max(1.5%,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:.8vh 1.2vw}.homeMenu .start{grid-column:1/-1;width:88%;justify-self:center}.homeMenu .settings{grid-column:1/-1;width:52%;justify-self:center}.panelWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,560px);height:min(94dvh,746px)}.panelArt{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.back{position:absolute;z-index:20;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));border:0;background:transparent;color:white;font-size:48px;line-height:1;cursor:pointer}.howRows{position:absolute;left:16%;top:32%;width:69%;height:48%;display:grid;grid-template-rows:repeat(4,1fr);gap:1.5%}.howRow{display:grid;grid-template-columns:25% 1fr;align-items:center;color:#503319;font-weight:800}.howRow img{width:94%;height:94%;object-fit:contain}.howRow b{display:block;font-size:clamp(15px,4.2vw,22px)}.howRow span{font-size:clamp(11px,3.1vw,16px);line-height:1.2}.modeSlots{position:absolute;left:18%;top:26%;width:64%;height:63%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);column-gap:8%;row-gap:4%}.modeSlot{border:0;background:transparent;color:#593616;padding:1%;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.modeSlot img{width:48%;height:48%;object-fit:contain}.modeSlot b{font-size:clamp(14px,3.8vw,20px)}.modeSlot small{font-size:clamp(9px,2.4vw,12px);line-height:1.05}.diffSlots{position:absolute;left:21%;top:25%;width:59%;height:61%;display:grid;grid-template-rows:repeat(4,1fr);gap:6.5%}.diffSlot{border:0;background:transparent;color:#3b2c1e;font-weight:1000;font-size:clamp(20px,5.7vw,29px);cursor:pointer}.plainScreen{position:absolute;inset:0}.plainContent{position:absolute;left:9%;right:9%;top:18%;bottom:7%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center}.plainTitle{width:min(86vw,520px);max-height:17vh;object-fit:contain;margin-bottom:2vh}.plainAction{border:0;background:transparent;color:white;font-weight:900;font-size:clamp(20px,5.2vw,30px);padding:10px 14px;margin:5px;cursor:pointer}.setRow{width:min(78vw,430px);display:flex;align-items:center;justify-content:space-between;font-size:clamp(18px,4.5vw,25px);font-weight:900;padding:10px 0}.toggle{border:0;background:transparent;color:white;font-weight:1000;font-size:inherit;cursor:pointer}.rankList{width:min(80vw,430px);list-style:none;padding:0;margin:4px 0 12px;text-align:left;font-weight:900}.rankList li{display:grid;grid-template-columns:42px 1fr auto;gap:8px;padding:7px 0}.scoreBig{font-size:clamp(58px,16vw,92px);font-weight:1000}.resultStats{font-size:clamp(16px,4vw,22px);font-weight:900;line-height:1.7}.gameBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hud{position:absolute;z-index:8;left:3%;right:3%;top:max(4px,env(safe-area-inset-top));display:grid;grid-template-columns:repeat(4,1fr);text-align:center;color:#332414;font-weight:1000}.hud small{display:block;font-size:10px}.hud b{font-size:clamp(17px,5vw,25px)}.pause{position:absolute;z-index:11;right:10px;top:58px;border:0;background:transparent;color:#332414;font-size:34px;font-weight:1000;cursor:pointer}.board{position:absolute;z-index:4;left:50%;top:65.5%;transform:translate(-50%,-50%);width:min(72vw,420px);height:min(25.5vh,330px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.hole{position:relative;border:0;background:transparent;padding:0}.hole .base{display:none}.hole .target{position:absolute;width:96%;height:96%;object-fit:contain;left:2%;bottom:6%;opacity:0;transform:translateY(28%) scale(.78);transition:opacity .07s,transform .11s}.hole.live .target{opacity:1;transform:translateY(0) scale(1)}.spectators{position:absolute;z-index:2;left:0;right:0;bottom:max(0px,env(safe-area-inset-bottom));height:12vh;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.spectators img{height:100%;max-width:31vw;object-fit:contain}.hammerCursor{position:absolute;z-index:30;width:100px;height:100px;object-fit:contain;pointer-events:none;display:none;transform:translate(-28%,-76%) rotate(-13deg)}
@media(max-height:700px){.homeMenu{left:14%;right:14%}.panelWrap{width:min(84vw,480px);height:min(92dvh,640px)}.board{height:25vh;width:min(70vw,410px)}.spectators{height:9vh}.plainContent{top:13%;bottom:3%}}
</style>
</head>
<body>
<main class="app">
<section id="home" class="screen active"><img class="screenBg" id="homeBg"><img class="homeLogo" id="homeLogo" alt="森林精靈打地鼠"><img class="homeCharacter homeGrowth" src="/cailucky/games/fortune/assets/characters/growth.png" alt="成長"><img class="homeCharacter homeJoy" src="/cailucky/games/fortune/assets/characters/joy.png" alt="快樂"><div class="homeMenu"><button class="tap start" data-screen="mode"><img id="btnStart"></button><button class="tap" data-screen="howto"><img id="btnHowto"></button><button class="tap" data-screen="rank"><img id="btnRank"></button><button class="tap settings" data-screen="settings"><img id="btnSettings"></button></div></section>
<section id="howto" class="screen"><img class="screenBg" id="howBg"><button class="back" data-screen="home">‹</button><div class="panelWrap"><img class="panelArt" id="howtoPanel"><div class="howRows"><div class="howRow"><img data-asset="normal"><div><b>普通地鼠</b><span>敲中 +10 分；連續命中累積 Combo。</span></div></div><div class="howRow"><img data-asset="gold"><div><b>皇冠金鼠</b><span>敲中 +50 分；停留時間更短。</span></div></div><div class="howRow"><img data-asset="bomb"><div><b>炸彈地鼠</b><span>不要敲；扣 40 分，生存模式再扣生命。</span></div></div><div class="howRow"><img data-asset="heart"><div><b>愛心精靈</b><span>生存模式恢復 1 顆生命，最多 5 顆。</span></div></div></div></div></section>
<section id="mode" class="screen"><img class="screenBg" id="modeBg"><button class="back" data-screen="home">‹</button><div class="panelWrap"><img class="panelArt" id="modePanel"><div class="modeSlots" id="modeSlots"></div></div></section>
<section id="difficulty" class="screen"><img class="screenBg" id="diffBg"><button class="back" data-screen="mode">‹</button><div class="panelWrap"><img class="panelArt" id="difficultyPanel"><div class="diffSlots" id="diffSlots"></div></div></section>
<section id="settings" class="screen plainScreen"><img class="screenBg" id="settingsBg"><button class="back" data-screen="home">‹</button><div class="plainContent"><img class="plainTitle" id="settingsTitle"><div class="setRow"><span>音效</span><button class="toggle" id="soundToggle">ON</button></div><div class="setRow"><span>震動回饋</span><button class="toggle" id="vibrateToggle">ON</button></div><div class="setRow"><span>首次提示</span><button class="toggle" id="tipToggle">ON</button></div><button class="plainAction" data-screen="home">返回首頁</button></div></section>
<section id="game" class="screen"><img class="gameBg" id="gameBg"><div class="hud"><div><small>時間</small><b id="time">60</b></div><div><small>分數</small><b id="score">0</b></div><div><small>COMBO</small><b id="combo">0</b></div><div><small>生命</small><b id="lives">—</b></div></div><button class="pause" id="pauseBtn">Ⅱ</button><div class="board" id="board"></div><div class="spectators"><img src="/cailucky/games/fortune/assets/characters/growth.png"><img src="/cailucky/games/fortune/assets/characters/joy.png"><img src="/cailucky/games/fortune/assets/characters/luck.png"></div><img class="hammerCursor" id="hammerCursor" data-asset="hammer"></section>
<section id="pauseScreen" class="screen plainScreen"><img class="screenBg" id="pauseBg"><div class="plainContent"><div style="font-size:clamp(38px,10vw,64px);font-weight:1000;margin-bottom:3vh">遊戲暫停</div><button class="plainAction" id="resume">繼續遊戲</button><button class="plainAction" id="restartFromPause">重新開始</button><button class="plainAction" id="quit">返回首頁</button></div></section>
<section id="result" class="screen plainScreen"><img class="screenBg" id="resultBg"><div class="plainContent"><div style="font-size:clamp(30px,8vw,52px);font-weight:1000">本局得分</div><div class="scoreBig" id="finalScore">0</div><div class="resultStats" id="resultInfo"></div><button class="plainAction" id="again">再玩一次</button><button class="plainAction" data-screen="rank">排行榜</button><button class="plainAction" data-screen="home">回首頁</button></div></section>
<section id="rank" class="screen plainScreen"><img class="screenBg" id="rankBg"><button class="back" data-screen="home">‹</button><div class="plainContent"><img class="plainTitle" id="rankTitle"><ol class="rankList" id="rankList"></ol><button class="plainAction" id="clearRank">清除紀錄</button></div></section>
</main>
<script src="v6_ui_1.js"></script><script src="mode_single.js"></script><script src="difficulty_single.js"></script><script src="btn_start_single.js"></script><script src="btn_howto_single.js"></script><script src="btn_rank_single.js"></script><script src="btn_settings_single.js"></script>
<script src="/cailucky/preview/whack-v5/assets/normal.js"></script><script src="/cailucky/preview/whack-v5/assets/gold.js"></script><script src="/cailucky/preview/whack-v5/assets/bomb.js"></script><script src="/cailucky/preview/whack-v5/assets/heart.js"></script><script src="/cailucky/preview/whack-v5/assets/hole.js"></script><script src="/cailucky/preview/whack-v5/assets/hammer.js"></script>
<script>
(()=>{'use strict';
const UI=window.CXQ_UI,A=window.CXQ_ASSETS,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const V11='v11/';
['homeBg','howBg','modeBg','diffBg','settingsBg','gameBg','pauseBg','resultBg','rankBg'].forEach(id=>$('#'+id).src=V11+'home_bg.webp?v=11');
$('#homeLogo').src=V11+'home_logo.webp?v=11';
$('#howtoPanel').src=UI.howto;$('#modePanel').src=UI.mode;$('#difficultyPanel').src=UI.difficulty;$('#btnStart').src=V11+'btn_start.webp?v=11';$('#btnHowto').src=V11+'btn_howto.webp?v=11';$('#btnRank').src=V11+'btn_rank.webp?v=11';$('#btnSettings').src=V11+'btn_settings.webp?v=11';$('#settingsTitle').src=V11+'btn_settings.webp?v=11';$('#rankTitle').src=V11+'btn_rank.webp?v=11';$$('[data-asset]').forEach(i=>i.src=A[i.dataset.asset]);
const modeDefs=[['timed','經典模式','60 秒高分',A.normal],['survival','生存模式','3 顆生命',A.heart],['combo','連擊模式','Combo 加成',A.gold],['bomb','炸彈危機','炸彈更多',A.bomb],['golden','黃金獵人','金鼠更多',A.gold],['reaction','反應訓練','高速目標',A.hammer]];
const diffs={easy:['簡單',1100,920,.07,.09],normal:['普通',850,700,.12,.13],hard:['困難',650,520,.18,.16],hell:['大師',500,390,.24,.19]};
let settings=Object.assign({sound:true,vibrate:true,tips:true},JSON.parse(localStorage.getItem('cxq_whack_v11_settings')||'{}'));
let st={mode:'timed',diff:'normal',score:0,combo:0,max:0,hits:0,bombs:0,lives:3,time:60,running:false,paused:false,active:new Map(),spawn:null,clock:null};
function show(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='rank')renderRank()}$$('[data-screen]').forEach(b=>b.onclick=()=>show(b.dataset.screen));
const ms=$('#modeSlots');modeDefs.forEach(m=>{let b=document.createElement('button');b.className='modeSlot';b.innerHTML=`<img src="${m[3]}"><b>${m[1]}</b><small>${m[2]}</small>`;b.onclick=()=>{st.mode=m[0];show('difficulty')};ms.append(b)});
const ds=$('#diffSlots');Object.entries(diffs).forEach(([id,d])=>{let b=document.createElement('button');b.className='diffSlot';b.textContent=d[0];b.onclick=()=>{st.diff=id;start()};ds.append(b)});
const board=$('#board');for(let i=0;i<9;i++){let b=document.createElement('button');b.className='hole';b.dataset.i=i;b.innerHTML=`<img class="base" src="${A.hole}"><img class="target">`;b.onpointerdown=e=>{hammer(e);hit(i)};board.append(b)}
function cfg(){let d=diffs[st.diff],c={speed:d[1],visible:d[2],bomb:d[3],gold:d[4],multi:(st.diff==='hard'||st.diff==='hell')?2:1};if(st.mode==='reaction'){c.speed*=.72;c.visible*=.65}if(st.mode==='bomb')c.bomb+=.22;if(st.mode==='golden')c.gold+=.22;return c}
function clearTimers(){clearInterval(st.spawn);clearInterval(st.clock);st.active.forEach(v=>clearTimeout(v.t));st.active.clear();$$('.hole').forEach(h=>{h.classList.remove('live');h.querySelector('.target').src=''})}
function start(){clearTimers();Object.assign(st,{score:0,combo:0,max:0,hits:0,bombs:0,lives:3,time:st.mode==='reaction'?45:60,running:true,paused:false});hud();show('game');let c=cfg();st.spawn=setInterval(spawn,c.speed);st.clock=setInterval(()=>{if(!st.running||st.paused)return;if(--st.time<=0)return end();hud()},1000);setTimeout(spawn,250)}
function pick(c){let r=Math.random();if(r<c.bomb)return'bomb';if(r<c.bomb+c.gold)return'gold';if(st.mode==='survival'&&r<c.bomb+c.gold+.1)return'heart';return'normal'}
function spawn(){if(!st.running||st.paused)return;let c=cfg(),free=[0,1,2,3,4,5,6,7,8].filter(i=>!st.active.has(i)),n=Math.min(free.length,c.multi+(Math.random()<.2?1:0));while(n--&&free.length){let p=Math.random()*free.length|0,i=free.splice(p,1)[0],type=pick(c),h=$(`.hole[data-i="${i}"]`),target=h.querySelector('.target');target.src=A[type];h.classList.add('live');let t=setTimeout(()=>miss(i),c.visible*(type==='gold'?.72:1));st.active.set(i,{type,t})}}
function miss(i){let e=st.active.get(i);if(!e)return;st.active.delete(i);let h=$(`.hole[data-i="${i}"]`);h.classList.remove('live');h.querySelector('.target').src='';if(e.type!=='bomb'&&e.type!=='heart'){st.combo=0;if(st.mode==='survival'&&--st.lives<=0)return end()}hud()}
function hit(i){if(!st.running||st.paused)return;let e=st.active.get(i);if(!e)return;clearTimeout(e.t);st.active.delete(i);let h=$(`.hole[data-i="${i}"]`);h.classList.remove('live');h.querySelector('.target').src='';if(settings.vibrate&&navigator.vibrate)navigator.vibrate(18);if(e.type==='bomb'){st.bombs++;st.combo=0;st.score=Math.max(0,st.score-40);if(st.mode==='survival'&&--st.lives<=0)return end()}else{st.hits++;st.combo++;st.max=Math.max(st.max,st.combo);let base=e.type==='gold'?50:e.type==='heart'?20:10;if(e.type==='heart'&&st.mode==='survival')st.lives=Math.min(5,st.lives+1);st.score+=Math.round(base*(1+Math.min(2,st.combo*(st.mode==='combo'?.06:.025))))}hud()}
function hud(){$('#time').textContent=st.time;$('#score').textContent=st.score;$('#combo').textContent=st.combo;$('#lives').textContent=st.mode==='survival'?st.lives:'—'}
function hammer(e){let h=$('#hammerCursor');h.style.display='block';h.style.left=e.clientX+'px';h.style.top=e.clientY+'px';h.animate([{transform:'translate(-28%,-76%) rotate(-35deg)'},{transform:'translate(-28%,-76%) rotate(12deg)'},{transform:'translate(-28%,-76%) rotate(-13deg)'}],{duration:180});setTimeout(()=>h.style.display='none',190)}
function end(){if(!st.running)return;st.running=false;clearTimers();$('#finalScore').textContent=st.score;$('#resultInfo').innerHTML=`最高連擊：${st.max}<br>成功命中：${st.hits}<br>誤敲炸彈：${st.bombs}`;saveRank();show('result')}
function saveRank(){let r=JSON.parse(localStorage.getItem('cxq_whack_v11_rank')||'[]');r.push({score:st.score,mode:st.mode,diff:st.diff,date:new Date().toLocaleDateString('zh-TW')});r.sort((a,b)=>b.score-a.score);localStorage.setItem('cxq_whack_v11_rank',JSON.stringify(r.slice(0,10)))}
function renderRank(){let r=JSON.parse(localStorage.getItem('cxq_whack_v11_rank')||'[]'),ol=$('#rankList');ol.innerHTML='';if(!r.length){ol.innerHTML='<li><span>—</span><span>還沒有紀錄</span><b>0</b></li>';return}r.forEach((x,i)=>{let li=document.createElement('li');li.innerHTML=`<span>${i+1}</span><span>${x.date}</span><b>${x.score}</b>`;ol.append(li)})}
$('#pauseBtn').onclick=()=>{if(!st.running)return;st.paused=true;show('pauseScreen')};$('#resume').onclick=()=>{st.paused=false;show('game')};$('#quit').onclick=()=>{st.running=false;clearTimers();show('home')};$('#restartFromPause').onclick=()=>start();$('#again').onclick=()=>start();$('#clearRank').onclick=()=>{localStorage.removeItem('cxq_whack_v11_rank');renderRank()};
function syncSettings(){[['soundToggle','sound'],['vibrateToggle','vibrate'],['tipToggle','tips']].forEach(([id,k])=>{let b=$('#'+id);b.textContent=settings[k]?'ON':'OFF';b.onclick=()=>{settings[k]=!settings[k];localStorage.setItem('cxq_whack_v11_settings',JSON.stringify(settings));syncSettings()}})}syncSettings();
})();
</script>
</body></html>
