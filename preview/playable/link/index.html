<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夢境織光・角色連連看</title><link rel="stylesheet" href="inline-style-00.css"><style id="cxq-site-back-style">#cxq-site-back{position:fixed;z-index:2147483647;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(28,32,42,.72);color:#fff;text-decoration:none;font:800 14px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.18)}#cxq-site-back:hover{background:rgba(28,32,42,.86)}</style><script src="../common/asset-shim.js"></script><style id="cxq-test-cover">body::after{content:"";position:fixed;inset:0;z-index:-999;background:linear-gradient(#17131dcc,#17131dee),url("../../covers-v3/link.svg") center/cover no-repeat;pointer-events:none}#cxq-preview-badge{position:fixed;z-index:2147483646;right:10px;top:10px;padding:6px 9px;border-radius:999px;background:#ffedb8;color:#694b13;font:800 11px system-ui}</style></head><body><div id="cxq-preview-badge">GitHub 測試版</div><a id="cxq-site-back" href="../../game-integration-v4-playable.html">← 返回小遊戲</a><main class="app"><header class="brand"><div class="logo"><h1>夢境織光</h1><p id="subtitle">角色收藏連連看</p></div><div class="header-actions"><button class="round-btn help" id="help" aria-label="玩法說明">?</button><button class="round-btn pause" id="pause" aria-label="暫停">Ⅱ</button></div></header><section class="stats"><div class="stat"><b id="left">0</b><span>待配對</span></div><div class="stat"><b id="time">00:00</b><span>旅程時間</span></div><div class="stat"><b id="hints">3</b><span>靈光提示</span></div><div class="stat"><b id="shuffles">3</b><span>命運洗牌</span></div></section><section class="game" id="game"><div class="board-wrap" id="wrap"><div class="board" id="board"></div><svg id="path"></svg></div><div class="overlay" id="pauseLayer"><div><b>旅程暫停</b><p>點右上角繼續冒險</p></div></div></section><nav class="toolbar"><button class="art-btn" id="new">✦ 新旅程</button><button class="art-btn" id="hint">燈 靈光</button><button class="art-btn" id="shuffle">↝ 洗牌</button><button class="art-btn" id="settings">⚙ 設定</button></nav></main><div class="modal-mask show" id="setup"><div class="modal"><h2 id="modalTitle">選擇這次的旅程</h2><p id="modalDesc">選擇喜愛的圖案，展開這次的織光旅程</p><div class="fields"><div class="field"><label>冒險難度</label><select id="difficulty"><option value="easy">悠閒・6 × 6</option><option value="normal" selected>經典・8 × 8</option><option value="hard">挑戰・8 × 10</option></select></div><div class="field"><label>時間模式</label><select id="mode"><option value="0">無限旅程</option><option value="300">5 分鐘倒數</option><option value="180">3 分鐘倒數</option></select></div><div class="field"><label>連連看圖案系列</label><div class="theme-grid"><button class="theme active" data-set="characters"><img src="assets/sets/characters/00.png"><span>我的角色</span></button><button class="theme" data-set="animals"><img src="assets/sets/animals/00.png"><span>森林動物</span></button><button class="theme" data-set="desserts"><img src="assets/sets/desserts/00.png"><span>甜點派對</span></button><button class="theme" data-set="magic"><img src="assets/sets/magic/00.png"><span>魔法寶物</span></button></div></div></div><div class="actions"><button id="close">返回</button><button class="go" id="start">開始冒險</button></div></div></div><div class="modal-mask" id="result"><div class="modal"><h2 id="resultTitle">完成旅程！</h2><p id="resultText"></p><div class="actions"><button id="resultSet">調整設定</button><button class="go" id="again">再玩一次</button></div></div></div><div class="modal-mask" id="howto"><div class="modal"><h2>冒險玩法</h2><p>用最短的魔法絲線，讓相同夥伴重逢</p><div class="howto"><div class="rule"><i>①</i><div><b>找出相同角色</b><span>依序點選兩張相同的角色卡牌。</span></div></div><div class="rule"><i>⌁</i><div><b>最多轉彎兩次</b><span>路線不能穿過其他卡牌，最多轉兩個彎，也能從棋盤外圍繞行。</span></div></div><div class="rule"><i>✦</i><div><b>善用靈光與洗牌</b><span>找不到時使用靈光；沒有路時用洗牌重整。</span></div></div><div class="rule"><i>✓</i><div><b>完成旅程</b><span>在時間結束前配對所有角色。</span></div></div></div><div class="actions" style="grid-template-columns:1fr"><button class="go" id="howClose">我知道了</button></div></div></div><div class="toast" id="toast"></div><script src="inline-script-00.js"></script></body></html>
