<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>每日占卜</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#453b3c;background:#ede7df}body{min-height:100dvh;background:linear-gradient(#1b1a28bb,#1b1a28dd),url('../covers-v3/fortune.svg') center/cover fixed no-repeat}.app{width:min(100%,760px);min-height:100dvh;margin:auto;background:#f8f2e9ee;box-shadow:0 0 70px #0005}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #d8cec3;background:#fffaf3dd;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}.top b{font-size:19px}.top button,.back{border:0;background:none;color:#67595a;font-weight:800;cursor:pointer}.view{padding:34px 22px 50px}.hero{text-align:center;padding:36px 18px 30px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#9a8177;font-weight:900}.hero h1{font:500 clamp(48px,10vw,78px)/1.05 Georgia,"Noto Serif TC",serif;margin:12px 0}.hero p{color:#7f7270;line-height:1.8}.primary{border:0;border-radius:6px;background:#4d4244;color:white;padding:15px 22px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px #4d42442a}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.mode{border:1px solid #d9cec1;background:#fffaf5;padding:17px;text-align:left;border-radius:13px;cursor:pointer}.mode b{display:block;font-size:18px;margin-bottom:5px}.mode small{color:#897b78;line-height:1.5}.session{max-width:570px;margin:auto}.session h1{font:500 48px Georgia,"Noto Serif TC",serif;margin:10px 0}.session p{color:#756b69;line-height:1.75}.question{width:100%;min-height:95px;border:1px solid #d7cbc0;border-radius:10px;padding:12px;background:#fffdf9;font:inherit;margin:15px 0}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:35px auto}.card{width:92px;height:150px;border:0;border-radius:12px;background:repeating-radial-gradient(circle at center,#a9acc3 0 4px,#575d7a 6px 13px);box-shadow:0 15px 25px #40394835,inset 0 0 0 6px #cbb080;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-10px)}.stone{width:105px;height:75px;border:0;border-radius:55% 45% 60% 40%;background:radial-gradient(circle at 35% 28%,#fff4cf,#aa9073 50%,#5e5045);box-shadow:0 16px 25px #40394835;cursor:pointer}.door{width:120px;height:190px;border:0;border-radius:65px 65px 3px 3px;background:linear-gradient(160deg,#6d6778,#3f3c4e);color:white;font-weight:900;cursor:pointer}.door:nth-child(2){background:linear-gradient(160deg,#c4a98a,#756455)}.door:nth-child(3){background:linear-gradient(160deg,#70847a,#394a45)}.result{background:#fffdf8;border:1px solid #d9cec1;border-radius:16px;padding:25px;box-shadow:0 18px 40px #4e414119}.result h1{font:500 42px Georgia,"Noto Serif TC",serif;margin:5px 0 10px}.score{display:inline-grid;place-items:center;width:78px;height:78px;border-radius:50%;background:#6f687e;color:white;font-size:28px;font-weight:900;float:right;margin-left:12px}.result p{line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.box{padding:13px;background:#f4ece3;border-radius:10px}.box small{color:#8c7c75;font-weight:900}.action{padding:15px;border-left:4px solid #9d8b76;background:#f1e8dc}.journal article{padding:15px 0;border-bottom:1px solid #ddd0c3}.journal h3{margin:5px 0}.muted{color:#8a7d79;font-size:13px}.badge{position:fixed;right:10px;bottom:10px;background:#ffedb8;color:#694b13;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}.siteback{position:fixed;left:10px;top:72px;z-index:30;background:#282532c9;color:#fff;padding:8px 11px;border-radius:999px;text-decoration:none;font-size:12px;font-weight:800}@media(max-width:560px){.modes{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.view{padding:28px 14px 45px}.card{width:62px;height:110px;margin:0 -3px}.session h1{font-size:40px}}
</style></head><body><a class="siteback" href="../game-integration-v4-playable.html">← 返回小遊戲</a><div class="badge">GitHub 測試版</div><main class="app"><header class="top"><b>命　每日占卜</b><button id="journalBtn">占卜手帳</button></header><section id="root"></section></main><script>
const MODES={daily:{n:'今日運勢',k:'一天一次的溫柔提醒'},love:{n:'感情占卜',k:'關係裡沒有標準答案'},career:{n:'工作財運',k:'把混亂變成可行的一步'},decision:{n:'是非・二選一',k:'不是替你選，而是看清差異'},mood:{n:'心情測驗',k:'你現在真正需要的是什麼？'}};
const R={daily:[['雨後初晴',78,'早上的情緒可能有些雜亂，但真正的局勢比你想像中穩定。午後開始，一件遲遲沒有回應的事情會出現小小轉機。','整理、回覆訊息、完成舊任務','在疲憊時做重大決定','刪除或收起一件不再需要的東西。'],['風正在轉向',84,'今天適合主動一點。你不需要準備到完美，只要先把真正的需要說清楚，停滯的關係或工作就可能開始移動。','提出需求、短程出門、開始新計畫','反覆猜測別人的想法','在中午前完成一件拖延三天以上的小事。'],['安靜累積',69,'今天不是衝刺的日子。看似沒有進展的地方，其實正在累積必要的條件。減少外界雜訊，你會更清楚自己真正想留下什麼。','閱讀、存錢、獨處、整理順序','因焦慮而臨時加碼','留二十分鐘不看訊息，只專注做一件事。']],love:[['靠近，但不要催促',76,'關係裡存在真實的好感，只是雙方的速度不完全相同。現在最有力量的做法不是試探，而是讓互動保持自然與穩定。','真誠回應、輕鬆邀約、說清界線','用冷淡測試對方是否在意','傳遞一個不帶壓力、可以被輕鬆回覆的訊息。'],['先回到自己的位置',61,'你可能把太多注意力放在對方的反應上，因而忽略了自己的感受。這段關係真正需要的是平衡，而不是更多用力。','照顧生活節奏、觀察行動、保留空間','替對方找理由或過度解讀','寫下你希望一段關係帶給你的三種感受。'],['一次溫柔的確認',82,'模糊已經累積到需要被說清楚的程度。這次溝通不必沉重，只要誠實表達你的感受與期待，就能知道彼此是否走在同一方向。','坦白、確認、面對真正問題','假裝不在意','用「我目前的感受是……」開啟一次對話。']],career:[['穩中有進',81,'累積的工作開始有被看見的機會。今天適合處理最重要但不一定最緊急的任務，先完成核心，再回頭修飾細節。','提案、整理成果、確認時程','一次接下太多新任務','把今天最重要的工作寫成一句明確的完成條件。'],['先守住資源',65,'目前資訊還不夠完整，衝動投入可能讓成本變高。財運不是不好，而是需要更清楚的預算與停損線。','比價、查資料、保留現金','情緒性消費與口頭承諾','延後一筆非必要支出二十四小時。'],['主動才會打開',87,'機會不會自己走到面前。你的條件已經比想像中完整，現在需要的是清楚提出需求，讓別人知道你準備好了。','爭取、寄出作品、主動聯絡','因害怕拒絕而保持沉默','今天主動完成一次詢問、申請或邀約。']],decision:[['答案偏向你真正想要的那一邊',74,'兩個選項都能前進，但其中一個讓你感到踏實，另一個只是暫時減輕焦慮。請優先選擇能長期維持的方向。','比較長期成本、確認底線','只看眼前最輕鬆的選項','想像半年後的自己，寫下他會感謝你做了哪個選擇。'],['不是現在',58,'問題目前缺少一項關鍵資訊。與其在不完整的條件下勉強二選一，不如先設定一個確認期限，讓新的事實加入判斷。','等待證據、詢問細節、設定期限','因別人催促而倉促答應','列出做決定前還必須確認的唯一一件事。'],['可以前進，但先小規模測試',79,'方向偏正面，但不需要一次押上全部。先用可以承受的成本試走一步，真實回饋會比想像更可靠。','試用、短期計畫、小額投入','把選擇想成不可逆','把下一步縮小成一個能在三天內完成的測試。']],mood:[['你需要被理解',null,'你並不是太敏感，只是有些感受被放得太久。現在不需要急著振作，先找一個安全的地方，把真正介意的事情說完整。','傾聽、書寫、找可信任的人','用忙碌壓下所有感受','用五分鐘寫下：「其實我最在意的是……」'],['你需要休息',null,'疲憊讓每一件事看起來都比原本更困難。今天最重要的不是多完成一件事，而是停止繼續透支。','提早睡、散步、降低訊息量','在精疲力竭時責怪自己','今晚比平常提早三十分鐘停止工作。'],['你需要重新掌握節奏',null,'真正讓你不安的可能不是事情太多，而是不知道該從哪裡開始。只要重新排出順序，失控感就會慢慢降低。','列清單、拒絕干擾、完成小事','同時處理所有問題','選出一件十分鐘內能完成的事情，現在就做。']]};
const root=document.querySelector('#root');let mode='daily',q='';function seed(n,x=0){let d=new Date();return(d.getFullYear()*13+(d.getMonth()+1)*31+d.getDate()*17+x)%n}function home(){root.innerHTML=`<div class="view"><div class="hero"><div class="eyebrow">DAILY ORACLE</div><h1>每日占卜</h1><p>不用急著相信命運。花一分鐘，聽聽此刻的自己。</p><button class="primary" onclick="prepare('daily')">開始今日占卜</button></div><div class="modes">${Object.entries(MODES).filter(([k])=>k!=='daily').map(([k,v])=>`<button class="mode" onclick="prepare('${k}')"><b>${v.n}</b><small>${v.k}</small></button>`).join('')}</div></div>`}function prepare(m){mode=m;root.innerHTML=`<div class="view session"><button class="back" onclick="home()">← 返回首頁</button><div class="eyebrow">${MODES[m].k}</div><h1>${MODES[m].n}</h1><p>${m==='decision'?'想著兩個選項，再選一顆最吸引你的石頭。':m==='mood'?'憑第一直覺，選一扇門。':'安靜想著你的問題，選一張牌。'}</p>${['love','career'].includes(m)?'<textarea id="q" class="question" placeholder="簡單寫下目前的狀況，也可以留白……"></textarea>':''}<button class="primary" onclick="ritual()">準備好了</button></div>`}function ritual(){q=document.querySelector('#q')?.value||'';let buttons=mode==='mood'?['晨霧','微光','深林'].map((x,i)=>`<button class="door" onclick="reveal(${i})">${x}</button>`).join(''):mode==='decision'?[0,1,2].map(i=>`<button class="stone" onclick="reveal(${i})" aria-label="石頭${i+1}"></button>`).join(''):[0,1,2,3,4].map(i=>`<button class="card" onclick="reveal(${i})" aria-label="牌${i+1}"></button>`).join('');root.innerHTML=`<div class="view session"><button class="back" onclick="prepare('${mode}')">← 重新選擇</button><div class="eyebrow">${MODES[mode].n}</div><h1>${mode==='mood'?'選一扇門。':mode==='decision'?'選一顆石頭。':'選一張牌。'}</h1><div class="choices">${buttons}</div><p class="muted">沒有選錯的可能。你選擇的瞬間，就是這次占卜的一部分。</p></div>`}function reveal(choice){let a=R[mode],r=a[seed(a.length,choice+q.length)],obj={date:new Date().toLocaleString('zh-TW',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}),mode:MODES[mode].n,r};let j=JSON.parse(localStorage.getItem('quiet-oracle-journal')||'[]');j.unshift(obj);localStorage.setItem('quiet-oracle-journal',JSON.stringify(j.slice(0,30)));root.innerHTML=`<div class="view session"><button class="back" onclick="home()">← 回到首頁</button><article class="result">${r[1]?`<span class="score">${r[1]}</span>`:''}<div class="eyebrow">${MODES[mode].n}結果</div><h1>${r[0]}</h1><p>${r[2]}</p><div class="grid"><div class="box"><small>今天適合</small><p>${r[3]}</p></div><div class="box"><small>最好避免</small><p>${r[4]}</p></div></div><div class="action"><small>今天可以完成的一件小事</small><p>${r[5]}</p></div><p class="muted">這是一個當下的提醒，不是預言，也不取代你的判斷。</p></article></div>`}function journal(){let j=JSON.parse(localStorage.getItem('quiet-oracle-journal')||'[]');root.innerHTML=`<div class="view session journal"><button class="back" onclick="home()">← 返回首頁</button><div class="eyebrow">只屬於你的記錄</div><h1>占卜手帳</h1>${j.length?j.map(x=>`<article><small>${x.date} · ${x.mode}</small><h3>${x.r[0]}</h3><p>${x.r[2]}</p></article>`).join(''):'<p>手帳還是空白的。</p>'}</div>`}document.querySelector('#journalBtn').onclick=journal;home();
</script></body></html>
