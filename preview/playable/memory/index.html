d{display:flex;align-items:center;justify-content:center;gap:8px;min-height:27px;margin-top:5px;color:#f7e5bd;font-size:12px;font-weight:800;text-shadow:0 2px 3px #111}.homeRecord i{color:#d6a85a;font-style:normal}.homeRecord b{color:#fff;font-size:13px}.menu{padding-bottom:8px!important}@media(max-height:700px){.homeRecord{min-height:20px;font-size:10px;margin-top:1px}.homeRecord b{font-size:11px}}</style><script id="start-safety-fix">(()=>{const launch=()=>{try{if(typeof start!=='function')throw new Error('遊戲啟動函式未載入');start(false)}catch(e){console.error(e);say('遊戲啟動失敗：'+e.message)}};const startButton=document.getElementById('start');if(startButton){startButton.onclick=null;startButton.addEventListener('click',launch)}const settingsButton=document.getElementById('settings');if(settingsButton)settingsButton.addEventListener('click',()=>window.settings?window.settings():settings());const ranksButton=document.getElementById('ranks');if(ranksButton)ranksButton.addEventListener('click',ranks)})();</script><script id="settings-first-flow">(()=>{function openJourneySetup(beginAfterApply){window.settings();const title=document.getElementById('modalTitle');if(title)title.textContent=beginAfterApply?'準備回憶旅程':'選擇回憶旅程';const apply=document.getElementById('apply');if(!apply)return;apply.textContent=beginAfterApply?'開始旅程':'套用設定';apply.onclick=()=>{const next={diff:document.getElementById('setDiff').value,mode:document.getElementById('setMode').value,deck:document.querySelector('input[name="deck"]:checked').value,back:document.querySelector('input[name="back"]:checked').value,sound:document.getElementById('setSound').checked};const changed=JSON.stringify(next)!==JSON.stringify(data.settings);data.settings=next;save();homeStats();closeModal();if(beginAfterApply){start(false)}else if(state.playing&&changed){start(true)}else{say('設定已套用')}}}const startButton=document.getElementById('start');if(startButton){startButton.replaceWith(startButton.cloneNode(true));document.getElementById('
