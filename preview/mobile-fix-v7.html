<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CxQ 手機修正版 V7</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f7f2ef;color:#312b30}.hub{max-width:980px;margin:auto;padding:18px 14px 40px}.hub h1{margin:0 0 4px;font-size:30px}.hub p{margin:0 0 18px;color:#766d72}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid #ded4cf;border-radius:18px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;box-shadow:0 8px 24px #38251c10}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.card b{display:block;padding:10px 11px 3px}.card span{display:block;padding:0 11px 12px;color:#7d7277;font-size:11px}.player{display:none;position:fixed;inset:0;background:#111;z-index:50}.player iframe{display:block;width:100%;height:100dvh;border:0;background:#111}.playing .hub{display:none}.playing .player{display:block}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main class="hub"><h1>CxQ 手機修正版 V7</h1><p>完整遊戲素材。這版完全移除後加的跨網站返回按鈕，並針對 iPhone Safari 重做記憶翻牌棋盤寬度限制。</p><div class="grid" id="grid"></div></main><div class="player"><iframe id="frame" title="遊戲"></iframe></div><script>
const games=[['fortune','每日占卜','../assets/game-covers/fortune.png'],['link','夢境織光・角色連連看','../assets/game-covers/link.png'],['brick-breaker','心光旅團：記憶核心','../assets/game-covers/brick.png'],['click-core','星願旅團：點亮夢境','../assets/game-covers/clickcore.png'],['2048','星願 2048','../assets/game-covers/twenty48.png'],['memory','暮光回憶收藏室','../assets/game-covers/memory.png'],['tetris','心境織境・方塊物語','../assets/game-covers/tetris.png']];
const grid=document.getElementById('grid'),frame=document.getElementById('frame');
grid.innerHTML=games.map(g=>`<a class="card" href="?game=${g[0]}" data-game="${g[0]}"><img src="${g[2]}"><b>${g[1]}</b><span>點擊測試手機版</span></a>`).join('');
function gamePath(id){return id==='fortune'?'../games/fortune/index.html':'../games/'+id+'/index.html'}
function openGame(id,push=true){document.body.classList.add('playing');frame.dataset.game=id;frame.src=gamePath(id);if(push)history.pushState({game:id},'',`?game=${id}`)}
function closeGame(){document.body.classList.remove('playing');frame.removeAttribute('src');delete frame.dataset.game}
grid.addEventListener('click',e=>{const a=e.target.closest('[data-game]');if(!a)return;e.preventDefault();openGame(a.dataset.game,true)});
addEventListener('popstate',()=>{const id=new URLSearchParams(location.search).get('game');if(id)openGame(id,false);else closeGame()});
frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow,id=frame.dataset.game;if(!d||!w)return;const s=d.createElement('style');s.textContent=`#cxq-site-back,.siteback,#cxq-preview-badge,[data-cxq-site-back]{display:none!important}`;d.head.appendChild(s);d.querySelectorAll('#cxq-site-back,.siteback,#cxq-preview-badge,[data-cxq-site-back]').forEach(x=>x.remove());if(id==='memory')fixMemory(d,w)}catch(e){console.error(e)}});
function fixMemory(d,w){const style=d.createElement('style');style.textContent=`html,body{width:100%!important;max-width:100%!important;height:100dvh!important;overflow:hidden!important}.app{width:100%!important;height:100dvh!important;min-width:0!important;padding:max(4px,env(safe-area-inset-top)) 5px max(4px,env(safe-area-inset-bottom))!important}.shell,.screen,.game,.top,.hud,.progress,.boardWrap{width:100%!important;max-width:100%!important;min-width:0!important}.shell{height:100%!important;max-height:none!important;margin:0 auto!important}.game{height:100%!important;min-height:0!important;overflow:hidden!important;gap:5px!important}.top{padding:4px 6px!important}.hud{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:4px!important}.hudBox{min-width:0!important;min-height:50px!important;padding:4px 2px!important}.progress{height:8px!important}.boardWrap{box-sizing:border-box!important;flex:1 1 0!important;min-height:0!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;padding:3px!important;contain:layout paint!important}.board{box-sizing:border-box!important;position:relative!important;left:auto!important;right:auto!important;transform:none!important;flex:0 0 auto!important;min-width:0!important;min-height:0!important;max-width:calc(100vw - 16px)!important;max-height:100%!important;margin-left:auto!important;margin-right:auto!important;grid-template-columns:repeat(var(--cols),minmax(0,1fr))!important;grid-template-rows:repeat(var(--cols),minmax(0,1fr))!important;overflow:hidden!important;contain:layout paint!important}.card,.inner,.face{min-width:0!important;min-height:0!important;max-width:100%!important;max-height:100%!important}.card{width:100%!important;height:100%!important}@supports(width:100svw){.board{max-width:calc(100svw - 16px)!important}}@media(max-height:700px){.top{padding:2px 5px!important}.round{width:34px!important;height:34px!important}.hudBox{min-height:43px!important}.hudBox span{font-size:9px!important}.hudBox b{font-size:18px!important}.progress{height:6px!important}.game{gap:3px!important}}`;d.head.appendChild(style);const board=d.getElementById('board'),wrap=d.querySelector('.boardWrap'),game=d.getElementById('game');if(!board||!wrap)return;let raf=0;const fit=()=>{w.cancelAnimationFrame(raf);raf=w.requestAnimationFrame(()=>{if(game&&!game.classList.contains('active'))return;const vv=w.visualViewport;const viewportW=Math.floor(vv?.width||d.documentElement.clientWidth||w.innerWidth);const wr=wrap.getBoundingClientRect();const widthLimit=Math.max(120,viewportW-16);const heightLimit=Math.max(120,Math.floor(wr.height-6));const size=Math.floor(Math.min(widthLimit,heightLimit));board.style.setProperty('--size',size+'px');board.style.setProperty('width',size+'px','important');board.style.setProperty('height',size+'px','important');board.style.setProperty('max-width',widthLimit+'px','important');board.style.setProperty('margin-left','auto','important');board.style.setProperty('margin-right','auto','important');board.style.setProperty('transform','none','important')})};if(w.visualViewport){w.visualViewport.addEventListener('resize',fit,{passive:true});w.visualViewport.addEventListener('scroll',fit,{passive:true})}w.addEventListener('resize',fit,{passive:true});w.addEventListener('orientationchange',()=>{setTimeout(fit,50);setTimeout(fit,250)},{passive:true});if(w.ResizeObserver)new w.ResizeObserver(fit).observe(wrap);if(w.MutationObserver&&game)new w.MutationObserver(fit).observe(game,{attributes:true,attributeFilter:['class']});setTimeout(fit,20);setTimeout(fit,150);setTimeout(fit,400)}
const initial=new URLSearchParams(location.search).get('game');if(initial)openGame(initial,false);
</script></body></html>
