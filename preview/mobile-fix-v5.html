<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CxQ 手機修正版 V5</title><style>

</style></head><body><div class="home"><div class="bar">CxQ TEST PREVIEW｜V5 手機版面修正｜不影響 main</div><main class="wrap"><section class="head"><h1>手機修正版預覽</h1><p>這版專門看三件事：返回 CxQ 不再擋畫面、短螢幕主要操作區壓回一個手機 viewport、記憶翻牌重新依照實際可視高度置中。</p></section><section class="grid" id="cards"></section><div class="note">這個虛擬站套用的是與完整遊戲檔相同的版面修正；測試分支的大型圖片仍是輕量測試素材，所以請主要看「位置、尺寸、操作區、返回按鈕」的效果。</div></main></div><iframe id="player" allow="fullscreen"></iframe><button class="switch" id="switch">← 換遊戲</button><script>
const games={

 brick:['心光旅團：記憶核心','covers-v3/brick.svg','playable/brick-breaker/index.html'],

};
const cards=document.getElementById('cards');Object.entries(games).forEach(([k,g])=>cards.insertAdjacentHTML('beforeend',`<a class="card" href="?game=${encodeURIComponent(k)}"><img src="${g[1]}"><div><b>${g[0]}</b><span>開啟手機修正版 →</span></div></a>`));
const qs=new URLSearchParams(location.search),key=qs.get('game'),frame=document.getElementById('player');if(key&&games[key]){document.body.classList.add('playing');frame.src=games[key][2]+'?mobilefix=v5';document.title=games[key][0]+'｜手機修正版';}
document.getElementById('switch').onclick=()=>location.href=location.pathname;
const styles={
 '2048':`#cxq-preview-badge{opacity:.38;pointer-events:none}#cxq-site-back{position:static!important;z-index:auto!important;display:grid!important;place-items:center!important;padding:0 7px!important;border:0!important;border-radius:18px!important;background:#ffffffd7!important;color:#68607f!important;text-decoration:none!important;font:900 12px/1 system-ui!important;box-shadow:var(--shadow)!important;min-height:52px!important;backdrop-filter:none!important}.actions{grid-template-columns:1.35fr 1fr 1fr .8fr!important}@media(max-height:720px){body{padding-top:6px!important;padding-bottom:6px!important}.hero{height:104px!important}.mascot{width:112px!important;height:112px!important}.hero h1{font-size:22px!important}.hero p{font-size:10px!important}.stat,.iconbtn{min-height:52px!important}.board-shell{padding:7px!important}.btn,#cxq-site-back{min-height:43px!important}.tip{margin-top:4px!important;font-size:9px!important}}@media(max-height:620px){.hero{height:88px!important}.hero p,.badge,.tip{display:none!important}.mascot{width:94px!important;height:94px!important}.stats{margin:5px 0!important}.stat,.iconbtn{min-height:44px!important}.btn,#cxq-site-back{min-height:38px!important}}`,

 tetris:`#cxq-preview-badge{opacity:.3;pointer-events:none}#cxq-site-back{display:none!important}.cxq-menu-exit{display:flex!important;align-items:center!important;justify-content:center!important;text-decoration:none!important;color:#fff!important}@media(max-width:720px){.app{height:100dvh!important;min-height:100dvh!important}.controls{height:132px!important;padding-top:9px!important}.stage{inset:82px 0 137px!important}.mobile-character-bar{top:41px!important;height:36px!important}.ctl{height:43px!important}.dpad{grid-template-rows:repeat(2,43px)!important}.actionKeys .ctl{height:55px!important}.systemKeys .ctl{height:38px!important}}@media(max-width:720px) and (max-height:700px){.mobile-character-bar{top:37px!important;height:32px!important}.stage{inset:72px 0 115px!important}.controls{height:110px!important;padding:5px!important}.dpad{grid-template-columns:repeat(3,43px)!important;grid-template-rows:repeat(2,36px)!important}.ctl{width:43px!important;height:36px!important}.actionKeys{grid-template-columns:repeat(2,56px)!important}.actionKeys .ctl{width:56px!important;height:48px!important}.systemKeys .ctl{width:54px!important;height:32px!important}.controls{grid-template-columns:1fr 56px 1fr!important}}`,
 link:`#cxq-preview-badge{opacity:.35;pointer-events:none}#cxq-site-back{position:static!important;width:44px!important;height:44px!important;padding:0!important;display:grid!important;place-items:center!important;border:0!important;border-radius:50%!important;background:#fff6dfed!important;color:#654f42!important;text-decoration:none!important;font:950 9px/1 system-ui!important;box-shadow:0 4px 8px #392f3260!important;backdrop-filter:none!important}.app{height:100dvh!important;min-height:0!important}.brand{min-height:56px!important}@media(max-height:700px){.app{padding:4px 6px!important;gap:4px!important}.brand{min-height:46px!important}.logo h1{font-size:19px!important}.logo p{font-size:9px!important}.round-btn,#cxq-site-back{width:38px!important;height:38px!important}.stat{padding:2px!important}.stat b{font-size:14px!important}.art-btn{height:43px!important;font-size:10px!important}}`,
 brick:`#cxq-preview-badge{opacity:.3;pointer-events:none}#cxq-site-back{display:none!important}.cxq-menu-exit{display:flex!important;align-items:center!important;justify-content:center!important;text-decoration:none!important;color:#56455f!important}@media(max-height:700px){.home-screen{padding:5dvh 18px 4dvh!important}.home-logo h1{font-size:clamp(36px,10vw,52px)!important}.home-actions .secondary-btn{min-height:44px!important}.character-stage{height:160px!important}.hero-art{height:180px!important}.menu-card{max-height:96dvh!important;overflow:auto!important}.journey-panel{top:65px!important}}@media(max-height:610px){.home-screen{padding-top:3dvh!important}.home-actions .secondary-btn,.home-actions .big-btn{min-height:40px!important}.hud-card{height:48px!important;min-height:48px!important}.journey-panel{top:57px!important;transform:translateX(-50%) scale(.88)!important}}`,
 click:`#cxq-preview-badge{opacity:.32;pointer-events:none}#cxq-site-back{display:none!important}.cxq-header-exit{display:inline-block;margin-left:6px;padding:3px 7px;border:1px solid #ead7ac88;border-radius:999px;background:#24191399;color:#fff3d5;text-decoration:none;font-size:9px;font-weight:900;text-shadow:none}@media(max-width:560px){html,body{height:100dvh!important;overflow:hidden!important}.game{height:100dvh!important;min-height:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;padding-bottom:56px!important;background-attachment:scroll!important}header{flex:0 0 auto;padding:7px 9px 2px!important}header h1{font-size:20px!important;margin:0!important}.counter{width:122px!important;min-height:63px!important;padding:9px 8px!important}.notice{flex:0 0 auto;margin:1px 8px 0!important;padding:6px 8px!important;font-size:10px!important}.stage{flex:0 0 320px!important;height:auto!important;min-height:0!important}.quick,.panel{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;overscroll-behavior:contain;margin:0 5px!important;padding:36px 8px 66px!important}.quick{margin-top:-22px!important}.panel{margin-top:5px!important}nav button{height:56px!important;font-size:11px!important}}@media(max-width:560px) and (max-height:720px){.stage{flex-basis:265px!important}#tapHero{top:-4px!important;height:270px!important;width:76%!important}.quick{margin-top:-16px!important;padding-top:30px!important}}@media(max-width:560px) and (max-height:620px){.stage{flex-basis:220px!important}#tapHero{height:228px!important}.side-npc{display:none!important}.quick{margin-top:-12px!important;padding-top:25px!important}}`,
 fortune:`.badge{opacity:.38!important;pointer-events:none}.siteback{position:static!important;background:#fffaf3!important;color:#5e5355!important;border:1px solid #d7ccc1!important;padding:0!important;width:34px!important;height:34px!important;display:grid!important;place-items:center!important;border-radius:50%!important;font-size:0!important;box-shadow:none!important}.siteback:after{content:'CxQ';font-size:9px;font-weight:900}.top{height:58px!important;padding:0 10px!important}.top .siteback{order:-1}.view{padding:18px 12px 28px!important}.hero{padding:18px 10px 14px!important}.hero h1{font-size:clamp(40px,12vw,58px)!important;margin:7px 0!important}.hero p{line-height:1.55!important;margin:8px 0 12px!important}.modes{gap:7px!important;margin-top:12px!important}.mode{padding:11px!important}.mode b{font-size:15px!important}.mode small{font-size:10px!important}@media(max-width:560px){.modes{grid-template-columns:1fr 1fr!important}.view{min-height:calc(100dvh - 58px)!important}.hero{padding-top:12px!important}.session h1{font-size:36px!important}.choices{margin:22px auto!important}}@media(max-height:650px){.hero p{display:none!important}.hero h1{font-size:38px!important}.view{padding-top:10px!important}.mode{padding:8px!important}.mode small{display:none!important}}`
};
function makeExit(doc,cls=''){const a=doc.createElement('a');a.href=location.pathname;a.target='_top';a.className=cls;a.textContent='返回 CxQ';return a}
function applyFix(){if(!key||!games[key])return;let doc;try{doc=frame.contentDocument}catch(e){return}if(!doc)return;const st=doc.createElement('style');st.id='cxq-v5-injected';st.textContent=styles[key]||'';doc.head.appendChild(st);const old=doc.querySelector('#cxq-site-back,.siteback');
 if(key==='2048'&&old){old.textContent='CxQ';old.href=location.pathname;old.target='_top';doc.querySelector('.actions')?.appendChild(old)}
 if(key==='memory'){if(old){old.textContent='CxQ';old.href=location.pathname;old.target='_top';doc.querySelector('#game .actions')?.appendChild(old)}const menu=doc.querySelector('#home .menu');if(menu&&!doc.querySelector('#cxq-home-exit')){const a=makeExit(doc);a.id='cxq-home-exit';a.textContent='← 回到 CxQ 小遊戲';a.style.cssText='display:block;margin:6px auto 0;width:max-content;color:#f3ddb5;text-decoration:none;font-size:11px;font-weight:900';menu.appendChild(a)}const fit=()=>{const w=doc.querySelector('.boardWrap'),b=doc.querySelector('#board'),g=doc.querySelector('#game');if(!w||!b||!g?.classList.contains('active'))return;requestAnimationFrame(()=>{const r=w.getBoundingClientRect();b.style.setProperty('--size',Math.max(120,Math.floor(Math.min(r.width-6,r.height-6)))+'px')})};frame.contentWindow.visualViewport?.addEventListener('resize',fit,{passive:true});frame.contentWindow.addEventListener('resize',fit,{passive:true});if('ResizeObserver'in frame.contentWindow)new frame.contentWindow.ResizeObserver(fit).observe(doc.querySelector('.boardWrap'));new MutationObserver(fit).observe(doc.querySelector('#game'),{attributes:true});setTimeout(fit,80)}
 if(key==='tetris'){old?.remove();const h=doc.querySelector('#homeScreen .home-menu'),p=doc.querySelector('#pause .actions');if(h)h.appendChild(makeExit(doc,'art-btn cxq-menu-exit'));if(p)p.appendChild(makeExit(doc,'art-btn cxq-menu-exit'))}
 if(key==='link'&&old){old.textContent='CxQ';old.href=location.pathname;old.target='_top';doc.querySelector('.header-actions')?.prepend(old)}
 if(key==='brick'){old?.remove();const h=doc.querySelector('#homeOverlay .home-actions'),p=doc.querySelector('#pauseOverlay .menu-grid');if(h)h.appendChild(makeExit(doc,'secondary-btn cxq-menu-exit'));if(p)p.appendChild(makeExit(doc,'secondary-btn cxq-menu-exit'))}
 if(key==='click'){old?.remove();const add=()=>{const sm=doc.querySelector('header small');if(sm&&!sm.querySelector('.cxq-header-exit'))sm.appendChild(makeExit(doc,'cxq-header-exit'))};add();new MutationObserver(add).observe(doc.querySelector('#app'),{childList:true,subtree:true})}
 if(key==='fortune'){if(old){old.href=location.pathname;old.target='_top';doc.querySelector('.top')?.prepend(old)}}
}
frame.addEventListener('load',applyFix);
</script></body></html>
