<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CxQ 小遊戲｜新封面實裝預覽</title><style>:root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#2d2a32;background:#fffaf6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8f1,#fff 36%);min-height:100vh}.bar{position:sticky;top:0;z-index:10;background:#2e292f;color:#fff;padding:10px 16px;text-align:center;font-weight:800;letter-spacing:.06em}.wrap{max-width:1180px;margin:auto;padding:24px 18px 56px}.head{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:22px}.back{border:1px solid #d8cfc9;background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}.eyebrow{font-size:12px;letter-spacing:.18em;color:#9d6f6b;font-weight:900}.head h1{font-size:clamp(28px,5vw,50px);margin:5px 0 6px}.head p{margin:0;color:#746c70;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #eadfd8;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #5b3b2b10;min-width:0}.cover{aspect-ratio:1/1;background:#f3ece7;display:block;width:100%;object-fit:cover}.copy{padding:14px 15px 16px}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-style:normal;font-weight:900;margin-bottom:8px;line-height:1.35}.live .badge{background:#e8f7ed;color:#1e7a42}.pending .badge{background:#fff1cf;color:#8a6417}.locked{opacity:.66}.locked .badge{background:#eee;color:#6f6a6d}.copy strong{display:block;font-size:18px;margin-bottom:4px}.copy span{font-size:13px;color:#7a7275}.note{margin-top:26px;padding:16px 18px;border-radius:18px;background:#fff0d9;border:1px solid #f2d7ac;color:#6b4d2d;line-height:1.7}.card.live{cursor:pointer;transition:.18s}.card.live:hover{transform:translateY(-3px);box-shadow:0 16px 36px #5b3b2b1a}.testtag{display:inline-flex;margin-top:10px;border:1px solid #e7d5c8;background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#815f58}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{display:block}.back{margin-bottom:18px}}@media(max-width:430px){.wrap{padding:18px 12px 42px}.grid{gap:12px}.card{border-radius:18px}.copy{padding:11px}.copy strong{font-size:16px}.badge{font-size:10px}}</style></head><body><div class="bar">⚠ CxQ TEST PREVIEW｜V3 新封面已實際放入測試分支</div><main class="wrap"><section class="head"><button class="back" onclick="history.length>1?history.back():location.href='../index.html'">← 返回首頁</button><div><div class="eyebrow">GAME CENTER</div><h1>CxQ 小遊戲</h1><p>這一版直接使用測試分支內的新封面檔，不是畫出來的示意圖。<br>綠色標籤沿用你要求的「遊戲正式名稱」顯示方式。</p><span class="testtag">正式 main 未修改</span></div></section><section class="grid" id="grid"></section><div class="note"><b>目前狀態：</b> 7 張新封面都已實裝到這個測試頁。每日占卜的封面也已放上；但占卜本體目前仍是 Vinext / Cloudflare 專案，還沒轉成 GitHub Pages 可直接執行的靜態版，所以先用黃色狀態區隔。其餘尚未製作的遊戲維持暫未開放。</div></main><script>const games=[['fortune','每日占卜','./covers-v3/fortune.svg','pending','每日占卜'],['link','連連看','./covers-v3/link.svg','live','夢境織光・角色連連看'],['brick','打磚塊','./covers-v3/brick.svg','live','心光旅團：記憶核心'],['click','點擊核心','./covers-v3/clickcore.svg','live','星願旅團：點亮夢境'],['2048','2048','./covers-v3/twenty48.svg','live','星願 2048'],['memory','記憶翻牌','./covers-v3/memory.svg','live','暮光回憶收藏室'],['tetris','俄羅斯方塊','./covers-v3/tetris.svg','live','心境織境・方塊物語'],['whack','打地鼠','', 'locked',''],['merge','球球融合','', 'locked',''],['flappy','Flappy Bird','', 'locked',''],['dino','斷網恐龍','', 'locked',''],['poker','撲克遊戲','', 'locked',''],['mines','踩地雷','', 'locked','']];const fallback='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><rect width="100%" height="100%" fill="#f2e9e3"/><circle cx="250" cy="220" r="75" fill="none" stroke="#bdb4af" stroke-width="8" stroke-dasharray="15 12"/><text x="250" y="235" text-anchor="middle" font-size="70" fill="#9d9590">🔒</text><text x="250" y="350" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#877e79">敬請期待</text></svg>`);document.querySelector('#grid').innerHTML=games.map(g=>{const state=g[3],badge=state==='live'?g[4]:state==='pending'?'每日占卜｜封面已套用':'暫未開放',sub=state==='live'?'點擊卡片（本頁僅測試整合效果）':state==='pending'?'遊戲本體待轉靜態版':'敬請期待';return `<article class="card ${state}" ${state==='live'?`onclick="alert('${g[4]}：目前這個 V3 先確認新封面實裝效果；正式遊戲檔整合會繼續留在測試分支。')"`:''}><img class="cover" src="${g[2]||fallback}" onerror="this.src='${fallback}'"><div class="copy"><i class="badge">${badge}</i><strong>${g[1]}</strong><span>${sub}</span></div></article>`}).join('');</script></body></html>
