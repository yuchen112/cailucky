<style>

</style></head><body><main class="app">

<script>
(()=>{'use strict';const A=window.CXQ_ASSETS,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const modes=[['timed','限時挑戰','60秒高分',A.normal],['survival','生存模式','3顆生命',A.heart],['combo','連擊模式','Combo加成',A.gold],['bomb','炸彈危機','炸彈變多',A.bomb],['golden','黃金獵人','金鼠變多',A.gold],['reaction','反應訓練','出現更短',A.hammer]],diffs={easy:['簡單',1100,900,.08,.10,'E6FC085C-5591-4EE2-B6FE-CB9B480E2035.png'],normal:['普通',850,680,.13,.13,'DCF9AE86-7791-4C18-A4C1-93CEC5090377.png'],hard:['困難',650,500,.18,.16,'49C195FC-F41C-4D8C-8799-D30A99716F65.png'],hell:['地獄',500,380,.24,.19,'72B5A483-313E-4B4A-A91D-9B37E1D80261.png']};let st={mode:'timed',diff:'normal',score:0,combo:0,max:0,hits:0,bombs:0,lives:3,time:60,running:false,paused:false,active:new Map(),spawn:null,clock:null};function show(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='rank')renderRank()}$$('[data-screen]').forEach(b=>b.onclick=()=>show(b.dataset.screen));$$('[data-asset]').forEach(i=>i.src=A[i.dataset.asset]);const mg=$('#modegrid');modes.forEach(m=>{let b=document.createElement('button');b.className='mode';b.innerHTML=`<img src="${m[3]}"><b>${m[1]}</b><small>${m[2]}</small>`;b.onclick=()=>{st.mode=m[0];show('difficulty')};mg.append(b)});const dg=$('#diffgrid');Object.entries(diffs).forEach(([id,d])=>{let b=document.createElement('button');b.className='diff';b.innerHTML=`<img src="/cailucky/games/tetris/assets/characters/${d[5]}"><div>${d[0]}</div>`;b.onclick=()=>{st.diff=id;start()};dg.append(b)});const board=$('#board');for(let i=0;i<9;i++){let b=document.createElement('button');b.className='hole';b.dataset.i=i;b.innerHTML=`<img src="${A.hole}">`;b.onpointerdown=()=>hit(i);board.append(b)}function cfg(){let d=diffs[st.diff],c={speed:d[1],visible:d[2],bomb:d[3],gold:d[4],multi:(st.diff==='hard'||st.diff==='hell')?2:1};if(st.mode==='reaction'){c.speed*=.72;c.visible*=.63}if(st.mode==='bomb')c.bomb+=.22;if(st.mode==='golden')c.gold+=.22;return c}function clear(){clearInterval(st.spawn);clearInterval(st.clock);st.active.forEach(v=>clearTimeout(v.t));st.active.clear();$$('.hole img').forEach(i=>i.src=A.hole)}function start(){clear();Object.assign(st,{score:0,combo:0,max:0,hits:0,bombs:0,lives:3,time:st.mode==='reaction'?45:60,running:true,paused:false});hud();show('game');let c=cfg();st.spawn=setInterval(spawn,c.speed);st.clock=setInterval(()=>{if(!st.running||st.paused)return;if(--st.time<=0)end();hud()},1000);setTimeout(spawn,250)}function pick(c){let r=Math.random();if(r<c.bomb)return'bomb';if(r<c.bomb+c.gold)return'gold';if(st.mode==='survival'&&r<c.bomb+c.gold+.1)return'heart';return'normal'}function spawn(){if(!st.running||st.paused)return;let c=cfg(),free=[0,1,2,3,4,5,6,7,8].filter(i=>!st.active.has(i)),n=Math.min(free.length,c.multi+(Math.random()<.2?1:0));while(n--&&free.length){let p=Math.random()*free.length|0,i=free.splice(p,1)[0],type=pick(c),img=$(`.hole[data-i="${i}"] img`);img.src=A[type];let t=setTimeout(()=>miss(i),c.visible*(type==='gold'?.72:1));st.active.set(i,{type,t})}}function miss(i){let e=st.active.get(i);if(!e)return;st.active.delete(i);$(`.hole[data-i="${i}"] img`).src=A.hole;if(e.type!=='bomb'&&e.type!=='heart'){st.combo=0;if(st.mode==='survival'&&--st.lives<=0)return end()}hud()}function hit(i){if(!st.running||st.paused)return;let e=st.active.get(i);if(!e)return;clearTimeout(e.t);st.active.delete(i);$(`.hole[data-i="${i}"] img`).src=A.hole;if(e.type==='bomb'){st.bombs++;st.combo=0;st.score=Math.max(0,st.score-40);if(st.mode==='survival'&&--st.lives<=0)return end()}else{st.hits++;st.combo++;st.max=Math.max(st.max,st.combo);let base=e.type==='gold'?50:e.type==='heart'?20:10;if(e.type==='heart'&&st.mode==='survival')st.lives=Math.min(5,st.lives+1);st.score+=Math.round(base*(1+Math.min(2,st.combo*(st.mode==='combo'?.06:.025))))}hud()}function hud(){$('#time').textContent=st.time;$('#score').textContent=st.score;$('#combo').textContent=st.combo;$('#lives').textContent=st.mode==='survival'?st.lives:'—'}function end(){if(!st.running)return;st.running=false;clear();save();$('#finalScore').textContent=st.score;let n=modes.find(x=>x[0]===st.mode)[1];$('#resultInfo').innerHTML=`${n}｜${diffs[st.diff][0]}<br>命中 ${st.hits}｜最高 Combo ${st.max}｜炸彈 ${st.bombs}`;show('result')}$('#pauseBtn').onclick=()=>{if(st.running){st.paused=true;show('pauseScreen')}};$('#resume').onclick=()=>{st.paused=false;show('game')};$('#quit').onclick=end;$('#again').onclick=start;function save(){let a=[];try{a=JSON.parse(localStorage.cxqWhackV4||'[]')}catch{}a.push({s:st.score,m:st.mode,d:st.diff});a.sort((x,y)=>y.s-x.s);localStorage.cxqWhackV4=JSON.stringify(a.slice(0,20))}function renderRank(){let a=[];try{a=JSON.parse(localStorage.cxqWhackV4||'[]')}catch{}let l=$('#rankList');l.innerHTML='';if(!a.length){l.innerHTML='<li>還沒有紀錄</li>';return}a.slice(0,10).forEach(x=>{let li=document.createElement('li');li.textContent=`${x.s} 分｜${modes.find(m=>m[0]===x.m)[1]}｜${diffs[x.d][0]}`;l.append(li)})}})();
</script></body></html>
