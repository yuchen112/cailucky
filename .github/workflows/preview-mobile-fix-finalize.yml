name: Preview mobile fix finalize
on:
  push:
    branches:
      - preview/mobile-layout-fix-20260815
    paths:
      - .github/workflows/preview-mobile-fix-finalize.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/mobile-layout-fix-20260815
          fetch-depth: 0
      - name: Finalize mobile layout
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # Click-core: keep whole page at 100dvh and scroll only the active content panel.
          p=Path('games/click-core/src/game.css')
          s=p.read_text(encoding='utf-8-sig')
          if 'CxQ mobile viewport fix v2' not in s:
              s+='''\n\n/* CxQ mobile viewport fix v2 */\n@media(max-width:560px){html,body{height:100dvh;overflow:hidden}.game{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:56px;background-attachment:scroll}header{flex:0 0 auto;padding:7px 9px 2px}header h1{font-size:20px;margin:0}.counter{width:122px;min-height:63px;padding:9px 8px}.counter b{font-size:18px}.notice{flex:0 0 auto;margin:1px 8px 0;padding:6px 8px;font-size:10px}.stage{flex:0 0 320px;height:auto;min-height:0}.quick,.panel{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 5px;padding:36px 8px 66px}.quick{margin-top:-22px}.panel{margin-top:5px}.panel .title{position:sticky;top:-36px;z-index:4;padding-top:30px;background:linear-gradient(#fff0d4f2 70%,transparent)}nav button{height:56px;font-size:11px}}\n@media(max-width:560px) and (max-height:720px){.stage{flex-basis:265px}.side-npc{top:52px;height:78px}#tapHero{top:-4px;height:270px;width:76%}#tapHero>span{height:48px;padding-top:14px;font-size:15px}.quick{margin-top:-16px;padding-top:30px}.counter{min-height:57px}.notice{padding:4px 7px}}\n@media(max-width:560px) and (max-height:620px){.stage{flex-basis:220px}#tapHero{height:228px}.side-npc{display:none}.quick{margin-top:-12px;padding-top:25px}header small,header span{font-size:8px}.counter span{display:none}}\n'''
              p.write_text(s,encoding='utf-8')

          # Fortune: compact the mobile home hero and mode cards without adding any site-return control.
          p=Path('games/fortune/style.css')
          s=p.read_text(encoding='utf-8-sig')
          if 'CxQ mobile viewport fix v2' not in s:
              s+='''\n\n/* CxQ mobile viewport fix v2 */\n@media(max-width:800px){.quiet-header{height:58px!important;padding:0 10px!important}.wordmark b{font-size:15px}.journal-link{font-size:11px}.home-view{min-height:calc(100dvh - 58px)!important}.hero-reading{height:calc(100dvh - 58px)!important;min-height:560px!important;padding:30px 16px 10px!important;display:grid!important;grid-template-rows:auto auto 1fr!important;background:linear-gradient(#f7eee3 0 48%,#d9d1cf 48%)!important}.date-line{top:10px!important;left:16px!important}.hero-copy h1{font-size:clamp(39px,12vw,50px)!important}.hero-copy>p:not(.overline){margin:8px auto 12px!important;line-height:1.55!important}.primary-action{min-height:46px!important}.hero-character{min-height:0!important;height:100%!important;margin:0!important}.hero-character>img{height:100%!important;max-height:330px!important}.hero-character .soft-sun{width:min(250px,70vw)!important}.character-note{bottom:3px!important;padding:8px!important}.mode-section{padding:35px 10px!important}.section-title h2{font-size:30px!important}.mode-list{gap:8px!important}.mode-list button{min-height:165px!important}.mode-list img{height:102px!important}.mode-text b{font-size:15px!important}.mode-text small{font-size:9px!important}.home-footer{padding:14px!important}}\n@media(max-width:800px) and (max-height:680px){.hero-reading{min-height:510px!important;padding-top:22px!important}.hero-copy h1{font-size:38px!important}.hero-copy>p:not(.overline){display:none!important}.hero-character>img{max-height:275px!important}.character-note{display:none!important}.mode-list button{min-height:145px!important}.mode-list img{height:86px!important}}\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final preview fixes
        shell: bash
        run: |
          rm -f preview/mobile-fix-full-v6.html
          rm -f .github/workflows/preview-mobile-fix-finalize.yml
          git config user.name "CxQ Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add games preview .github/workflows/preview-mobile-fix-finalize.yml
          git commit -m "Finalize mobile viewport fixes"
          git push origin HEAD:preview/mobile-layout-fix-20260815
