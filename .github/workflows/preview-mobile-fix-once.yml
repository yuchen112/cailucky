name: Preview mobile fix once
on:
  push:
    branches:
      - preview/mobile-layout-fix-20260815
    paths:
      - .github/workflows/preview-mobile-fix-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/mobile-layout-fix-20260815
          fetch-depth: 0
      - name: Apply mobile fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          root=Path('games')
          def read(p): return p.read_text(encoding='utf-8-sig')
          def write(p,s): p.write_text(s,encoding='utf-8')
          def strip_siteback_html(s):
              s=re.sub(r'\s*<style id="cxq-site-back-style">.*?</style>\s*','\n',s,flags=re.S)
              s=re.sub(r'\s*<a id="cxq-site-back"[^>]*>.*?</a>\s*','\n',s,flags=re.S)
              return s

          # 2048: keep compact-height fixes, remove cross-site return completely.
          p=root/'2048/index.html'; s=strip_siteback_html(read(p))
          s=re.sub(r'<script id="cxq-mobile-fix-script-v1">.*?</script>\s*','',s,flags=re.S)
          mobile='''<style id="cxq-mobile-fix-v2">\n.actions{grid-template-columns:1.35fr 1fr 1fr!important}\n@media(max-height:720px){body{padding-top:max(6px,env(safe-area-inset-top))!important;padding-bottom:max(6px,env(safe-area-inset-bottom))!important}.hero{height:104px!important;padding-top:18px!important;padding-bottom:16px!important}.mascot{width:112px!important;height:112px!important}.hero h1{font-size:22px!important}.hero p{font-size:10px!important}.badge{padding:4px 7px!important;font-size:9px!important}.stat,.iconbtn{min-height:52px!important}.stat b{font-size:20px!important}.board-shell{padding:7px!important}.actions{margin-top:6px!important}.btn{min-height:43px!important}.tip{margin-top:5px!important;font-size:9px!important}}\n@media(max-height:620px){.hero{height:88px!important}.mascot{width:94px!important;height:94px!important}.hero p,.badge{display:none!important}.stats{margin:5px 0!important}.stat,.iconbtn{min-height:44px!important}.stat{padding:5px 9px!important}.stat b{font-size:18px!important}.board-shell{padding:5px!important}.btn{min-height:38px!important;font-size:11px!important}.tip{display:none!important}}\n</style>'''
          if 'id="cxq-mobile-fix-v1"' in s: s=re.sub(r'<style id="cxq-mobile-fix-v1">.*?</style>',mobile,s,flags=re.S)
          elif 'id="cxq-mobile-fix-v2"' not in s: s=s.replace('</head>',mobile+'\n</head>')
          write(p,s)

          # Link: full-height mobile layout, no CxQ return control.
          p=root/'link/index.html'; s=strip_siteback_html(read(p))
          s=re.sub(r'<script id="cxq-mobile-fix-script-v1">.*?</script>\s*','',s,flags=re.S)
          mobile='''<style id="cxq-mobile-fix-v2">\n.app{height:100dvh!important;min-height:0!important}.brand{min-height:58px!important}.round-btn{width:47px!important;height:47px!important}.game{min-height:0!important}.toolbar{padding-bottom:max(0px,env(safe-area-inset-bottom))}\n@media(max-height:700px){.app{padding:4px 6px!important;gap:4px!important}.brand{min-height:48px!important}.logo h1{font-size:19px!important}.logo p{font-size:9px!important}.round-btn{width:40px!important;height:40px!important}.stat{padding:2px!important;border-width:2px!important}.stat b{font-size:14px!important}.stat span{font-size:8px!important}.art-btn{height:44px!important;font-size:10px!important}.game{border-width:3px!important}}\n</style>'''
          if 'id="cxq-mobile-fix-v1"' in s: s=re.sub(r'<style id="cxq-mobile-fix-v1">.*?</style>',mobile,s,flags=re.S)
          elif 'id="cxq-mobile-fix-v2"' not in s: s=s.replace('</head>',mobile+'\n</head>')
          write(p,s)

          # Brick breaker: compact short screens, no added return.
          p=root/'brick-breaker/index.html'; s=strip_siteback_html(read(p))
          s=re.sub(r'<script id="cxq-mobile-fix-script-v1">.*?</script>\s*','',s,flags=re.S)
          mobile='''<style id="cxq-mobile-fix-v2">\n@media(max-height:700px){.home-screen{padding:5dvh 18px 4dvh!important}.home-logo h1{font-size:clamp(36px,10vw,52px)!important}.home-actions .secondary-btn{min-height:44px!important}.character-stage{height:160px!important}.hero-art{height:180px!important}.char-card{width:66px!important;height:74px!important}.character-rail{grid-auto-columns:66px!important}.menu-card{max-height:96dvh!important;overflow:auto!important}.journey-panel{top:65px!important}}\n@media(max-height:610px){.home-logo p{font-size:11px!important}.home-screen{padding-top:3dvh!important}.home-actions{gap:2px!important}.home-actions .secondary-btn,.home-actions .big-btn{min-height:40px!important}.hud-card{height:48px!important;min-height:48px!important}.journey-panel{top:57px!important;transform:translateX(-50%) scale(.88)!important}}\n</style>'''
          if 'id="cxq-mobile-fix-v1"' in s: s=re.sub(r'<style id="cxq-mobile-fix-v1">.*?</style>',mobile,s,flags=re.S)
          elif 'id="cxq-mobile-fix-v2"' not in s: s=s.replace('</head>',mobile+'\n</head>')
          write(p,s)

          # Tetris: compact controls and keep viewport resize helper only.
          p=root/'tetris/index.html'; s=strip_siteback_html(read(p))
          s=re.sub(r'<script id="cxq-mobile-fix-script-v1">.*?</script>',"<script id=\"cxq-mobile-fix-script-v2\">(()=>{const resizeSoon=()=>setTimeout(()=>window.dispatchEvent(new Event('resize')),80);visualViewport?.addEventListener('resize',resizeSoon,{passive:true});addEventListener('orientationchange',resizeSoon,{passive:true})})();</script>",s,flags=re.S)
          mobile='''<style id="cxq-mobile-fix-v2">\n@media(max-width:720px){.app{height:100dvh!important;min-height:100dvh!important}.controls{height:132px!important;padding-top:9px!important;padding-bottom:max(6px,env(safe-area-inset-bottom))!important}.stage{inset:82px 0 137px!important}.mobile-character-bar{top:41px!important;height:36px!important}.mobile-character-bar img{width:38px!important;height:38px!important}.ctl{height:43px!important}.dpad{grid-template-rows:repeat(2,43px)!important}.actionKeys .ctl{height:55px!important}.systemKeys .ctl{height:38px!important}}\n@media(max-width:720px) and (max-height:700px){.hud-card{padding:2px!important}.hud-card small{font-size:6px!important}.hud-card strong{font-size:11px!important}.mobile-character-bar{top:37px!important;height:32px!important}.mobile-character-bar img{width:34px!important;height:34px!important}.stage{inset:72px 0 115px!important}.controls{height:110px!important;padding:5px 7px max(4px,env(safe-area-inset-bottom))!important}.dpad{grid-template-columns:repeat(3,43px)!important;grid-template-rows:repeat(2,36px)!important}.ctl{width:43px!important;height:36px!important;font-size:15px!important}.actionKeys{grid-template-columns:repeat(2,56px)!important}.actionKeys .ctl{width:56px!important;height:48px!important}.systemKeys .ctl{width:54px!important;height:32px!important;font-size:9px!important}.controls{grid-template-columns:1fr 56px 1fr!important}.control-label{font-size:7px!important}}\n</style>'''
          if 'id="cxq-mobile-fix-v1"' in s: s=re.sub(r'<style id="cxq-mobile-fix-v1">.*?</style>',mobile,s,flags=re.S)
          elif 'id="cxq-mobile-fix-v2"' not in s: s=s.replace('</head>',mobile+'\n</head>')
          write(p,s)

          # Click core: remove added cross-site return, keep app-like mobile viewport.
          p=root/'click-core/index.html'; s=strip_siteback_html(read(p)); s=re.sub(r'\s*<style id="cxq-mobile-fix-v1">#cxq-site-back\{display:none!important\}</style>\s*','\n',s); write(p,s)
          p=root/'click-core/src/game.css'; s=read(p); s=s.replace('.cxq-header-exit{display:inline-block;margin-left:6px;padding:3px 7px;border:1px solid #ead7ac88;border-radius:999px;background:#24191399;color:#fff3d5;text-decoration:none;font-size:9px;font-weight:900;text-shadow:none;vertical-align:middle}\n',''); write(p,s)
          p=root/'click-core/src/game.js'; s=read(p); s=s.replace('STARWISH CLICKER <a class="cxq-header-exit" href="../../index.html">返回 CxQ</a>','STARWISH CLICKER'); write(p,s)

          # Fortune: remove added return/test badge, preserve compact mobile layout.
          p=root/'fortune/index.html'; s=read(p); s=re.sub(r'<body>\s*<a class="cxq-site-back"[^>]*>.*?</a>\s*<div class="cxq-test-note">.*?</div>','<body>',s,flags=re.S); write(p,s)
          p=root/'fortune/app.js'; s=read(p); s=re.sub(r'function header\(\)\{return `<header class="quiet-header"><div class="header-left"><a class="cxq-header-back" href="\.\./\.\./index\.html">CxQ</a><button class="wordmark" data-act="home"><span>命</span><b>今日占卜</b></button></div><button class="journal-link" data-act="journal">占卜手帳 <i>\$\{state\.journal\.length\}</i></button></header>`\}', 'function header(){return `<header class="quiet-header"><button class="wordmark" data-act="home"><span>命</span><b>今日占卜</b></button><button class="journal-link" data-act="journal">占卜手帳 <i>${state.journal.length}</i></button></header>`}', s); write(p,s)
          p=root/'fortune/style.css'; s=read(p); s=re.sub(r'\.cxq-site-back\{.*?\}@media\(max-width:800px\)\{\.cxq-site-back\{.*?\}\}\s*','',s,flags=re.S); s=s.replace('.header-left{display:flex;align-items:center;gap:10px}.cxq-header-back{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fffaf3;color:#635654;text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.04em}.cxq-site-back,.cxq-test-note{display:none!important}\n',''); s=s.replace('.header-left{gap:7px}.cxq-header-back{width:34px;height:34px}',''); write(p,s)

          # Memory: iOS-safe width clamp and zero-min grid tracks.
          p=root/'memory/index.html'; s=strip_siteback_html(read(p))
          mobile='''<style id="cxq-mobile-fix-v2">\nhtml,body{width:100%!important;max-width:100%!important;height:100dvh!important;min-height:100dvh!important;overflow:hidden!important}.app{width:100%!important;height:100dvh!important;min-width:0!important;min-height:0!important;align-items:stretch!important;padding:max(4px,env(safe-area-inset-top)) 5px max(4px,env(safe-area-inset-bottom))!important}.shell{width:100%!important;max-width:650px!important;min-width:0!important;height:100%!important;max-height:none!important;margin:0 auto!important}.screen,.game,.top,.hud,.progress,.boardWrap{min-width:0!important;max-width:100%!important}.game{width:100%!important;gap:5px!important;overflow:hidden!important}.top{width:100%!important;padding:4px 6px!important}.round{width:38px!important;height:38px!important;font-size:16px!important}.hud{width:100%!important;gap:4px!important;grid-template-columns:repeat(3,minmax(0,1fr))!important}.hudBox{min-width:0!important;min-height:51px!important;padding:5px 3px!important}.hudBox span{font-size:10px!important}.hudBox b{font-size:clamp(18px,4.6vw,24px)!important}.progress{width:100%!important;height:8px!important}.boardWrap{width:100%!important;flex:1 1 auto!important;min-height:0!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;padding:3px!important;border-radius:16px!important;contain:layout paint!important}.board{flex:0 0 auto!important;min-width:0!important;min-height:0!important;width:var(--size)!important;height:var(--size)!important;max-width:calc(100vw - 10px)!important;max-height:100%!important;margin:0 auto!important;aspect-ratio:1/1!important;grid-template-columns:repeat(var(--cols),minmax(0,1fr))!important;grid-template-rows:repeat(var(--cols),minmax(0,1fr))!important;overflow:hidden!important;contain:layout paint!important}.card{min-width:0!important;min-height:0!important;width:100%!important;height:100%!important;overflow:hidden!important}.inner,.face{min-width:0!important;min-height:0!important}\n@media(max-height:700px){.top{padding:2px 5px!important}.round{width:34px!important;height:34px!important}.hudBox{min-height:44px!important}.hudBox span{font-size:9px!important}.hudBox b{font-size:18px!important}.progress{height:6px!important}.boardWrap{padding:2px!important}.game{gap:3px!important}}\n</style>'''
          if 'id="cxq-mobile-fix-v1"' in s: s=re.sub(r'<style id="cxq-mobile-fix-v1">.*?</style>',mobile,s,flags=re.S)
          elif 'id="cxq-mobile-fix-v2"' not in s: s=s.replace('</head>',mobile+'\n</head>')
          s=s.replace("function boardSize(){let r=$('.boardWrap').getBoundingClientRect();return Math.floor(Math.min(r.width-8,r.height-8))}", "function boardSize(){let r=$('.boardWrap').getBoundingClientRect(),vv=window.visualViewport,vw=Math.floor(vv?.width||document.documentElement.clientWidth||innerWidth),maxW=Math.max(0,Math.min(r.width-6,vw-16)),maxH=Math.max(0,r.height-6);return Math.max(120,Math.floor(Math.min(maxW,maxH)))}")
          fit='''<script id="cxq-mobile-fix-script-v2">(()=>{\n function fit(){const w=document.querySelector('.boardWrap'),b=document.getElementById('board'),g=document.getElementById('game');if(!w||!b||!g?.classList.contains('active'))return;requestAnimationFrame(()=>{const r=w.getBoundingClientRect(),vv=window.visualViewport,vw=Math.floor(vv?.width||document.documentElement.clientWidth||innerWidth),maxW=Math.max(0,Math.min(r.width-6,vw-16)),maxH=Math.max(0,r.height-6),n=Math.max(120,Math.floor(Math.min(maxW,maxH)));b.style.setProperty('--size',n+'px');b.style.width=n+'px';b.style.height=n+'px';b.style.marginLeft='auto';b.style.marginRight='auto';});}\n const vv=window.visualViewport;if(vv){vv.addEventListener('resize',fit,{passive:true});vv.addEventListener('scroll',fit,{passive:true})}window.addEventListener('orientationchange',()=>{setTimeout(fit,60);setTimeout(fit,220)},{passive:true});window.addEventListener('resize',fit,{passive:true});if('ResizeObserver'in window){new ResizeObserver(fit).observe(document.querySelector('.boardWrap'))}new MutationObserver(fit).observe(document.getElementById('game'),{attributes:true,attributeFilter:['class']});setTimeout(fit,30);setTimeout(fit,180);\n})();</script>'''
          if 'id="cxq-mobile-fix-script-v1"' in s: s=re.sub(r'<script id="cxq-mobile-fix-script-v1">.*?</script>',fit,s,flags=re.S)
          elif 'id="cxq-mobile-fix-script-v2"' not in s: s=s.replace('</body>',fit+'\n</body>')
          write(p,s)

          # V7 preview launcher: normal links only; browser back handles navigation.
          preview=Path('preview/mobile-fix-v7.html')
          preview.parent.mkdir(parents=True,exist_ok=True)
          preview.write_text('''<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CxQ 手機修正版 V7</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f7f2ee;color:#332d31}.bar{padding:10px 12px;text-align:center;background:#26232a;color:#fff;font-size:12px;font-weight:900}.wrap{max-width:980px;margin:auto;padding:20px 14px 44px}.head h1{margin:0;font-size:clamp(29px,7vw,46px)}.head p{margin:7px 0 18px;color:#776d72;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{display:block;overflow:hidden;border:1px solid #e1d8d2;border-radius:18px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 8px 24px #5a40330f}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.card div{padding:10px 11px}.card b{display:block;line-height:1.35}.card span{display:block;margin-top:4px;color:#7b7175;font-size:11px}.note{margin-top:18px;padding:11px 13px;border:1px solid #ead7b8;border-radius:13px;background:#fff8e9;color:#70583e;font-size:12px;line-height:1.6}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding-top:14px}}</style></head><body><div class="bar">CxQ MOBILE FIX · V7 TEST</div><main class="wrap"><section class="head"><h1>手機版修正測試</h1><p>這版已移除所有後加的「返回 CxQ／返回小遊戲」按鈕。進入遊戲後，直接使用手機或瀏覽器的返回操作即可。</p></section><section class="grid"><a class="card" href="../games/fortune/index.html"><img src="../assets/game-covers/fortune.png"><div><b>每日占卜</b><span>手機首頁壓縮</span></div></a><a class="card" href="../games/link/index.html"><img src="../assets/game-covers/link.png"><div><b>夢境織光・角色連連看</b><span>100dvh 遊戲區</span></div></a><a class="card" href="../games/brick-breaker/index.html"><img src="../assets/game-covers/brick.png"><div><b>心光旅團：記憶核心</b><span>短螢幕 UI 壓縮</span></div></a><a class="card" href="../games/click-core/index.html"><img src="../assets/game-covers/clickcore.png"><div><b>星願旅團：點亮夢境</b><span>App 式內部捲動</span></div></a><a class="card" href="../games/2048/index.html"><img src="../assets/game-covers/twenty48.png"><div><b>星願 2048</b><span>短螢幕緊湊模式</span></div></a><a class="card" href="../games/memory/index.html"><img src="../assets/game-covers/memory.png"><div><b>暮光回憶收藏室</b><span>iPhone 棋盤置中 V2</span></div></a><a class="card" href="../games/tetris/index.html"><img src="../assets/game-covers/tetris.png"><div><b>心境織境・方塊物語</b><span>控制區縮短</span></div></a></section><div class="note">記憶翻牌這版會同時限制容器寬度與 iPhone 的 visualViewport 寬度，並使用零最小值 Grid 軌道，避免 Safari 把卡片撐出右側。</div></main></body></html>''',encoding='utf-8')

          # Verify no added cross-site return remains in game program files.
          bad=[]
          for p in [root/'2048/index.html',root/'link/index.html',root/'brick-breaker/index.html',root/'click-core/index.html',root/'click-core/src/game.css',root/'click-core/src/game.js',root/'fortune/index.html',root/'fortune/style.css',root/'fortune/app.js',root/'memory/index.html',root/'tetris/index.html']:
              t=read(p)
              for token in ['cxq-site-back','cxq-home-exit','cxq-menu-exit','cxq-header-exit','cxq-header-back','返回 CxQ','返回小遊戲','回到 CxQ']:
                  if token in t: bad.append((str(p),token))
          if bad: raise SystemExit('return control remnants: '+repr(bad))
          PY
      - name: Commit patched preview
        shell: bash
        run: |
          rm -f .github/workflows/preview-mobile-fix-once.yml
          git config user.name "CxQ Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add games preview .github/workflows/preview-mobile-fix-once.yml
          git commit -m "Fix iPhone memory layout and remove added return controls"
          git push origin HEAD:preview/mobile-layout-fix-20260815
