name: Preview fortune restore and paddle lift
on:
  push:
    branches: [preview/fortune-original-paddle-up-20260815]
    paths: ['.github/workflows/preview-fortune-paddle-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/fortune-original-paddle-up-20260815
          fetch-depth: 0
      - name: Restore original fortune visual and lift paddle
        shell: bash
        run: |
          git show 1cc777a0a201520538d24a4e7ea041b3b1a42003:games/fortune/style.css > games/fortune/style.css
          python - <<'PY'
          from pathlib import Path
          p=Path('games/brick-breaker/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("H - Math.max(76, H * .11)", "H - Math.max(135, H * .17)")
          s=s.replace("H - Math.max(76,H*.11)", "H - Math.max(135,H*.17)")
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/preview-fortune-paddle-fix.yml
          git config user.name 'CxQ Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/fortune/style.css games/brick-breaker/index.html .github/workflows/preview-fortune-paddle-fix.yml
          git commit -m 'Restore original fortune visual and lift breakout paddle'
          git push origin HEAD:preview/fortune-original-paddle-up-20260815
